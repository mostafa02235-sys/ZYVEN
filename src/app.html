  `<span class="av ${square ? 'sq' : ''}" style="--s:${size}px;--h:${hue}" aria-hidden="true">${esc(initials(name))}${online ? '<i class="dot"></i>' : ''}</span>`;
const userAvatar = (id, size = 48, showOnline = true) => {
  const u = getUser(id);
  if (!u) return avatar('?', 0, size);
  const online = showOnline && u.online && !isBlocked(u.id);
  if (!u.photo) return avatar(u.name, u.hue, size, { online });
  return `<span class="av" style="--s:${size}px;--h:${u.hue};background:url('${u.photo}') center/cover no-repeat" aria-hidden="true">${online ? '<i class="dot"></i>' : ''}</span>`;
};
const avatarFor = (p, size) => p.photo
  ? `<span class="av" style="--s:${size}px;--h:${p.hue};background:url('${p.photo}') center/cover no-repeat" aria-hidden="true"></span>`
  : avatar(p.name || '?', p.hue, size);
/* Group pictures: a colour with initials, an icon, a sample scene, or an uploaded photo. */
function groupAvatar(g, size = 52) {
  const p = g.pic;
  let style = `--s:${size}px;--h:${p?.hue ?? g.hue ?? 0}`;
  let content = esc(initials(g.name || 'Group'));
  if (p?.kind === 'scene' && SCENES[p.scene]) { style += `;background:${SCENES[p.scene].bg}`; content = ''; }
  else if (p?.kind === 'photo' && p.src) { style += `;background:url('${p.src}') center/cover no-repeat`; content = ''; }
  else if (p?.kind === 'emoji') content = `<span class="av-emo">${p.e}</span>`;
  return `<span class="av sq" style="${style}" aria-hidden="true">${content}</span>`;
}
const chatAvatar = (c, size = 52) =>
  c.type === 'dm' ? userAvatar(c.userId, size) : groupAvatar(c, size);

const sysMsg = (c, text) => c.messages.push({ id: uid(), from: 'system', system: true, text, t: now() });
const joinNames = names => names.length <= 1 ? (names[0] || '') : `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
const memberCount = g => g.members.length + (g.left ? 0 : 1);

const PIC_HUES = [28, 95, 190, 250, 320, 350];
const PIC_EMOJI = [['🏔️', 150], ['🎬', 250], ['📚', 48], ['☕', 28], ['🎮', 285], ['🎉', 350]];
const PIC_SCENES = ['rooftop', 'tiles', 'trail', 'sea', 'night'];
const picKey = p => p ? `${p.kind}:${p.hue ?? ''}:${p.e ?? ''}:${p.scene ?? ''}` : '';

function picGrid(cur, target, name = 'Group') {
  const curKey = picKey(cur);
  const opt = (p, label) => `<button type="button" class="pic-opt ${picKey(p) === curKey ? 'on' : ''}" data-action="pick-gpic" data-target="${target}" data-pic="${esc(JSON.stringify(p))}" aria-label="${label}" aria-pressed="${picKey(p) === curKey}">${groupAvatar({ name, pic: p }, 44)}</button>`;
  const photo = cur?.kind === 'photo'
    ? `<button type="button" class="pic-opt on" aria-label="Your uploaded photo" aria-pressed="true">${groupAvatar({ name, pic: cur }, 44)}</button>` : '';
  return `<div class="pics">
    <h5>Colours</h5><div class="pic-row">${PIC_HUES.map(h => opt({ kind: 'hue', hue: h }, 'Colour with initials')).join('')}</div>
    <h5>Icons</h5><div class="pic-row">${PIC_EMOJI.map(([e, h]) => opt({ kind: 'emoji', e, hue: h }, `Icon ${e}`)).join('')}</div>
    <h5>Photos</h5><div class="pic-row">${photo}${PIC_SCENES.slice(0, photo ? 4 : 5).map(s => opt({ kind: 'scene', scene: s }, 'Sample photo')).join('')}
      <label class="pic-opt pic-upload" for="gpic-in" aria-label="Upload a photo from this device">${I('camera')}</label></div>
    <input type="file" id="gpic-in" accept="image/*" data-target="${target}" hidden>
  </div>`;
}

const pickRow = (u, action, on = false, extra = '') => `
  <button type="button" class="pick ${on ? 'on' : ''}" data-action="${action}" data-user="${u.id}" aria-pressed="${on}">
    ${userAvatar(u.id, 40)}
    <span class="row-main"><span class="row-name">${esc(u.name)}</span><span class="row-sub">@${esc(u.username)} · ${userStatus(u)}</span></span>
    ${extra}<span class="check">${I('check')}</span>
  </button>`;
const myAvatar = size => avatarFor(state.profile, size);

const emptyState = ({ icon, title, body, action, label }) => `
  <div class="empty">
    <div class="empty-mark">${I(icon)}</div>
    <h3>${title}</h3>
    <p>${body}</p>
    ${action ? `<button class="btn" data-action="${action}">${label}</button>` : ''}
  </div>`;

const skeletonRows = (n = 6) => Array.from({ length: n }, (_, i) => `
  <div class="skel"><i class="c"></i><span style="flex:1;display:flex;flex-direction:column;gap:9px">
    <i class="l" style="width:${45 + (i * 13) % 30}%"></i><i class="l" style="width:${65 + (i * 7) % 25}%;opacity:.6"></i></span></div>`).join('');

const searchField = (key, placeholder, value = '') => `
  <label class="search">${I('search')}
    <input id="${key}" data-input="${key}" type="search" placeholder="${placeholder}" autocomplete="off" value="${esc(value)}" aria-label="${placeholder}">
  </label>`;

const chip = (label, on, action, value, n) =>
  `<button class="chip ${on ? 'on' : ''}" data-action="${action}" data-value="${value}" aria-pressed="${on}">${label}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`;

const tickIcon = status => {
  if (status === 'sending') return `<span class="tick-pend" style="display:inline-flex" title="Sending">${I('clock')}</span>`;
  if (status === 'failed') return `<span class="tick-fail" style="display:inline-flex" title="Not sent">${I('alert')}</span>`;
  const s = (!S().privacy.readReceipts && status === 'read') ? 'delivered' : status;
  if (s === 'sent') return I('check');
  return `<span class="${s === 'read' ? 'read' : ''}" style="display:inline-flex">${I('checks')}</span>`;
};

const toggleRow = (key, icon, title, desc) => {
  const [grp, k] = key.split('.');
  const on = !!S()[grp][k];
  return `<button class="set" data-action="toggle-setting" data-key="${key}" role="switch" aria-checked="${on}">
    <span class="set-ic" style="--ic:${ICON_TINT[icon] || 'var(--fg)'}">${I(icon)}</span>
    <span class="set-txt"><b>${title}</b><span>${desc}</span></span>
    <span class="switch ${on ? 'on' : ''}"></span>
  </button>`;
};
const linkRow = (action, icon, title, desc, cls = '') => `
  <button class="set ${cls}" data-action="${action}">
    <span class="set-ic" style="--ic:${ICON_TINT[icon] || 'var(--fg)'}">${I(icon)}</span>
    <span class="set-txt"><b>${title}</b>${desc ? `<span>${desc}</span>` : ''}</span>
    <span class="chev">${I('chev')}</span>
  </button>`;

const valueRow = key => {
  const m = PRIVACY_META[key], v = S().privacy[key];
  return `<button class="set" data-action="privacy-open" data-key="${key}" aria-label="${m.title}: ${privLabel(v)}">
    <span class="set-ic" style="--ic:${ICON_TINT[m.icon] || 'var(--fg)'}">${I(m.icon)}</span>
    <span class="set-txt"><b>${m.title}</b><span>${m.desc.split('.')[0]}</span></span>
    <span class="set-val">${privLabel(v)}</span><span class="chev">${I('chev')}</span>
  </button>`;
};
const onlineLine = () => ({
  everyone: 'Online · visible to everyone',
  contacts: 'Online · visible to your contacts',
  nobody: 'Online status hidden',
}[S().privacy.onlineStatus] || 'Online');
function resolvedMode() {
  const m = S().appearance.mode;
  if (m !== 'system') return m;
  try { return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; } catch (e) { return 'dark'; }
}

function chatRow(c) {
  const last = lastMsg(c);
  const typingId = typingOf(c.id);
  let preview = '';
  if (typingId) {
    preview = `<span class="typing">${c.type === 'group' ? esc(firstName(typingId)) + ' is typing…' : 'typing…'}</span>`;
  } else if (c.draft) {
    preview = `<span class="draft">Draft</span><span class="txt">${esc(c.draft)}</span>`;
  } else if (!last) {
    preview = '<span class="txt">No messages yet. Say hello.</span>';
  } else if (last.system) {
    preview = `<span class="txt">${esc(last.text)}</span>`;
  } else {
    const mine = last.from === 'me';
    const who = mine ? 'You: ' : (c.type === 'group' ? firstName(last.from) + ': ' : '');
    const hide = !S().notify.previews && !mine;
    const text = hide ? 'New message' : msgPreview(last);
    const ic = hide ? '' : typeIcon(last);
    preview = `${mine && !last.deleted ? tickIcon(last.status) : ''}${who ? `<span class="who" style="flex:none">${esc(who)}</span>` : ''}${ic ? I(ic) : ''}<span class="txt">${esc(text)}</span>`;
  }
  return `
  <button class="row" data-action="open-chat" data-id="${c.id}" data-longpress="${c.id}">
    ${chatAvatar(c)}
    <span class="row-main">
      <span class="row-top">
        <span class="row-name">${esc(chatTitle(c))}</span>
        ${c.muted ? `<span class="mini">${I('bellOff')}</span>` : ''}
        <time class="row-time ${c.unread && !c.muted ? 'hot' : ''}">${last ? fmtListTime(last.t) : ''}</time>
      </span>
      <span class="row-bot">
        <span class="row-preview">${preview}</span>
        ${c.pinned ? `<span class="mini">${I('pin')}</span>` : ''}
        ${c.unread ? `<span class="badge ${c.muted ? 'muted' : ''}">${c.unread}</span>` : ''}
      </span>
    </span>
  </button>`;
}

function contactRow(u, { withAction = true } = {}) {
  return `
  <button class="row" data-action="user-profile" data-user="${u.id}">
    ${userAvatar(u.id, 48)}
    <span class="row-main">
      <span class="row-name">${esc(u.name)}</span>
      <span class="row-sub">@${esc(u.username)} · <span style="color:${u.online && !isBlocked(u.id) ? 'var(--online)' : 'inherit'}">${userStatus(u)}</span></span>
    </span>
    ${isBlocked(u.id) ? `<span class="tag">${I('block', 'style="width:11px;height:11px;display:inline;vertical-align:-1px;margin-right:3px"')}Blocked</span>` : ''}
    ${withAction ? `<span class="row-action" data-action="open-dm" data-user="${u.id}" role="button" aria-label="Message ${esc(u.name)}">${I('chat')}</span>` : ''}
  </button>`;
}

function renderNav() {
  const tabs = [
    ['chats', 'chat', 'Chats'], ['contacts', 'contacts', 'Contacts'],
    ['groups', 'groups', 'Groups'], ['profile', 'user', 'Profile'],
  ];
  const badges = S().notify.badges;
  const unreadDM = badges ? state.chats.filter(c => !c.muted && c.unread).length : 0;
  const unreadG = badges ? state.chats.filter(c => c.type === 'group' && !c.muted && c.unread).length : 0;
  const idx = tabs.findIndex(t => t[0] === ui.tab);
  $('#nav').innerHTML = `<span class="nav-ind" style="transform:translateX(${idx * 100}%)"></span>` + tabs.map(([id, icon, label]) => {
    const n = id === 'chats' ? unreadDM : id === 'groups' ? unreadG : 0;
    return `<button class="nav-btn ${ui.tab === id ? 'on' : ''}" data-action="tab" data-tab="${id}" aria-current="${ui.tab === id ? 'page' : 'false'}">
      ${I(icon)}<span>${label}</span>${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }).join('');
}

function renderChatsList() {
  const q = ui.chatQuery.trim().toLowerCase();
  const all = sortedChats();
  const unreadCount = all.filter(c => c.unread).length;
  $('#chat-chips').innerHTML =
    chip('All', ui.chatFilter === 'all', 'chat-filter', 'all') +
    chip('Unread', ui.chatFilter === 'unread', 'chat-filter', 'unread', unreadCount || null) +
    '';

  const box = $('#chats-list');
  if (!state.chats.length) {
    box.innerHTML = emptyState({ icon: 'inbox', title: 'No conversations yet', body: 'Find people by their username, add them to your contacts, and start talking.', action: 'new-chat', label: 'Start a conversation' });
    return;
  }
  if (q) {
    const scope = all.filter(c => !(ui.chatFilter === 'unread' && !c.unread) && !(ui.chatFilter === 'dm' && c.type !== 'dm') && !(ui.chatFilter === 'group' && c.type !== 'group'));
    renderSearchResults(q, ui.chatQuery.trim(), scope);
    return;
  }
  let list = all.filter(c => {
    if (ui.chatFilter === 'unread' && !c.unread) return false;
    if (ui.chatFilter === 'dm' && c.type !== 'dm') return false;
    if (ui.chatFilter === 'group' && c.type !== 'group') return false;
    if (!q) return true;
    return chatTitle(c).toLowerCase().includes(q) || c.messages.some(m => !m.deleted && msgPreview(m).toLowerCase().includes(q));
  });
  if (!list.length) {
    box.innerHTML = q
      ? emptyState({ icon: 'search', title: 'No matches', body: `Nothing in your conversations matches “${esc(ui.chatQuery)}”.` })
      : emptyState({ icon: 'check', title: 'All caught up', body: 'No conversations in this filter right now.' });
    return;
  }
  const pinned = list.filter(c => c.pinned), rest = list.filter(c => !c.pinned);
  box.innerHTML =
    (pinned.length ? `<div class="section-label">${I('pin')}Pinned</div>${pinned.map(chatRow).join('')}` : '') +
    (rest.length ? `${pinned.length ? '<div class="section-label">Recent</div>' : ''}${rest.map(chatRow).join('')}` : '') +
    `<p class="hint">Press and hold a conversation for more options</p>`;
}

function renderContactsList() {
  const q = ui.contactQuery.trim().toLowerCase();
  const people = state.users.filter(u => u.contact);
  const online = people.filter(u => u.online).length;
  $('#contact-count').textContent = people.length;
  $('#contact-chips').innerHTML =
    chip('Everyone', ui.contactFilter === 'all', 'contact-filter', 'all') +
    chip('Online now', ui.contactFilter === 'online', 'contact-filter', 'online', online);
  const box = $('#contacts-list');
  if (!ui.visited.has('contacts')) { box.innerHTML = skeletonRows(); return; }
  if (!people.length) {
    box.innerHTML = emptyState({ icon: 'contacts', title: 'Your contact list is empty', body: 'Search for people on ZYVEN by their username or name, then add them here.', action: 'add-contact', label: 'Find people' });
    return;
  }
  const list = people
    .filter(u => ui.contactFilter !== 'online' || u.online)
    .filter(u => !q || u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q.replace(/^@/, '')))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length) {
    box.innerHTML = emptyState({ icon: 'search', title: 'No one found', body: q ? `No contact matches “${esc(ui.contactQuery)}”.` : 'Nobody is online right now.', action: q ? 'add-contact' : '', label: 'Add a contact' });
    return;
  }
  let html = '', letter = '';
  list.forEach(u => {
    const L = u.name[0].toUpperCase();
    if (L !== letter) { letter = L; html += `<div class="section-label">${L}</div>`; }
    html += contactRow(u);
  });
  box.innerHTML = html;
}

function renderGroupsList() {
  const q = ui.groupQuery.trim().toLowerCase();
  const groups = sortedChats().filter(c => c.type === 'group');
  $('#group-count').textContent = groups.length;
  const box = $('#groups-list');
  if (!ui.visited.has('groups')) { box.innerHTML = skeletonRows(4); return; }
  if (!groups.length) {
    box.innerHTML = emptyState({ icon: 'groups', title: 'No groups yet', body: 'Bring a few people together for plans, projects, or the family chat.', action: 'create-group', label: 'Create a group' });
    return;
  }
  const list = groups.filter(g => !q || g.name.toLowerCase().includes(q));
  if (!list.length) {
    box.innerHTML = emptyState({ icon: 'search', title: 'No matches', body: `No group is called “${esc(ui.groupQuery)}”.` });
    return;
  }
  box.innerHTML = list.map(g => {
    const last = lastMsg(g);
    const typingId = typingOf(g.id);
    const prev = typingId ? `<span class="typing">${esc(firstName(typingId))} is typing…</span>`
      : last ? `<span class="txt">${last.system ? '' : `<span class="who">${last.from === 'me' ? 'You' : esc(firstName(last.from))}: </span>`}${esc(!S().notify.previews && last.from !== 'me' && !last.system ? 'New message' : msgPreview(last))}</span>` : '<span class="txt">No messages yet</span>';
    return `
    <button class="row" data-action="open-chat" data-id="${g.id}" data-longpress="${g.id}">
      ${chatAvatar(g)}
      <span class="row-main">
        <span class="row-top">
          <span class="row-name">${esc(g.name)}</span>
          <span class="tag">${g.left ? 'You left' : `${memberCount(g)} members`}</span>
          ${g.muted ? `<span class="mini">${I('bellOff')}</span>` : ''}
          <time class="row-time ${g.unread && !g.muted ? 'hot' : ''}">${last ? fmtListTime(last.t) : ''}</time>
        </span>
        <span class="row-bot"><span class="row-preview">${prev}</span>${g.unread ? `<span class="badge ${g.muted ? 'muted' : ''}">${g.unread}</span>` : ''}</span>
      </span>
    </button>`;
  }).join('');
}

function renderProfile() {

  } else {
    if (c.left) sub = 'You left this group';
    else if (typingId) { sub = `${firstName(typingId)} is typing…`; live = true; }

/* ---------- Message building blocks ---------- */
const findMsg = id => getChat(ui.openChatId)?.messages.find(m => m.id === id);
const senderName = m => m.from === 'me' ? 'You' : (getUser(m.from)?.name || 'Former member');

function quoteHtml(c, id) {
  const r = c.messages.find(x => x.id === id);
  const hue = r && r.from !== 'me' ? (getUser(r.from)?.hue ?? 0) : (state.profile.hue ?? 0);
  return `<button type="button" class="quote" data-action="jump" data-msg="${id}" style="--h:${hue}" aria-label="Go to the original message">
    <b>${I('reply')}${r ? esc(senderName(r)) : 'Message'}</b>
    <span>${r ? esc(msgPreview(r)) : 'Original message is no longer available'}</span></button>`;
}

function mediaBlock(m, metaHtml) {
  const sc = SCENES[m.scene];
  const r = m.ratio || sc?.ratio || 4 / 3;
  const w = r >= 1 ? 252 : Math.max(168, Math.round(300 * r));
  const bg = m.src ? `url('${m.src}') center/cover no-repeat`
    : m.poster ? `url('${m.poster}') center/cover no-repeat`
    : sc ? sc.bg : 'var(--surface-3)';
  return `<button type="button" class="media" data-action="view-media" data-msg="${m.id}" style="width:${w}px;aspect-ratio:${r};background:${bg}" aria-label="Open ${m.type === 'video' ? 'video' : 'photo'}">
    ${m.type === 'video' ? `<span class="vd">${I('film')}${fmtDur(m.duration)}</span><span class="play">${I('play')}</span>` : ''}
    ${metaHtml ? `<span class="ometa">${metaHtml}</span>` : ''}</button>`;
}

function voiceBlock(m) {
  const bars = (m.wave || makeWave(1)).map(v => `<i style="height:${Math.round(18 + v * 82)}%"></i>`).join('');
  const has = !!voiceSrc(m);
  return `<div class="voice ${has ? '' : 'noaudio'}" data-voice="${m.id}">
    <button type="button" class="vplay" data-action="voice-play" data-msg="${m.id}" aria-label="${has ? 'Play voice message' : 'Sample voice note without audio'}">${I('play')}</button>
    <div class="vwave" data-action="voice-seek" data-msg="${m.id}" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="${m.duration}"><div class="vbars">${bars}</div><div class="vbars fill">${bars}</div></div>
    <span class="vdur">${has ? fmtDur(m.durationExact || m.duration) : fmtDur(m.duration)}</span></div>`;
}

function msgBubble(c, m, { cont = false, first = true, isNew = false, peek = false } = {}) {
  const mine = m.from === 'me';
  const isGroup = c.type === 'group' && !peek;
  const sender = getUser(m.from);
  const nameHtml = isGroup && !mine && first ? `<span class="sender" style="--h:${sender?.hue ?? 0}">${esc(senderName(m))}</span>` : '';
  const pinnedHere = !peek && (c.pins || []).includes(m.id) && !m.deleted;
  const meta = `<span class="bmeta">${pinnedHere ? `<span class="mi" title="Pinned">${I('pin')}</span>` : ''}${m.expiresAt && !m.deleted ? `<span class="mi" title="Disappears ${esc(fmtFuture(m.expiresAt))}">${I('timer')}</span>` : ''}${m.edited && !m.deleted ? '<span class="ed">edited</span>' : ''}${fmtTime(m.t)}${mine && !m.deleted ? tickIcon(m.status) : ''}</span>`;
  const fwd = m.forwarded && !m.deleted ? `<span class="fwd">${I('forward')}Forwarded</span>` : '';
  const type = m.type || 'text';
  let cls = '', inner;
  if (m.deleted) {
    cls = 'del';
    inner = `<span class="btext">${I('block')}${m.deletedBy === 'admin' ? 'Removed by an admin' : mine ? 'You deleted this message' : 'This message was deleted'}</span>${meta}`;
  } else {
    const quote = fwd + (m.replyTo ? quoteHtml(c, m.replyTo) : '');
    if (type === 'file') {
      cls = 'has-file';
      inner = `${nameHtml}${quote}${fileBlock(m)}${m.caption ? `<span class="cap"><span class="btext">${esc(m.caption)}</span></span>` : ''}${meta}`;
    } else if (type === 'location') {
      cls = 'has-loc';
      inner = `${nameHtml}${quote}${locBlock(m)}${meta}`;
    } else if (type === 'image' || type === 'video') {
      cls = 'has-media';
      inner = `${nameHtml}${quote}${mediaBlock(m, m.caption ? '' : meta)}${m.caption ? `<span class="cap"><span class="btext">${esc(m.caption)}</span>${meta}</span>` : ''}`;
    } else if (type === 'sticker') {
      cls = 'stk-b';
      const st = getSticker(m.stickerId);
      inner = `${nameHtml}${quote}<button type="button" class="stk-hit" data-action="sticker-open" data-sid="${m.stickerId}" aria-label="Sticker: ${esc(st?.name || 'unavailable')}">${stickerImg(st)}</button>${meta}`;
    } else if (type === 'voice') {
      cls = 'has-voice';
      inner = `${nameHtml}${quote}${voiceBlock(m)}${meta}`;
    } else {
      if (!quote && !nameHtml && isJumbo(m.text)) cls = 'jumbo';
      inner = `${nameHtml}${quote}<span class="btext">${esc(m.text)}</span>${meta}`;
    }
  }
  const rx = !m.deleted && m.reactions ? Object.entries(m.reactions).filter(([, us]) => us.length) : [];
  const reacts = rx.length ? `<div class="reacts">${rx.map(([e, us]) =>
    `<button type="button" class="react ${us.includes('me') ? 'mine' : ''}" data-action="react" data-msg="${m.id}" data-e="${esc(e)}" aria-label="${esc(e)} reaction, ${us.length}">${esc(e)}${us.length > 1 ? `<b>${us.length}</b>` : ''}</button>`).join('')}</div>` : '';
  const deco = !['stk-b', 'jumbo', 'del'].includes(cls);
  const dt = deco && !['has-media', 'has-file', 'has-loc', 'has-voice'].includes(cls);
  return `<div class="mrow ${mine ? 'me' : 'them'} ${cont ? 'cont' : 'tail'} ${isNew ? 'new' : ''} ${deco ? 'dc' : ''}" data-mid="${m.id}">
    ${isGroup && !mine ? `<span class="mav">${!cont ? userAvatar(m.from, 28, false) : ''}</span>` : ''}
    <div class="mcol"><div class="bubble ${cls} ${deco ? 'deco' : ''} ${dt ? 'dt' : ''} ${m.pending ? 'sending' : ''}" ${m.deleted || peek ? '' : `data-msgpress="${m.id}"`}>${inner}</div>${reacts}${m.status === 'failed' && !peek ? `<button type="button" class="retry" data-action="msg-retry" data-msg="${m.id}">${I('alert')}Not sent · Tap to retry</button>` : ''}</div></div>`;
}

function convoEmpty(c) {
  const dm = c.type === 'dm';
  const u = dm && getUser(c.userId);
  const name = dm ? (u ? u.name.split(' ')[0] : 'them') : c.name;
  const starters = ['👋', 'Hey! How are you?', 'Free for a quick call later?'];
  return `<div class="convo-empty">
    ${chatAvatar(c, 84)}
    <h3>Say hello to ${esc(name)}</h3>
    <p>${dm ? `@${esc(u?.username || '')} · ${esc(u ? userStatus(u) : '')}` : `${c.members.length + 1} members`}</p>
    <div class="starters">${starters.map(s => `<button class="chip" data-action="starter" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <p class="hint">Double-tap any message to react with ❤️</p>
  </div>`;
}

function renderMessages() {
  const c = getChat(ui.openChatId); if (!c) return;
  const box = $('#msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const prevCount = +(box.dataset.count || 0);
  const dayOf = m => startOfDay(m.t);
  const joins = (a, b) => a && b && !a.system && !b.system && a.from === b.from && dayOf(a) === dayOf(b) && Math.abs(b.t - a.t) < 5 * MIN && !b.replyTo;

  let html = c.hasMore
    ? `<div class="older"><button type="button" class="chip" data-action="load-older" id="load-older">${I('refresh')}Load earlier messages</button></div>`
    : `<div class="sim-note">${I('lock')}<span>Only people in this chat can read these messages. They’re kept on the ZYVEN server so they reach every device.</span></div>`;
  let lastDay = null;
  c.messages.forEach((m, i) => {
    const d = dayOf(m);
    if (d !== lastDay) { html += `<div class="day">${fmtDay(m.t)}</div>`; lastDay = d; }
    if (m.system) { html += `<div class="sys">${esc(m.text)}</div>`; return; }
    const prev = c.messages[i - 1], next = c.messages[i + 1];
    html += msgBubble(c, m, { cont: joins(m, next), first: !joins(prev, m), isNew: !ui.seen.has(m.id) });
  });
  const typingId = typingOf(c.id);
  if (!c.messages.some(m => !m.system) && !typingId) html += convoEmpty(c);
  if (typingId) {
    html += `<div class="mrow them tail new dc">${c.type === 'group' ? `<span class="mav">${userAvatar(typingId, 28, false)}</span>` : ''}<div class="mcol"><div class="bubble typing-b deco" aria-label="${esc(firstName(typingId))} is typing"><i></i><i></i><i></i></div></div></div>`;
  }
  box.innerHTML = html;
  c.messages.forEach(m => ui.seen.add(m.id));

  if (box.dataset.fresh || nearBottom) {
    box.scrollTop = box.scrollHeight; ui.newBelow = 0; delete box.dataset.fresh;
  } else if (c.messages.length > prevCount && lastMsg(c)?.from !== 'me') {
    ui.newBelow += c.messages.length - prevCount;
  }
  box.dataset.count = c.messages.length;
  updateVoiceUI();
  updateFab();
}

function updateFab() {
  const box = $('#msgs'), fab = $('#to-bottom'), n = $('#to-bottom-n');
  if (!box || !fab) return;
  const far = box.scrollHeight - box.scrollTop - box.clientHeight > 220;
  fab.classList.toggle('show', far);
  n.hidden = !ui.newBelow; n.textContent = ui.newBelow;
}

function jumpTo(id) {
  const box = $('#msgs');
  const row = box.querySelector(`[data-mid="${id}"]`);
  if (!row) { toast('The original message is no longer here', 'info'); return; }
  box.scrollTo({ top: row.offsetTop - box.clientHeight / 2 + row.offsetHeight / 2, behavior: 'smooth' });
  row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash');
}

/* ---------- Reply / edit context bar ---------- */
function renderCtx() {
  const box = $('#ctx');

  const m = id && findMsg(id);
  if (!mode || !m) { box.hidden = true; box.innerHTML = ''; return; }
  const label = mode === 'reply'
    ? `Replying to ${m.from === 'me' ? 'yourself' : esc(senderName(m))}`
    : 'Editing message';
  box.innerHTML = `${I(mode === 'reply' ? 'reply' : 'pen')}
    <span class="t"><b>${label}</b><span>${esc(msgPreview(m))}</span></span>
    <button type="button" class="icon-btn ghost" data-action="ctx-cancel" aria-label="Cancel ${mode === 'reply' ? 'reply' : 'editing'}">${I('x')}</button>`;
  box.hidden = false;
}
function clearCompose() {
  ui.compose = { mode: null, id: null, prevDraft: '' };
  renderCtx(); updateComposerBtn();
}
function cancelCompose() {
  const ta = $('#composer');
  if (ui.compose.mode === 'edit') {
    ta.value = ui.compose.prevDraft || '';
    const c = getChat(ui.openChatId); if (c) c.draft = ta.value;
    autoGrow(ta);
  }
  clearCompose(); save();
}
function startReply(id) {
  if (ui.compose.mode === 'edit') cancelCompose();
  ui.compose = { mode: 'reply', id, prevDraft: '' };
  renderCtx(); updateComposerBtn();
  setTimeout(() => $('#composer').focus(), 280);
}
function startEdit(id) {
  const m = findMsg(id); if (!m) return;
  const ta = $('#composer');
  ui.compose = { mode: 'edit', id, prevDraft: ui.compose.mode === 'edit' ? ui.compose.prevDraft : ta.value };
  ta.value = m.text; autoGrow(ta);
  renderCtx(); updateComposerBtn();
  setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 280);
}

/* ---------- Reactions ---------- */
function toggleReaction(id, emoji) {
  const m = findMsg(id); if (!m || m.deleted || m.pending || m.status === 'failed') return;
  const c = getChat(ui.openChatId); if (!c || c.left) return;
  const before = JSON.stringify(m.reactions || {});
  Cloud.rpc('toggle_reaction', { msg: id, emoji }).then(r => { m.reactions = mapReactions(r); refresh(); },
    e => { m.reactions = JSON.parse(before); refresh(); toast(cloudError(e), 'info'); });
  m.reactions = m.reactions || {};
  const had = (m.reactions[emoji] || []).includes('me');
  Object.keys(m.reactions).forEach(k => {
    m.reactions[k] = m.reactions[k].filter(u => u !== 'me');
    if (!m.reactions[k].length) delete m.reactions[k];
  });
  if (!had) { (m.reactions[emoji] = m.reactions[emoji] || []).push('me'); pushRecent(emoji); }
  refresh();
}
function pushRecent(e) {
  state.recentEmoji = [e, ...(state.recentEmoji || []).filter(x => x !== e)].slice(0, 16);
}

function emojiPickerHtml(mode, msgId = '') {

  if (state.recentEmoji?.length) cats.push(['Recent', { tab: '🕘', list: state.recentEmoji.join(' ') }]);
  cats.push(...Object.entries(EMOJI));
  const sid = name => `emo-${mode}-${name.toLowerCase()}`;
  return `<div class="emo-tabs" role="tablist">${cats.map(([name, c], i) =>
      `<button type="button" class="${i === 0 ? 'on' : ''}" data-action="emoji-cat" data-target="${sid(name)}" aria-label="${name}">${c.tab}</button>`).join('')}</div>
    <div class="emo-grid">${cats.map(([name, c]) => `<div class="emo-sec" id="${sid(name)}"><h5>${name}</h5><div class="emo-row">${
      c.list.split(' ').filter(Boolean).map(e => `<button type="button" class="emo" data-action="emoji-pick" data-mode="${mode}" data-msg="${msgId}" data-e="${e}" aria-label="${e}">${e}</button>`).join('')}</div></div>`).join('')}</div>`;
}
/* One expression panel with Emoji · Stickers · GIFs tabs.
   toggleEmoji(false) closes; toggleEmoji(true, tab) opens on a tab;
   toggleEmoji(undefined, tab) toggles, or switches tab when already open. */
function toggleEmoji(force, tab) {
  const p = $('#emoji-panel'), btn = $('#emoji-btn'), sbtn = $('#sticker-btn');
  if (!p) return;
  const isOpen = p.classList.contains('open');
  let open;
  if (force !== undefined) open = force;
  else open = !(isOpen && (!tab || tab === ui.xpTab || (tab === 'stickers' && ui.xpTab === 'gifs')));
  if (open) {
    stopRecording(false, true);
    const next = tab || ui.xpTab || 'emoji';
    if (!isOpen || next !== ui.xpTab || !p.innerHTML) { ui.xpTab = next; renderXP(); }
    $('#composer').blur();
  }

    else html += others.map(u => { Cloud.remember(u); return row(u); }).join('');
  }
  box.innerHTML = html;
}
/* Server search, shared by "New conversation" and "Find people". */
function searchPeople(raw, render) {
  const qq = raw.trim().toLowerCase().replace(/^@/, '');
  clearTimeout(ui.peopleTimer);
  ui.peopleError = '';
  if (!qq) { ui.peopleResults = null; render(); return; }
  if (ui.peopleResults?.q !== qq) ui.peopleResults = null;
  render();
  ui.peopleTimer = setTimeout(async () => {
    try {
      const list = await Cloud.search(qq);
      if ((ui.lastPeopleQ || '') !== qq) return;
      ui.peopleResults = { q: qq, list };
    } catch (e) { ui.peopleError = cloudError(e, 'Search isn’t available right now.'); }
    render();
  }, 280);
  ui.lastPeopleQ = qq;
}

function squarePhoto(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height), out = 256;
      const cv = document.createElement('canvas'); cv.width = cv.height = out;
      cv.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, out, out);
      try { cb(cv.toDataURL('image/jpeg', 0.8)); } catch (e) { toast('That photo couldn’t be used', 'image'); }
    };
    img.onerror = () => toast('That image couldn’t be opened. Try a JPG or PNG.', 'image');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function filterPicks(listSel, q, raw) {
  const list = $(listSel); if (!list) return;
  const s = q.trim().toLowerCase().replace(/^@/, '');
  let shown = 0;
  list.querySelectorAll('.pick').forEach(p => {
    const u = getUser(p.dataset.user);
    const ok = !s || u.name.toLowerCase().includes(s) || u.username.includes(s);
    p.hidden = !ok; if (ok) shown++;
  });
  let h = list.querySelector('.no-match');
  if (!shown) {
    if (!h) { h = document.createElement('p'); h.className = 'hint no-match'; list.appendChild(h); }
    h.textContent = `No contacts match “${raw.trim()}”`; h.hidden = false;
  } else if (h) h.hidden = true;
}

async function blockUser(id, from) {
  const u = getUser(id); if (!u) return;
  const ok = await confirmDialog({ title: `Block ${esc(u.name)}?`, body: 'Neither of you will be able to send private messages to the other. They aren’t notified.', confirmLabel: 'Block', danger: true });
  if (!ok) { reopenFrom(from, id); return; }
  try { await Cloud.block(id); } catch (e) { toast(cloudError(e), 'info'); reopenFrom(from, id); return; }
  const dm = state.chats.find(c => c.type === 'dm' && c.userId === id);
  if (dm) { delete ui.typing[dm.id]; if (ui.openChatId === dm.id && ui.compose.mode) cancelCompose(); }
  refresh(); renderProfile(); reopenFrom(from, id);
  toast(`${u.name} blocked`, 'block');
}
async function unblockUser(id, from) {
  const u = getUser(id); if (!u) return;
  try { await Cloud.unblock(id); } catch (e) { toast(cloudError(e), 'info'); return; }
  refresh(); renderProfile(); reopenFrom(from, id);
  toast(`${u.name} unblocked`, 'check');
}

function hl(s, q) {

  const low = s.toLowerCase(); let out = '', i = 0, j;
  while ((j = low.indexOf(q, i)) !== -1) { out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>'; i = j + q.length; }
  return out + esc(s.slice(i));
}
function snippet(s, q) {
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return s.slice(0, 90);
  const st = Math.max(0, i - 24);
  return (st ? '…' : '') + s.slice(st, i + q.length + 70);
}

function forwardMessage() {
  const f = ui.fwd; if (!f || !f.set.size) return;
  const src = getChat(f.from)?.messages.find(m => m.id === f.msgId); if (!src || src.pending) return;
  const names = [];
  const copy = src.meta?.path ? { path: src.meta.path, poster_path: src.meta.poster_path } : null;
  f.set.forEach(cid => {
    const c = getChat(cid); if (!c) return;
    const msg = { id: uid(), from: 'me', t: now(), forwarded: true };
    FWD_KEYS.forEach(k => { if (src[k] !== undefined) msg[k] = src[k]; });
    msg.type = msg.type || 'text';
    delete msg.local;
    if (ui.audioUrls.has(src.id)) ui.audioUrls.set(msg.id, ui.audioUrls.get(src.id));

    Cloud.send(c, msg, files);
    names.push(chatTitle(c));
  });
  closeOverlay(); refresh();
  toast(names.length === 1 ? `Forwarding to ${names[0]}` : `Forwarding to ${names.length} chats`, 'forward');
}

  state.chats.forEach(c => {
    const before = c.messages.length;
    const gone = c.messages.filter(m => m.expiresAt && m.expiresAt <= t);
    if (!gone.length) return;
    c.messages = c.messages.filter(m => !(m.expiresAt && m.expiresAt <= t));
    gone.forEach(m => ['audioUrls', 'fileUrls'].forEach(k => { const u = ui[k].get(m.id); if (u) { URL.revokeObjectURL(u); ui[k].delete(m.id); } }));
    c.pins = (c.pins || []).filter(id => c.messages.some(m => m.id === id));

/* ---------- Saving files to the device ----------

/* ---------- Backup and restore ----------
   Chats, contacts, and the profile live on the server. A backup file holds
   what only this phone keeps: theme, bubble design, notification choices,
   your stickers, and saved messages. Older backups (from the prototype)
   restore the same parts; their sample people and chats are ignored. */
async function exportBackup() {
  const prefs = { appearance: S().appearance, notify: S().notify, typing: S().privacy.typing, chatStyle: state.chatStyle, stickers: state.stickers, recentEmoji: state.recentEmoji, saved: state.saved };
  const data = JSON.stringify({ app: CONFIG.appName, kind: 'settings', exportedAt: new Date().toISOString(), prefs });
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const r = await saveBlobToDevice(`zyven-settings-${stamp}.json`, new Blob([data], { type: 'application/json' }));

}

  if (!file) return;
  let obj;

  const old = obj?.state || (obj?.v ? obj : null);
  const prefs = obj?.prefs || (old ? { appearance: old.settings?.appearance, notify: old.settings?.notify, chatStyle: old.chatStyle, stickers: old.stickers, recentEmoji: old.recentEmoji } : null);

/* ---------- Search across chats ---------- */
function renderSearchResults(q, raw, chats) {
  const box = $('#chats-list');
  const qq = q.replace(/^@/, '');
  const chatHits = chats.filter(c => chatTitle(c).toLowerCase().includes(q));
  const contactHits = state.users.filter(u => (u.name.toLowerCase().includes(q) || u.username.includes(qq)) && !chatHits.some(c => c.type === 'dm' && c.userId === u.id));
  const msgHits = [], fileHits = [];
  chats.forEach(c => c.messages.forEach(m => {
    if (m.system || m.deleted) return;
    const t = m.type || 'text';
    const txt = t === 'text' ? (m.text || '') : (m.caption || '');
    if (txt && txt.toLowerCase().includes(q)) msgHits.push({ c, m, txt });
    const fname = t === 'file' ? m.name : t === 'sticker' ? getSticker(m.stickerId)?.name : t === 'location' ? m.label : '';
    if (fname && fname.toLowerCase().includes(q)) fileHits.push({ c, m, txt: fname });
  }));
  msgHits.sort((a, b) => b.m.t - a.m.t); fileHits.sort((a, b) => b.m.t - a.m.t);
  const who = (c, m) => m.from === 'me' ? 'You: ' : c.type === 'group' ? `${firstName(m.from)}: ` : '';
  const resRow = ({ c, m, txt }, isFile) => `
    <button class="row" data-action="open-result" data-id="${c.id}" data-msg="${m.id}">
      ${isFile ? `<span class="res-ic" style="--ic:${m.type === 'file' ? fileKind(m).color : m.type === 'location' ? '#FF8E7F' : '#FF7AB6'}">${I(typeIcon(m) || 'file')}</span>` : chatAvatar(c, 44)}
      <span class="row-main"><span class="row-top"><span class="row-name">${isFile ? hl(txt, q) : esc(chatTitle(c))}</span><time class="row-time">${fmtListTime(m.t)}</time></span>
      <span class="row-sub">${isFile ? `${esc(chatTitle(c))} · ${m.type === 'file' ? fmtBytes(m.size || 0) : m.type === 'sticker' ? 'Sticker' : 'Location'}` : `${esc(who(c, m))}${hl(snippet(txt, q), q)}`}</span></span>
    </button>`;
  let html = '';
  if (chatHits.length) html += `<div class="section-label">Chats · ${chatHits.length}</div>${chatHits.map(chatRow).join('')}`;
  if (contactHits.length) html += `<div class="section-label">Contacts · ${contactHits.length}</div>${contactHits.map(u => `
    <button class="row" data-action="open-dm" data-user="${u.id}">${userAvatar(u.id, 44)}<span class="row-main"><span class="row-name">${hl(u.name, q)}</span><span class="row-sub">@${esc(u.username)} · Start a conversation</span></span></button>`).join('')}`;
  if (msgHits.length) html += `<div class="section-label">Messages · ${msgHits.length}</div>${msgHits.slice(0, 40).map(h => resRow(h, false)).join('')}`;
  if (fileHits.length) html += `<div class="section-label">Files, stickers & places · ${fileHits.length}</div>${fileHits.slice(0, 30).map(h => resRow(h, true)).join('')}`;
  box.innerHTML = html || emptyState({ icon: 'search', title: 'No matches', body: `No chats, people, messages, or files match “${esc(raw)}”.` });
}

/* Frame-sequence player: one timer drives every visible animated sticker.

const animCache = new Map();
function animInfo(id) {
  if (id !== '__draft' && animCache.has(id)) return animCache.get(id);

  if (!st || !st.frames?.length) return null;
  let t = 0; const cum = st.frames.map(f => (t += f.ms || 100));
  const info = { st, cum, total: t };
  if (id !== '__draft') animCache.set(id, info);
  return info;
}

  const imgs = document.querySelectorAll('img[data-anim]');

  const now = performance.now();
  imgs.forEach(img => {
    if (!img.offsetParent) return;
    const a = animInfo(img.dataset.anim); if (!a) return;
    const t = now % a.total;
    let i = 0; while (i < a.cum.length - 1 && a.cum[i] <= t) i++;
    if (img.dataset.fi !== String(i)) { img.dataset.fi = i; img.src = a.st.frames[i].src; }

}, 40);

        case 'location': ['lat', 'lng', 'acc', 'label'].forEach(k => { if (msg[k] !== undefined) meta[k] = msg[k]; }); break;
        default: throw new Error('Unsupported message');
      }
      for (const [key, blob, name] of uploads) {
        if (!blob) throw new Error('The file for this message is no longer on this phone. Delete it and send it again.');
        if (blob.size > 25 * 1024 * 1024) throw new Error('too large');
        meta[key] = await Media.upload(`${c.id}/${msg.id}/${name}`, blob, blob.type);
      }
      for (const [key, from] of copies) meta[key] = await Media.copy(from, `${c.id}/${msg.id}/${from.split('/').pop()}`);
      const { data, error } = await sb.from('messages').insert({ id: msg.id, conversation_id: c.id, kind: msg.type, body, meta }).select(MSG_COLS).single();
      if (error) throw error;
      await Media.sign(metaPaths(data.meta));
      Object.assign(msg, { pending: false, status: 'sent', t: Date.parse(data.created_at), at: data.created_at, meta: data.meta });
      if (data.expires_at) msg.expiresAt = Date.parse(data.expires_at);
      setMediaUrls(msg);
      ui.outbox?.delete(msg.id);
      sortMsgs(c.messages);
      computeReceipts(c);
    } catch (e) {
      console.warn('ZYVEN: send failed', e);
      msg.pending = false; msg.status = 'failed';
      msg.error = /no longer/.test(e?.message || '') ? e.message : cloudError(e, 'Not sent. Tap the message to try again.');
      toast(msg.error, 'info');
    }
    refresh();
  },
};

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const authForms = {
  async signin() {
    const email = $('#au-email').value.trim(), password = $('#au-pass').value;
    Auth.email = email;
    if (!EMAIL_RE.test(email)) return Auth.err('Enter your email address.');
    if (!password) return Auth.err('Enter your password.');
    Auth.err(''); Auth.setBusy(true, 'Signing in…');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    Auth.setBusy(false);
    if (error) return Auth.err(authError(error));
    await Cloud.start(data.user);
  },
  async signup() {
    const name = $('#au-name').value.trim(), username = $('#au-user').value.trim().replace(/^@/, '').toLowerCase();
    const email = $('#au-email').value.trim(), password = $('#au-pass').value;
    Auth.email = email;
    if (!name) return Auth.err('Enter your name.');
    if (!/^[a-z0-9._]{3,24}$/.test(username)) return Auth.err('Usernames use 3–24 lowercase letters, numbers, dots, or underscores.');
    if (!EMAIL_RE.test(email)) return Auth.err('Enter a valid email address.');
    if (password.length < 8) return Auth.err('Use a password with at least 8 characters.');
    Auth.err(''); Auth.setBusy(true, 'Creating account…');
    try {
      const { data: free, error: e1 } = await sb.rpc('username_available', { name: username });
      if (e1) throw e1;
      if (!free) { Auth.setBusy(false); return Auth.err(`@${username} is already taken. Try another username.`); }
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { username, display_name: name, hue: pick(CONFIG.avatarHues) } } });
      if (error) throw error;
      Auth.setBusy(false);
      if (data.session && data.user) await Cloud.start(data.user);
      else Auth.show('confirm');
    } catch (e) { Auth.setBusy(false); Auth.err(authError(e)); }
  },
  async forgot() {
    const email = $('#au-email').value.trim();
    Auth.email = email;
    if (!EMAIL_RE.test(email)) return Auth.err('Enter your account’s email address.');
    Auth.err(''); Auth.setBusy(true, 'Sending…');
    const { error } = await sb.auth.resetPasswordForEmail(email);
    Auth.setBusy(false);
    if (error) return Auth.err(authError(error));

    const email = $('#au-email').value.trim(), token = $('#au-code').value.replace(/\s+/g, ''), password = $('#au-pass').value;
    Auth.email = email;
    if (!EMAIL_RE.test(email)) return Auth.err('Enter your account’s email address.');
    if (!/^\d{6,10}$/.test(token)) return Auth.err('Enter the code from the email.');
    if (password.length < 8) return Auth.err('Use a password with at least 8 characters.');
    Auth.err(''); Auth.setBusy(true, 'Saving…');

    if (error) { Auth.setBusy(false); return Auth.err(authError(error)); }
    const { error: e2 } = await sb.auth.updateUser({ password });
    Auth.setBusy(false);
    if (e2) return Auth.err(authError(e2));

};

async function bootCloud() {
  if (!sb) { Auth.show('setup'); return; }
  sb.auth.onAuthStateChange(event => {
    if (event === 'SIGNED_OUT' && Cloud.me) {
      setTimeout(() => { if (Cloud.me) { toast('You were signed out', 'logout'); signOut(false); } }, 0);
    }
  });
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) { session = null; }
  if (session?.user) Cloud.start(session.user).catch(e => toast(cloudError(e), 'info'));
  else Auth.show('signin');
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !Cloud.me) return;

    if (ui.openChatId) Cloud.markRead(getChat(ui.openChatId));
  });

function sendMessage() {
  const ta = $('#composer');
  const text = ta.value.trim();
  const c = getChat(ui.openChatId); if (!c) return;

  if (ui.compose.mode === 'edit') {
    const m = findMsg(ui.compose.id);
    if (!text) { toast('A message can’t be empty. Use Delete to remove it.', 'info'); return; }
    if (m && m.text !== text && !m.pending) {
      const old = { text: m.text, edited: m.edited, editedAt: m.editedAt };
      m.text = text; m.edited = true; m.editedAt = now();
      Cloud.rpc('edit_message', { msg: m.id, new_body: text }).then(() => toast('Message edited', 'pen'),
        e => { Object.assign(m, old); refresh(); toast(cloudError(e), 'info'); });
    }
    const prev = ui.compose.prevDraft || '';
    clearCompose();
    ta.value = prev; c.draft = prev; autoGrow(ta); updateComposerBtn();
    refresh();
    return;
  }
  if (!text) { startRecording(); return; }
  ta.value = ''; c.draft = ''; autoGrow(ta); updateComposerBtn();
  postMine({ type: 'text', text });
}

/* Every outgoing message goes through here. It shows at once with a clock,
   then the server confirms it (one tick) or it's marked "Not sent". */
function postMine(fields) {
  const c = getChat(ui.openChatId); if (!c) return;
  const files = fields._files || {};
  delete fields._files;
  const msg = { id: uid(), from: 'me', t: now(), ...fields };
  if (!UUID_RE.test(msg.id)) msg.id = uid();
  if (ui.compose.mode === 'reply') {
    const r = findMsg(ui.compose.id);
    if (r && !r.pending && r.status !== 'failed') msg.replyTo = ui.compose.id;
  }
  clearCompose();
  c.messages.push(msg);
  if (S().notify.sounds) playTick();
  $('#msgs').dataset.fresh = '1';
  Cloud.send(c, msg, files);
}

function takeCaption() {
  const ta = $('#composer');
  const t = ta.value.trim();
  if (t && ui.compose.mode !== 'edit') {
    ta.value = ''; autoGrow(ta); updateComposerBtn();
    const c = getChat(ui.openChatId); if (c) c.draft = '';
    return t;
  }
  return '';
}
function handleFile(file) {
  if (!file || !ui.openChatId) return;
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let src; try { src = cv.toDataURL('image/jpeg', 0.82); } catch (e) { src = reader.result; }
        postMine({ type: 'image', src, ratio: +(cv.width / cv.height).toFixed(3), caption: takeCaption() });
      };
      img.onerror = () => toast('That image couldn’t be opened. Try a JPG or PNG.', 'image');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  } else if (file.type.startsWith('video/')) {
    if (file.size > FILE_MAX) { toast(`Videos can be up to 25 MB. This one is ${fmtBytes(file.size)}.`, 'film'); return; }
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.playsInline = true; v.src = url;
    let done = false;
    const finish = poster => {
      if (done) return; done = true;
      const ratio = v.videoWidth && v.videoHeight ? +(v.videoWidth / v.videoHeight).toFixed(3) : 16 / 9;
      const id = uid(); ui.blobs.add(id);
      postMine({ id, type: 'video', blob: url, poster, ratio, duration: Math.round(v.duration) || 0, caption: takeCaption(), _files: { main: file } });
    };
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { finish(null); } };
    v.onseeked = () => {
      let poster = null;
      try {
        const s = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        poster = cv.toDataURL('image/jpeg', 0.6);
      } catch (e) { /* poster is optional */ }
      finish(poster);
    };
    v.onerror = () => { if (!done) { done = true; URL.revokeObjectURL(url); toast('This video format can’t be previewed here', 'film'); } };
    setTimeout(() => finish(null), 4000);
  } else {
    handleAnyFile(file);
  }
}

function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    toast(ok ? 'Copied to clipboard' : 'Copying isn’t allowed in this view', ok ? 'copy' : 'info');
  };
  try {
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard', 'copy'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}

let audioCtx = null;
function playTick(freq = 880) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.2);
  } catch (e) { /* audio not available */ }
}

function applyAppearance() {
  if (!CONFIG.accents[S().appearance.accent]) S().appearance.accent = 'white';
  const { accent } = S().appearance;
  const mode = resolvedMode();
  const a = CONFIG.accents[accent];
  const root = document.documentElement;
  root.dataset.mode = mode;
  root.style.setProperty('--accent', a.bubble[mode]);
  root.style.setProperty('--accent-ink', mode === 'light' ? '#FFFFFF' : '#000000');
  root.style.setProperty('--tint', a.tint[mode]);
  root.style.setProperty('--tint-ink', mode === 'light' ? '#FFFFFF' : '#000000');
  if (typeof applyChatStyle === 'function' && $('#convo')?.innerHTML) applyChatStyle();
}

const AI = {
  url() { return `${String(CLOUD_CFG.supabaseUrl || '').replace(/\/+$/, '')}/functions/v1/zyven-ai`; },
  async call(body, timeoutMs = 60000) {
    if (!sb) throw { error: 'NO_SERVER', message: AT('offline') };
    const { data } = await sb.auth.getSession();
    const token = data?.session?.access_token;
    if (!token) throw { error: 'NOT_SIGNED_IN', message: AT('signIn') };
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs);
    let res;
    try {
      res = await fetch(this.url(), {
        method: 'POST', signal: ctrl.signal,
        headers: { Authorization: `Bearer ${token}`, apikey: String(CLOUD_CFG.supabaseAnonKey || ''), 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    } catch (e) {
      throw { error: e?.name === 'AbortError' ? 'AI_TIMEOUT' : 'OFFLINE', message: e?.name === 'AbortError' ? 'ZYVEN AI took too long to answer. Try again.' : AT('offline') };
    } finally { clearTimeout(t); }
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      // 404 = the server function hasn't been deployed yet.
      if (res.status === 404 && !json.error) throw { error: 'AI_NOT_DEPLOYED', message: AT('notConfigured') };
      throw { status: res.status, error: json.error || 'AI_ERROR', message: json.message || 'ZYVEN AI ran into a problem. Try again.', ...json };
    }
    return json;
  },
  async status(force = false) {
    if (ui.ai.status && !force && Date.now() - ui.ai.status.at < 120000) return ui.ai.status;
    try { const r = await this.call({ op: 'status' }, 15000); ui.ai.status = { at: Date.now(), ok: true, configured: !!r.configured, model: r.model || '' }; }
    catch (e) { ui.ai.status = { at: Date.now(), ok: false, configured: e.error === 'AI_NOT_DEPLOYED' ? false : null, error: e.message }; }
    return ui.ai.status;
  },
  checkDev() {
    if (!sb || !Cloud.me) return Promise.resolve(false);
    if (ui.ai.devChecked === Cloud.me) return Promise.resolve(ui.ai.isDev);
    if (this._dev) return this._dev;
    const who = Cloud.me;
    this._dev = (async () => {
      try {
        const { data, error } = await sb.rpc('is_dev_tester');
        if (!error && Cloud.me === who) {
          const was = ui.ai.isDev;
          ui.ai.isDev = data === true; ui.ai.devChecked = who;
          if (was !== ui.ai.isDev) renderProfile();
        }
      } catch (e) { /* offline: try again later */ }
      setTimeout(() => { this._dev = null; }, 30000);
      return ui.ai.isDev;
    })();
    return this._dev;
  },
};

/* ---------- Safe Markdown for answers ---------- */
function aiInline(s) {
  return s
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n][^*\n]*?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,)!?]|$)/g, '$1<i>$2</i>');
}
function aiMd(src) {
  const lines = esc(String(src || '')).split('\n');
  let html = '', list = null, para = [];
  const flushPara = () => { if (para.length) { html += `<p>${aiInline(para.join('<br>'))}</p>`; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flushPara(); closeList();
      const code = [];
      while (++i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i]);
      html += `<pre><code>${code.join('\n')}</code></pre>`;
      continue;
    }
    let m;
    if ((m = line.match(/^\s*#{1,4}\s+(.+)$/))) { flushPara(); closeList(); html += `<h4>${aiInline(m[1])}</h4>`; continue; }
    if ((m = line.match(/^\s*[-*•]\s+\[( |x|X)\]\s+(.+)$/))) {
      flushPara(); if (list !== 'ul') { closeList(); html += '<ul class="ck">'; list = 'ul'; }
      html += `<li class="${m[1].trim() ? 'on' : ''}"><span class="box" aria-hidden="true"></span>${aiInline(m[2])}</li>`; continue;
    }
    if ((m = line.match(/^\s*[-*•]\s+(.+)$/))) { flushPara(); if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${aiInline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*(\d{1,3})[.)]\s+(.+)$/))) { flushPara(); if (list !== 'ol') { closeList(); html += `<ol start="${+m[1]}">`; list = 'ol'; } html += `<li>${aiInline(m[2])}</li>`; continue; }
    if (!line.trim()) { flushPara(); closeList(); continue; }
    if (list && /^\s{2,}\S/.test(line)) { html = html.replace(/<\/li>$/, `<br>${aiInline(line.trim())}</li>`); continue; }
    closeList(); para.push(line);
  }
  flushPara(); closeList();
  return html;
}

async function aiSend(retry = false) {
  const a = ui.ai;
  if (a.loading) return;
  const ta = $('#ai-input');
  let text = '';
  if (retry && a.error?.retry === 'resend') text = a.error.text;
  else if (!retry) text = (ta?.value || '').trim();
  if (!retry && !text) return;
  if (!Cloud.me) { toast(AT('signIn'), 'info'); return; }
  if (!(await aiConsent())) return;

  let diagnostics = null;
  if (a.diag && !(retry && a.error?.retry === 'retry')) diagnostics = await collectDiagnostics();
  const serverRetry = retry && a.error?.retry === 'retry';
  if (retry && a.error?.retry === 'resend') a.msgs = a.msgs.filter(m => m.id !== a.error.localId);

  let local = null;
  if (!serverRetry) {
    local = { id: 'local-' + uid(), role: 'user', content: text, shared_diagnostics: !!diagnostics, pending: true };
    a.msgs.push(local);
    if (ta) { ta.value = ''; autoGrow(ta); }
  }
  a.error = null; a.loading = true;
  const convAtStart = a.convId;
  renderAIMsgs(); aiComposerState();
  try {
    const r = await AI.call({ op: 'chat', mode: a.mode, lang: AIL, conversation_id: a.convId, text: serverRetry ? undefined : text, retry: serverRetry, diagnostics });
    if (ui.ai.convId !== convAtStart) return; // user started another conversation meanwhile
    a.convId = r.conversation_id;
    if (local) { const i = a.msgs.indexOf(local); if (i >= 0) a.msgs[i] = r.user_message || { ...local, pending: false }; }
    a.msgs.push(r.assistant_message);
    a.convs = null;
    if (a.diag) { a.diag = false; renderAIDiagBar(); }
  } catch (e) {
    if (ui.ai.convId !== convAtStart) return;
    if (e.conversation_id) a.convId = e.conversation_id;
    if (e.user_message && local) { const i = a.msgs.indexOf(local); if (i >= 0) a.msgs[i] = e.user_message; }
    const savedOnServer = !!e.user_message || serverRetry;
    if (!savedOnServer && local) local.failed = true;
    const canRetry = e.retryable || ['OFFLINE', 'AI_TIMEOUT', 'RATE_LIMITED', 'DB', 'AI_ERROR', 'AI_BUSY', 'AI_UNAVAILABLE'].includes(e.error);
    a.error = { message: e.message || 'Something went wrong.', retry: canRetry ? (savedOnServer ? 'retry' : 'resend') : '', text, localId: local?.id };
    if (e.error === 'AI_NOT_CONFIGURED' || e.error === 'AI_NOT_DEPLOYED') { ui.ai.status = { at: Date.now(), ok: true, configured: false }; a.error.retry = 'resend'; }
    logAppError(`ZYVEN AI: ${e.error || 'error'}`);
    if (!serverRetry && !savedOnServer && ta && !ta.value) { /* keep the text in the bubble so Retry can resend it */ }
  } finally {
    if (local) local.pending = false;
    a.loading = false;
    if (ui.ai.open) { renderAIMsgs(); aiComposerState(); }
  }
}

function logAppError(text) {

async function collectDiagnostics() {
  const d = {
    appVersion: CONFIG.version,
    platform: window.Capacitor?.getPlatform?.() || 'web',
    online: navigator.onLine !== false,
    signedIn: !!Cloud.me,
    realtime: Cloud.connected ? 'connected' : (Cloud.channel ? 'connecting' : 'off'),
    lastSyncAgoSec: Cloud.lastSync ? Math.round((Date.now() - Cloud.lastSync) / 1000) : undefined,
    chats: state.chats.filter(c => c.type === 'dm').length,
    groups: state.chats.filter(c => c.type === 'group').length,
    contacts: state.users.filter(u => u.contact).length,
    failedMessages: state.chats.reduce((n, c) => n + c.messages.filter(m => m.from === 'me' && m.status === 'failed').length, 0),
    notificationsAllowed: 'Notification' in window ? Notification.permission : 'not supported',
    theme: resolvedMode(),
    language: navigator.language || '',
    screen: `${innerWidth}x${innerHeight}`,
    checkedAt: new Date().toISOString(),
    recentErrors: ui.errLog.slice(-8),
  };
  try { const p = await navigator.permissions?.query({ name: 'microphone' }); if (p) d.microphone = p.state; } catch (e) { d.microphone = 'unknown'; }
  if (sb && Cloud.me) {
    const t0 = performance.now();
    try {
      const { error } = await Promise.race([sb.from('profiles').select('id').eq('id', Cloud.me).limit(1), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))]);
      d.serverReachable = !error; d.serverLatencyMs = Math.round(performance.now() - t0);
    } catch (e) { d.serverReachable = false; }
    try { const { error } = await sb.storage.from('avatars').list(Cloud.me, { limit: 1 }); d.storageReachable = !error; } catch (e) { d.storageReachable = false; }
  }
  const st = await AI.status(true);
  d.aiService = !st.ok ? 'unreachable' : st.configured ? 'ready' : 'not configured';
  return d;
}
const DIAG_LABELS = {
  appVersion: 'App version', platform: 'Platform', online: 'Phone has internet', signedIn: 'Signed in',
  serverReachable: 'ZYVEN server reachable', serverLatencyMs: 'Server response time (ms)', realtime: 'Live updates',
  lastSyncAgoSec: 'Last sync (seconds ago)', storageReachable: 'File storage reachable', aiService: 'ZYVEN AI service',
  chats: 'Private chats on this phone', groups: 'Groups on this phone', contacts: 'Contacts', failedMessages: 'Messages that failed to send',
  notificationsAllowed: 'Notification permission', microphone: 'Microphone permission', theme: 'Theme', language: 'Phone language',
  screen: 'Screen size', checkedAt: 'Checked at', recentErrors: 'Recent error messages',
};
function diagRows(d) {

    let v = d[k];

    return `<div class="dg-row"><span>${esc(l)}</span><b class="${bad ? 'bad' : ''}">${esc(String(v)).replace(/\n/g, '<br>')}</b></div>`;

/* ---------- Bug reports (any signed-in user) ---------- */
function parseBugReport(text) {
  const get = label => { const m = String(text).match(new RegExp(`\\*\\*${label}:?\\*\\*:?\\s*([\\s\\S]*?)(?=\\n\\*\\*[A-Z][^*]{1,40}:?\\*\\*|$)`, 'i')); return m ? m[1].trim() : ''; };
  const sev = get('Severity').toLowerCase(), status = get('Status').toLowerCase();
  return {
    title: get('Title').replace(/\n.*/s, '').slice(0, 120),
    steps: get('Steps to reproduce').slice(0, 3000),
    expected: get('Expected').slice(0, 1500),
    actual: get('Actual').slice(0, 1500),
    severity: /high/.test(sev) ? 'high' : /low/.test(sev) ? 'low' : 'medium',
    certainty: /confirmed/.test(status) ? 'confirmed' : 'possible',
  };
}

async function submitBug(form) {
  const v = id => (form.querySelector(id)?.value || '').trim();
  const err = form.querySelector('#bug-err');
  const title = v('#bug-title');
  if (title.length < 3) { err.textContent = 'Give the problem a short title (at least 3 characters).'; return; }
  if (!v('#bug-steps') && !v('#bug-act')) { err.textContent = 'Add the steps or what actually happens, so it can be investigated.'; return; }
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    let diagnostics = null;
    if (form.querySelector('#bug-diag')?.checked) { const d = await collectDiagnostics(); delete d.screen; diagnostics = d; }

let lpTimer = null, lpFired = false, lpStart = null;
const openPressMenu = el => el.dataset.stkpress ? stickerSheet(el.dataset.stkpress)

document.addEventListener('pointerdown', e => {
  const row = e.target.closest('[data-stkpress],[data-longpress],[data-msgpress]');
  if (!row || e.button > 0) return;
  lpFired = false; lpStart = { x: e.clientX, y: e.clientY };
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpFired = true;
    try { navigator.vibrate && navigator.vibrate(12); } catch (_) {}
    openPressMenu(row);
  }, 480);
});
document.addEventListener('pointermove', e => {
  if (lpStart && Math.hypot(e.clientX - lpStart.x, e.clientY - lpStart.y) > 8) clearTimeout(lpTimer);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(lpTimer); lpStart = null; }));
document.addEventListener('contextmenu', e => {

document.addEventListener('click', e => {

  }
  if (key === 'pf-name' || key === 'pf-user' || e.target.id === 'p-bio') {
    if (key === 'pf-name') { $('#name-count').textContent = `${e.target.value.length}/32`; $('#n-err').textContent = ''; }
    renderPfPreview();
    if (key === 'pf-user') return;
  }
  if (key === 'block-search') { filterPicks('#block-list', e.target.value, e.target.value); return; }
  if (key === 'saved-search') { ui.savedQ = e.target.value; renderSavedList(); return; }
  if (key === 'fwd-search') {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#fwd-list .pick').forEach(p => { p.hidden = q && !p.dataset.name.includes(q); });
    return;
  }
  if (key === 'ap-radius') {
    const first = CS().radius == null;
    CS().radius = +e.target.value; $('#ap-r-v').textContent = `${e.target.value}px`; applyChatStyle(); save();
    if (first) { clearTimeout(ui.radTimer); ui.radTimer = setTimeout(renderAppearance, 400); }
    return;
  }
  if (key === 'stk-search') { ui.stkQuery = e.target.value; const r = $('#stk-results'); if (r) r.innerHTML = stickerResultsHtml(); return; }
  if (key === 'lib-search') { ui.lib.q = e.target.value; renderLibGrid(); return; }
  if (key === 'cr-zoom') { setZoom(+e.target.value / 100); return; }
  if (key === 'cr-frame') { ui.cr.frame = +e.target.value / 100; $('#cr-frame-v').textContent = `${e.target.value}%`; drawStage(); return; }
  if (key === 'cr-tol') {
    ui.cr.bg.tol = +e.target.value; $('#cr-tol-v').textContent = e.target.value;
    clearTimeout(ui.tolTimer);
    ui.tolTimer = setTimeout(() => { applyBgRemoval(); drawStage(); const s = $('#cr-bg-status'); if (s) { s.textContent = ui.cr.bg.status; s.classList.toggle('warn', !!ui.cr.bg.warn); } }, 180);
    return;
  }
  if (key === 'cr-text') {
    ui.cr.text = e.target.value;
    if (ui.cr.step === 'edit') drawStage();
    else { const t = $('#cr-stage-text'); if (t) t.textContent = e.target.value; }
    return;
  }
  const errEl = e.target.closest('.form')?.querySelector('.err');
  if (errEl) errEl.textContent = '';
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'composer-form') { sendMessage(); return; }
  if (e.target.id === 'ai-form') { aiSend(); return; }
  const name = e.target.dataset.form;
  if (authForms[name]) { if (!Auth.busy) authForms[name](e.target).catch(err => { Auth.setBusy(false); Auth.err(authError(err)); }); return; }
  const f = forms[name];
  if (f) Promise.resolve(f(e.target)).catch(err => toast(cloudError(err), 'info'));
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'composer' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  if (e.target.id === 'ai-input' && e.key === 'Enter' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer:coarse)').matches) { e.preventDefault(); aiSend(); }
  if (e.key === 'Enter' && (e.target.id === 'gd-search' || e.target.id === 'gadd-search')) {
    e.preventDefault();
    const first = e.target.closest('.sheet')?.querySelector('.pick:not([hidden])');
    first && first.click();
  }
  if (e.key === 'Enter' && e.target.id === 'newchat-search') {
    e.preventDefault();
    $('#newchat-list [data-action="open-dm"]')?.click();
  }
  if (e.key === 'Escape') {
    if (!$('#viewer').hidden) closeViewer();
    else if (!$('#overlay').hidden) closeOverlay();
    else if ($('#creator').classList.contains('open')) actions['cr-close']();
    else if ($('#appearance').classList.contains('open')) closeAppearance();
    else if ($('#saved').classList.contains('open')) closeSaved();
    else if ($('#ai').classList.contains('open')) closeAI();
    else if ($('#stickers').classList.contains('open')) closeLibrary();
    else if (ui.rec) stopRecording(false);
    else if ($('#emoji-panel').classList.contains('open')) toggleEmoji(false);
    else if (ui.compose.mode) cancelCompose();
    else if (ui.openChatId) closeChat();
  }
});

document.addEventListener('focusin', e => {
  if (e.target.id === 'composer' && $('#emoji-panel').classList.contains('open') && matchMedia('(pointer:coarse)').matches) toggleEmoji(false);
});

/* Keep relative times ("5 min ago") fresh */
setInterval(() => { if (document.visibilityState === 'visible') { renderChatsList(); renderGroupsList(); if (ui.openChatId) renderConvoHeader(); } }, 60000);

/* =========================================================
   9. BOOT
   ========================================================= */
injectDesignCss();
applyAppearance();
renderShell();
sweepExpired();
applyChatStyle();
renderNav();
renderChatsList();
renderContactsList();
renderGroupsList();
renderProfile();
bootCloud();
try {
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (S().appearance.mode === 'system') { applyAppearance(); renderProfile(); }
  });
} catch (e) { /* older browsers: System follows the theme at load time */ }
setTimeout(() => $('#splash').classList.add('gone'), 750);
</script>
