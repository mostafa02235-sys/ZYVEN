<title>ZYVEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Pixelify+Sans:wght@500&display=swap">
<style>
/* Layout: one phone-width column. Four tabs share a stage, a conversation slides over from the right,
   sheets rise from the bottom. Dark-first; "Light" is an in-app preference set on the root element. */
/* AMOLED with colour: true #000 ground, white type, hairline #262626 structure,
   colour carried by people, media, stickers and one interactive tint. */
:root{
  --tint:#8B7CFF; --tint-ink:#000000;
  --page:#000000;
  --bg:#000000;
  --surface:#080808;
  --surface-2:#171717;
  --surface-3:#262626;
  --press:#1A1A1A;
  --bubble-in:#171717;
  --line:#262626;
  --fg:#FFFFFF;
  --muted:#A3A3A3;
  --faint:#737373;
  --glass:#000000;
  --accent:#FFFFFF;
  --accent-ink:#000000;
  --online:#34D27B;
  --danger:#FF6B63;
  --av-sat:46%; --av-l:26%; --av-dir:1; --av-fg:86%; --sender-l:72%;
  --shadow:none;
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono:'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:dark;
}
:root[data-mode="light"]{
  --page:#FFFFFF;
  --bg:#FFFFFF;
  --surface:#FAFAFA;
  --surface-2:#F0F0F0;
  --surface-3:#E0E0E0;
  --press:#EBEBEB;
  --bubble-in:#F0F0F0;
  --line:#E5E5E5;
  --fg:#000000;
  --muted:#5C5C5C;
  --faint:#8A8A8A;
  --glass:#FFFFFF;
  --online:#12A150;
  --danger:#D92D20;
  --av-sat:62%; --av-l:86%; --av-dir:-1; --av-fg:28%; --sender-l:38%;
  --shadow:none;
  color-scheme:light;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

/* ---------- App frame ---------- */
.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip;display:flex;flex-direction:column;isolation:isolate}
@media (min-width:640px){
  body{display:grid;place-items:center;padding-block:24px}
  .app{width:100%;height:min(100%,880px);border-radius:34px;border:1px solid var(--line);box-shadow:var(--shadow)}
}
.stage{position:relative;flex:1;min-height:0}
.tab{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:96px;scrollbar-width:none}
.tab::-webkit-scrollbar{display:none}
.tab[hidden]{display:none!important}
.tab.enter{animation:tabIn .32s var(--ease)}
@keyframes tabIn{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Headers ---------- */
.tab-head{position:sticky;top:0;z-index:5;padding:14px 16px 10px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);display:flex;flex-direction:column;gap:12px;border-bottom:1px solid transparent;transition:border-color .2s}
.tab.scrolled .tab-head{border-bottom-color:var(--line)}
.head-row{display:flex;align-items:center;gap:12px;min-height:40px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.wordmark{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.02em}
.tab-title{font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.025em;flex:1;margin:0;line-height:1.1}
.tab-title small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:8px;vertical-align:middle}
.icon-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--fg);background:var(--surface-2);transition:transform .15s var(--ease),background .2s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.accent{background:var(--accent);color:var(--accent-ink)}
.icon-btn.ghost{background:transparent}
.icon-btn.ghost:hover{background:var(--surface-2)}

.search{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:14px;background:var(--surface-2);color:var(--muted);transition:box-shadow .2s}
.search:focus-within{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 55%,transparent)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%;color:var(--fg);font-size:15px}
.search input::placeholder{color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:all .2s var(--ease)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.8}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---------- Lists ---------- */
.list{padding:4px 8px 0}
.section-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:16px 12px 6px;display:flex;align-items:center;gap:6px}
.section-label svg{width:12px;height:12px}
.row{width:100%;display:flex;align-items:center;gap:14px;padding:10px 10px;border-radius:18px;text-align:left;transition:background .15s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-top,.row-bot{display:flex;align-items:center;gap:6px;min-width:0}
.row-name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.row-time.hot{color:var(--accent)}
.row-preview{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.row-preview > span.txt{overflow:hidden;text-overflow:ellipsis}
.row-preview .who{color:var(--fg);opacity:.75}
.row-preview .draft{color:var(--danger);font-weight:500}
.row-preview .typing{color:var(--accent)}
.row-preview svg{width:15px;height:15px;flex:none}
.mini{color:var(--faint);flex:none;display:grid;place-items:center}
.mini svg{width:14px;height:14px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:11px;font-weight:500;display:grid;place-items:center;flex:none}
.badge.muted{background:var(--surface-3);color:var(--muted)}
.row-action{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);flex:none}
.row-action svg{width:18px;height:18px}
.tag{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);background:var(--surface-2);padding:2px 7px;border-radius:6px;flex:none}
.hint{font-size:12px;color:var(--faint);text-align:center;padding:18px 24px 6px}

/* ---------- Avatars ---------- */
.av{--s:48px;position:relative;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;
  background:hsl(var(--h) var(--av-sat) var(--av-l));color:hsl(var(--h) 38% var(--av-fg));
  font-family:var(--f-display);font-weight:600;font-size:calc(var(--s) * .36);letter-spacing:-.02em}
.av.sq{border-radius:32%}
.av .dot{position:absolute;right:calc(var(--s) * .02);bottom:calc(var(--s) * .02);width:calc(var(--s) * .26);height:calc(var(--s) * .26);min-width:10px;min-height:10px;border-radius:50%;background:var(--online);box-shadow:0 0 0 2.5px var(--bg)}

/* ---------- Bottom nav ---------- */
.nav{position:absolute;left:12px;right:12px;bottom:12px;z-index:10;height:64px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:24px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nav-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:18px;background:var(--surface-2);transition:transform .38s var(--ease)}
.nav-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;transition:color .2s}
.nav-btn svg{width:21px;height:21px}
.nav-btn.on{color:var(--fg)}
.nav-btn.on svg{color:var(--accent)}
.nav-btn .badge{position:absolute;top:4px;left:calc(50% + 6px);height:17px;min-width:17px;font-size:10px;padding:0 5px;box-shadow:0 0 0 2px var(--bg)}

/* ---------- Empty, skeleton ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 32px 24px;gap:10px}
.empty-mark{width:84px;height:84px;border-radius:30px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 5%,transparent),0 0 0 22px color-mix(in srgb,var(--accent) 2.5%,transparent);margin-bottom:18px}
.empty-mark svg{width:32px;height:32px}
.empty h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.015em;text-wrap:balance}
.empty p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:30ch}
.empty .btn{margin-top:12px}
.skel{display:flex;align-items:center;gap:14px;padding:10px}
.skel i{display:block;border-radius:999px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.skel .c{width:52px;height:52px;border-radius:50%;flex:none}
.skel .l{height:11px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- Buttons ---------- */
.btn{height:46px;padding:0 20px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.secondary{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}

/* ---------- Profile / settings ---------- */
.profile-wrap{padding:6px 16px 0;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 18px 20px;border-radius:28px;background:var(--surface)}
.hero .av{margin-bottom:10px}
.hero h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.025em}
.hero .handle{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hero .bio{margin:6px 0 0;color:var(--fg);opacity:.85;font-size:14.5px;line-height:1.5;max-width:34ch;text-wrap:pretty}
.hero .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.hero .status i{width:7px;height:7px;border-radius:50%;background:var(--online)}
.hero .status.off i{background:var(--faint)}
.hero .btn{margin-top:14px}
.group{display:flex;flex-direction:column;gap:8px}
.group-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:0 6px}
.card{border-radius:22px;background:var(--surface);overflow:hidden}
.set{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;min-height:56px}
.set + .set{border-top:1px solid var(--line)}
.set-ic{width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--fg);flex:none}
.set-ic svg{width:17px;height:17px}
.set-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.set-txt b{font-weight:500;font-size:15px}
.set-txt span{font-size:12.5px;color:var(--muted);line-height:1.35}
.set .chev{color:var(--faint)}
.set .chev svg{width:18px;height:18px}
.set.danger .set-txt b,.set.danger .set-ic{color:var(--danger)}
.switch{width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background .25s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg);transition:transform .3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(18px);background:var(--accent-ink)}
:root[data-mode="light"] .switch.on::after{background:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2);margin:0 16px 14px}
.seg button{height:38px;border-radius:11px;font-size:14px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s var(--ease)}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.swatches{display:flex;gap:12px;padding:0 16px 16px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.sw i{width:40px;height:40px;border-radius:50%;display:block;background:var(--c);box-shadow:0 0 0 0 var(--bg),0 0 0 0 var(--c);transition:box-shadow .25s var(--ease)}
.sw.on{color:var(--fg)}
.sw.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.foot{text-align:center;font-size:12px;color:var(--faint);padding:4px 0 8px;line-height:1.6}
.foot code{font-family:var(--f-mono)}

/* ---------- Conversation ---------- */
.convo{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s var(--ease);visibility:hidden}
.convo.open{transform:none;visibility:visible}
.convo-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 6px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);z-index:2}
.convo-who{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left;padding:4px;border-radius:14px}
.convo-who .meta{min-width:0;display:flex;flex-direction:column}
.convo-who b{font-weight:600;font-size:16px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-who .meta > span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convo-who .meta > span.live{color:var(--accent)}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.sim-note{align-self:center;display:flex;gap:8px;align-items:flex-start;max-width:300px;font-size:12px;line-height:1.45;color:var(--muted);background:var(--surface);border:1px dashed color-mix(in srgb,var(--accent) 35%,transparent);padding:10px 12px;border-radius:14px;margin:4px 0 10px}
.sim-note svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--accent)}
.day{align-self:center;margin:14px 0 8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface);padding:4px 10px;border-radius:999px}
.sys{align-self:center;font-size:12.5px;color:var(--muted);margin:6px 0;text-align:center}
.mrow{display:flex;align-items:flex-end;gap:8px;animation:pop .28s var(--ease)}
.mrow.me{justify-content:flex-end}
.mrow.tail{margin-bottom:8px}
.mav{width:28px;flex:none}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.bubble{max-width:78%;padding:8px 12px 7px;border-radius:20px;display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:10px;font-size:15px;line-height:1.42;min-width:0}
.them .bubble{background:var(--surface-2);color:var(--fg)}
.me .bubble{background:var(--accent);color:var(--accent-ink)}
.them.tail .bubble{border-bottom-left-radius:6px}
.me.tail .bubble{border-bottom-right-radius:6px}
.btext{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.sender{width:100%;font-size:12.5px;font-weight:600;color:hsl(var(--h) 48% var(--sender-l));margin-bottom:1px}
.bmeta{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10.5px;opacity:.6;transform:translateY(2px);font-variant-numeric:tabular-nums}
.bmeta svg{width:15px;height:15px}
.bmeta .read{opacity:1}
.typing-b{display:inline-flex;gap:4px;padding:13px 14px}
.typing-b i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing-b i:nth-child(2){animation-delay:.15s}.typing-b i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 10px 12px;border-top:1px solid var(--line);background:var(--bg)}
.composer .field{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:22px;padding:4px 6px 4px 16px}
.composer textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;max-height:120px;padding:9px 0;line-height:1.4;font-size:15px}
.composer textarea::placeholder{color:var(--muted)}
.composer .icon-btn{width:44px;height:44px;border-radius:50%}
.composer .field .icon-btn{width:36px;height:36px;background:transparent;color:var(--muted)}
.send{transition:transform .2s var(--ease),background .2s}
.send.ready{background:var(--accent);color:var(--accent-ink)}

/* ---------- Overlays ---------- */
.overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .28s}
.overlay.open .ov-backdrop{opacity:1}
.sheet{position:relative;width:100%;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:30px 30px 0 0;padding:8px 18px 22px;transform:translateY(100%);transition:transform .4s var(--ease);scrollbar-width:none}
.overlay.open .sheet{transform:none}
.grabber{width:40px;height:5px;border-radius:999px;background:var(--surface-3);margin:4px auto 14px}
.dialog{position:relative;align-self:center;width:calc(100% - 48px);max-width:340px;background:var(--surface);border-radius:26px;padding:24px 20px 18px;opacity:0;transform:scale(.94);transition:all .25s var(--ease)}
.overlay.open .dialog{opacity:1;transform:none}
.dialog h3{margin:0 0 8px;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.015em}
.dialog p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.5}
.dialog .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{flex:1;margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.02em}
.sheet .list{padding:0;margin:0 -8px}
.sheet .row{padding:9px 8px}
.act-list{display:flex;flex-direction:column;background:var(--surface-2);border-radius:20px;overflow:hidden}
.act{display:flex;align-items:center;gap:14px;padding:15px 16px;font-size:15px;font-weight:500;text-align:left}
.act + .act{border-top:1px solid var(--line)}
.act svg{width:19px;height:19px;color:var(--muted)}
.act.danger,.act.danger svg{color:var(--danger)}
.peek{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.peek b{display:block;font-weight:600;font-size:16px}
.peek span{font-size:13px;color:var(--muted)}
.profile-sheet{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding-top:6px}
.profile-sheet h3{margin:12px 0 0;font-family:var(--f-display);font-weight:600;font-size:25px;letter-spacing:-.025em}
.profile-sheet .handle{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.profile-sheet .state{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-top:2px}
.profile-sheet .state i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.profile-sheet .state.on i{background:var(--online)}
.profile-sheet .state.on{color:var(--online)}
.profile-sheet p.bio{margin:12px 0 0;font-size:14.5px;line-height:1.5;max-width:32ch}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:20px 0 6px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:18px;background:var(--surface-2);font-size:12.5px;font-weight:500}
.quick button svg{width:20px;height:20px;color:var(--accent)}
.sub-label{align-self:stretch;text-align:left;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:18px 0 4px}
.wide{align-self:stretch;text-align:left}

/* ---------- Forms ---------- */
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:12.5px;font-weight:500;color:var(--muted)}
.fld input,.fld textarea{width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:14px;padding:12px 14px;outline:0;font-size:15px;transition:border-color .2s}
.fld textarea{resize:none;min-height:84px;line-height:1.45}
.fld input:focus,.fld textarea:focus{border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.fld .err{font-size:12px;color:var(--danger);min-height:0}
.fld .count{font-family:var(--f-mono);font-size:11px;color:var(--faint);align-self:flex-end}
.prefix{position:relative}
.prefix span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--f-mono)}
.prefix input{padding-left:30px;font-family:var(--f-mono);font-size:14px}
.hues{display:flex;gap:10px;flex-wrap:wrap}
.hue{width:34px;height:34px;border-radius:50%;background:hsl(var(--h) var(--av-sat) var(--av-l));box-shadow:inset 0 0 0 1px var(--line)}
.hue.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px hsl(var(--h) 40% 60%)}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;width:100%;text-align:left}
.pick .row-main{gap:2px}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;transition:all .2s var(--ease);color:transparent}
.check svg{width:14px;height:14px}
.pick.on .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picked{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.about-mark{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 18px;text-align:center}
.about-mark h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:-.02em}
.about-mark span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.capab{display:grid;gap:10px}
.capab div{background:var(--surface-2);border-radius:18px;padding:14px 16px}
.capab h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.capab h4 i{width:8px;height:8px;border-radius:50%;background:var(--online)}
.capab div.sim h4 i{background:var(--accent)}
.capab ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.6}

/* ---------- Toasts & splash ---------- */
.toasts{position:absolute;top:12px;left:12px;right:12px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:100%;padding:11px 16px 11px 12px;border-radius:16px;background:var(--fg);color:var(--bg);font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(-12px) scale(.97);transition:all .3s var(--ease)}
.toast.in{opacity:1;transform:none}
.toast svg{width:17px;height:17px;flex:none}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.splash{position:absolute;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s,visibility .45s}
.splash.gone{opacity:0;visibility:hidden}
.splash .wordmark{font-size:30px}
.splash .bars{display:flex;gap:4px;height:18px;align-items:center}
.splash .bars i{width:3px;border-radius:2px;background:var(--accent);animation:wave 1s var(--ease) infinite}
.splash .bars i:nth-child(1){height:8px}.splash .bars i:nth-child(2){height:16px;animation-delay:.1s}.splash .bars i:nth-child(3){height:11px;animation-delay:.2s}.splash .bars i:nth-child(4){height:6px;animation-delay:.3s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.logo-bars{transform-origin:center}

/* =========================================================
   Conversation v2 — media, voice, reactions, replies, viewer
   ========================================================= */
.back{position:relative}
.back-n{position:absolute;top:1px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 10px/18px var(--f-mono);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.msgs-wrap{position:relative;flex:1;min-height:0}
.msgs-wrap .msgs{position:absolute;inset:0}
.mrow{animation:none}
.mrow.new{animation:pop .32s var(--ease)}
.mrow.flash .bubble{animation:flash 1.5s var(--ease)}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 3px transparent}}
.mcol{display:flex;flex-direction:column;max-width:78%;min-width:0}
.me .mcol{align-items:flex-end}
.mcol > .bubble{max-width:100%}
.bubble{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s var(--ease)}
.bubble:active{transform:scale(.985)}
.bmeta .ed{font-style:italic;margin-right:3px;font-family:var(--f-body)}
.bubble.jumbo{background:transparent!important;padding:0 2px;font-size:44px;line-height:1.15}
.bubble.jumbo .bmeta{color:var(--muted);opacity:1}
.bubble.del{background:transparent!important;color:var(--muted)!important;border:1px dashed color-mix(in srgb,var(--muted) 40%,transparent);font-style:italic;font-size:14px}
.bubble.del .btext{display:inline-flex;align-items:center;gap:6px}
.bubble.del .btext svg{width:14px;height:14px}

/* reply quote — inset block, no side rail */
.quote{display:flex;flex-direction:column;gap:1px;width:100%;min-width:0;text-align:left;padding:6px 10px 7px;border-radius:12px;margin:2px 0 6px;background:color-mix(in srgb,var(--fg) 7%,transparent);font-size:13px;line-height:1.35}
.me .quote{background:color-mix(in srgb,var(--accent-ink) 11%,transparent)}
.quote b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:hsl(var(--h) 48% var(--sender-l))}
.quote b svg{width:12px;height:12px}
.me .quote b{color:inherit;opacity:.85}
.quote span{opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.has-media .quote,.has-media .sender{margin-left:6px;margin-right:6px;width:auto}

/* media */
.bubble.has-media{padding:4px;flex-direction:column;align-items:stretch;flex-wrap:nowrap}
.has-media .sender{padding-top:4px}
.media{position:relative;display:block;max-width:100%;border-radius:16px;overflow:hidden;background-size:cover}
.media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.media .vd{position:absolute;left:8px;top:8px;z-index:1;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(8,8,10,.55);color:#fff;font:500 11px var(--f-mono);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.media .vd svg{width:13px;height:13px}
.media .play{position:absolute;inset:0;margin:auto;z-index:1;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:rgba(8,8,10,.5);color:#fff;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .2s var(--ease)}
.media:hover .play{transform:scale(1.06)}
.media .play svg{width:22px;height:22px;margin-left:3px}
.media .ometa{position:absolute;right:8px;bottom:7px;z-index:1;color:#fff}
.media .ometa .bmeta{opacity:.95;transform:none}
.cap{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:10px;padding:6px 8px 3px}

/* voice */
.bubble.has-voice{padding:8px 12px 7px 8px}
.voice{--p:0;display:flex;align-items:center;gap:10px;width:230px;max-width:100%}
.vplay{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent);color:var(--accent-ink);transition:transform .15s var(--ease)}
.vplay:active{transform:scale(.9)}
.vplay svg{width:16px;height:16px}
.me .vplay{background:var(--accent-ink);color:var(--accent)}
.vwave{position:relative;flex:1;height:30px;min-width:0;cursor:pointer}
.vbars{position:absolute;inset:0;display:flex;align-items:center;gap:2px}
.vbars i{flex:1;border-radius:2px;background:currentColor;opacity:.28}
.vbars.fill{clip-path:inset(0 calc((1 - var(--p)) * 100%) 0 0)}
.vbars.fill i{opacity:.95}
.vdur{font:500 11px var(--f-mono);opacity:.75;min-width:30px;font-variant-numeric:tabular-nums}
.has-voice .bmeta{width:100%;justify-content:flex-end;margin-top:2px}

/* reactions */
.reacts{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:4px;margin:-7px 8px 0;padding-bottom:2px}
.react{height:25px;padding:0 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);box-shadow:0 0 0 2px var(--bg);animation:pop .28s var(--ease)}
.react b{font:500 11px var(--f-mono);color:var(--muted)}
.react.mine{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.mrow.cont:has(.reacts){margin-bottom:6px}

/* composer dock */
.dock{border-top:1px solid var(--line);background:var(--bg)}
.dock .composer{border-top:0}
.composer .field{padding:4px 6px}
.ctx{display:flex;align-items:center;gap:12px;padding:10px 8px 0 18px;animation:ctxIn .25s var(--ease)}
@keyframes ctxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctx > svg{width:18px;height:18px;color:var(--accent);flex:none}
.ctx .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ctx .t b{font-size:12.5px;font-weight:600;color:var(--accent)}
.ctx .t span{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .icon-btn{width:34px;height:34px}
#emoji-btn.on{color:var(--accent)}
.rec{display:none;flex:1;min-width:0;align-items:center;gap:10px;height:52px;padding-left:2px}
.composer.recording .rec{display:flex}
.composer.recording .field,.composer.recording > .send{display:none}
.rec-x{color:var(--danger)!important;background:color-mix(in srgb,var(--danger) 12%,transparent)!important}
.rec-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:recPulse 1.2s infinite;flex:none}
@keyframes recPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
#rec-time{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;min-width:38px}
.rec-wave{flex:1;min-width:0;height:28px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden;color:var(--fg)}
.rec-wave i{width:3px;flex:none;border-radius:2px;background:currentColor;opacity:.75;animation:barIn .2s var(--ease)}
@keyframes barIn{from{transform:scaleY(.2)}to{transform:none}}
.rec-sim{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:2px 6px;border-radius:6px;flex:none}

/* emoji */
.emoji-panel{height:0;overflow:hidden;background:var(--surface);transition:height .32s var(--ease)}
.emoji-panel.open{height:272px;border-top:1px solid var(--line)}
.emo-tabs{display:flex;gap:4px;padding:8px 10px}
.emo-tabs button{flex:1;height:34px;border-radius:11px;font-size:18px;opacity:.6;transition:all .2s}
.emo-tabs button.on{background:var(--surface-2);opacity:1}
.emo-grid{position:relative;height:calc(100% - 50px);overflow-y:auto;padding:0 8px 12px;scrollbar-width:thin}
.sheet .emo-grid{height:auto;max-height:46vh;padding:0}
.emo-sec h5{margin:10px 6px 4px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.emo-row{display:grid;grid-template-columns:repeat(8,1fr)}
.emo{height:42px;border-radius:12px;display:grid;place-items:center;font-size:25px;line-height:1;transition:transform .12s}
.emo:hover{background:var(--surface-2)}
.emo:active{transform:scale(.85)}

/* jump to latest */
.to-bottom{position:absolute;right:14px;bottom:14px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;transition:all .25s var(--ease)}
.to-bottom.show{opacity:1;transform:none;pointer-events:auto}
.to-bottom svg{width:20px;height:20px}
.to-bottom .badge{position:absolute;top:-6px;right:-4px}

/* conversation empty state */
.convo-empty{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:24px 16px;animation:tabIn .4s var(--ease)}
.convo-empty .av{margin-bottom:8px;box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 6%,transparent)}
.convo-empty h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px;letter-spacing:-.02em;text-wrap:balance}
.convo-empty p{margin:0;color:var(--muted);font-size:13.5px}
.starters{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.starters .chip{height:36px;color:var(--fg);background:var(--surface)}

/* message sheets */
.react-bar{display:flex;justify-content:space-between;gap:2px;padding:6px;border-radius:999px;background:var(--surface-2);margin-bottom:12px}
.react-bar button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:25px;transition:transform .15s var(--ease),background .2s}
.react-bar button:active{transform:scale(.85)}
.react-bar button.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.react-bar button svg{width:22px;height:22px;color:var(--muted)}
.msg-peek{background:var(--surface-2);border-radius:16px;padding:11px 14px;margin-bottom:12px;font-size:14px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.msg-peek b{color:var(--fg);font-weight:600}
.info-prev{background:var(--bg);border-radius:20px;padding:14px 12px 10px;margin-bottom:14px;display:flex;flex-direction:column}
.info-prev .mrow{margin:0}
.tl{display:flex;flex-direction:column;background:var(--surface-2);border-radius:20px;overflow:hidden}
.tl-row{display:flex;align-items:center;gap:14px;padding:13px 16px}
.tl-row + .tl-row{border-top:1px solid var(--line)}
.tl-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);color:var(--faint);flex:none}
.tl-ic svg{width:17px;height:17px}
.tl-ic.done{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tl-row .row-time{white-space:nowrap}
.sim-tag{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.45;margin:14px 2px 0}
.sim-tag svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--accent)}
.attach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.attach-opt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border-radius:20px;background:var(--surface-2);text-align:left;cursor:pointer;transition:transform .15s var(--ease)}
.attach-opt:active{transform:scale(.97)}
.attach-opt .set-ic{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);margin-bottom:8px}
.attach-opt b{font-size:14.5px;font-weight:600}
.attach-opt span:last-child{font-size:12px;color:var(--muted)}

/* full-screen viewer — always dark, like a darkroom */
.viewer{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;background:#070709;color:#F2EFEA;opacity:0;transition:opacity .28s}
.viewer.open{opacity:1}
.vw-head{display:flex;align-items:center;gap:12px;padding:12px}
.vw-head .icon-btn{background:rgba(255,255,255,.09);color:#F2EFEA}
.vw-head .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.vw-head b{font-weight:600;font-size:15px}
.vw-head span{font-size:12px;color:rgba(242,239,234,.6)}
.vw-body{flex:1;min-height:0;display:grid;place-items:center;padding:8px 16px}
.vw-media{position:relative;max-width:100%;max-height:100%;border-radius:20px;overflow:hidden;transform:scale(.94);transition:transform .4s var(--ease);background:#111}
.viewer.open .vw-media{transform:none}
.vw-frame{position:absolute;inset:0;background-size:cover;background-position:center}
.vw-media.playing .vw-frame{animation:kb 9s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.12) translate(-2%,-1.5%)}}
video.vw-media{width:100%;height:auto}
.vw-foot{padding:10px 18px 20px;display:flex;flex-direction:column;gap:12px}
.vw-cap{margin:0;font-size:15px;line-height:1.45}
.vw-ctrl{display:flex;align-items:center;gap:12px}
.vw-play{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#F2EFEA;color:#111;flex:none}
.vw-play svg{width:18px;height:18px}
.vw-track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.vw-track i{display:block;height:100%;width:0;background:#F2EFEA}
.vw-ctrl time{font:500 12px var(--f-mono);color:rgba(242,239,234,.7);font-variant-numeric:tabular-nums}
.vw-note{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(242,239,234,.55)}
.vw-note svg{width:14px;height:14px}

/* =========================================================
   Group workflows — pictures, member chips, management
   ========================================================= */
.av .av-emo{font-size:calc(var(--s) * .5);line-height:1}
.gd-top{display:flex;align-items:center;gap:14px}
.gd-top .fld{flex:1;min-width:0}
.pic-btn{position:relative;flex:none;border-radius:32%}
.pic-btn .cam{position:absolute;right:-4px;bottom:-4px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 0 3px var(--surface)}
.pic-btn .cam svg{width:15px;height:15px}
.pics{display:flex;flex-direction:column;gap:8px}
.pics h5{margin:4px 0 0;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pic-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pic-opt{aspect-ratio:1;border-radius:32%;display:grid;place-items:center;transition:transform .15s var(--ease),box-shadow .2s;cursor:pointer}
.pic-opt:active{transform:scale(.9)}
.pic-opt.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.pic-upload{border:1.5px dashed var(--faint);color:var(--muted);width:44px;height:44px;margin:auto}
.pic-upload svg{width:19px;height:19px}
.mchips{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;min-height:82px;align-items:flex-start}
.mchips::-webkit-scrollbar{display:none}
.mchip{position:relative;flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;animation:pop .25s var(--ease)}
.mchip .n{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchip .x{position:absolute;top:-3px;right:1px;width:21px;height:21px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
.mchip .x svg{width:11px;height:11px;stroke-width:2.6}
.mchips-empty{font-size:13px;color:var(--muted);padding:18px 2px;line-height:1.45}
.pick-list{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.pick .tag{margin-right:4px}
.sticky-foot{position:sticky;bottom:-22px;z-index:2;margin:0 -18px -22px;padding:12px 18px 22px;background:var(--surface);border-top:1px solid var(--line)}
.row-x{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);flex:none;transition:color .2s}
.row-x:hover{color:var(--danger)}
.row-x svg{width:15px;height:15px}
.add-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.add-ic svg{width:19px;height:19px}
.name-edit{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.name-edit .icon-btn{width:32px;height:32px;border-radius:10px;flex:none}
.name-edit .icon-btn svg{width:15px;height:15px}
.linkish{color:var(--accent);font-size:13.5px;font-weight:500;margin-top:8px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.left-bar{display:flex;align-items:center;gap:12px;padding:12px 12px 14px 18px;font-size:13.5px;color:var(--muted);line-height:1.4}
.left-bar > svg{width:18px;height:18px;flex:none}
.left-bar span{flex:1;min-width:0}
.left-bar .btn{height:40px;padding:0 14px;font-size:14px}
.fld label .faint{color:var(--faint);font-weight:400}

/* =========================================================
   Settings v2 — privacy audiences, account, logout, preview
   ========================================================= */
.set-val{font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.note{display:flex;gap:6px;align-items:flex-start;margin:2px 6px 0;font-size:12px;line-height:1.45;color:var(--faint)}
.note svg{width:13px;height:13px;flex:none;margin-top:1.5px}
.seg3{grid-template-columns:repeat(3,1fr)}
.pic-btn.round{border-radius:50%;margin-bottom:10px}
.pic-btn.round .av{margin:0}
.hero .pic-btn .cam{box-shadow:0 0 0 3px var(--surface)}
.btn.sm{height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.btn.sm svg{width:16px;height:16px}
label.btn{cursor:pointer}
.sheet-sub{margin:-6px 0 16px;color:var(--muted);font-size:14px;line-height:1.5}
.act.radio{justify-content:flex-start}
.act.radio .t{flex:1;display:flex;flex-direction:column;gap:2px}
.act.radio .t small{font-size:12.5px;color:var(--muted);font-weight:400}
.radio-dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;transition:all .2s var(--ease)}
.act.radio.on .radio-dot{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface-2)}
.kv-list{background:var(--surface-2);border-radius:20px;overflow:hidden}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;font-size:14px}
.kv + .kv{border-top:1px solid var(--line)}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}
.kv .tag{font-family:var(--f-mono)}
.check-row{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;font-size:13.5px;line-height:1.45;color:var(--fg);cursor:pointer}
.check-row input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.pf-label{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pf-preview{display:flex;flex-direction:column;gap:8px}
.pf-card{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
.pf-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pf-txt b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-txt .handle{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.pf-txt .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pf-txt .st i{width:7px;height:7px;border-radius:50%;background:var(--online)}
.pf-txt .st.off i{background:var(--faint)}
.pf-txt p{margin:6px 0 0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.pf-txt p.faint{color:var(--faint)}
.pf-photo{display:flex;gap:8px;flex-wrap:wrap}
.fld .ok{font-size:12px;color:var(--online)}
.fld-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gate{position:absolute;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;text-align:center;animation:tabIn .4s var(--ease)}
.gate h2{margin:6px 0 0;font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:-.025em}
.gate > p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:30ch}
.gate-card{display:flex;align-items:center;gap:12px;width:100%;max-width:320px;padding:14px;border-radius:22px;background:var(--surface);margin-top:12px;text-align:left}
.gate-card .row-main{flex:1}
.gate .btn{width:100%;max-width:320px}
.gate.auth{justify-content:flex-start;overflow-y:auto;padding:max(48px,env(safe-area-inset-top)) 22px 40px;gap:10px}
.gate.auth > *{flex:none}
.auth-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.auth-brand .wordmark{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.04em}
.auth-card{width:100%;max-width:360px;text-align:left;margin-top:8px}
.auth-card .btn{max-width:none}
.auth-card .linkish{align-self:center;margin-top:2px}
.auth-card .note{margin:0;padding:14px;border-radius:18px;background:var(--surface)}
.auth-alt{margin:6px 0 0;color:var(--muted);font-size:14px}
.ok.taken{color:var(--danger,#FF6B63)}
.auth-card .err{display:block;color:#FF6B63;font-size:13.5px;min-height:0}
.older{display:flex;justify-content:center;margin:4px 0 12px}
.older .chip{gap:6px}
.older .chip svg{width:15px;height:15px}
.bubble.sending{opacity:.72}
.tick-pend svg,.tick-fail svg{width:14px;height:14px}
.tick-fail{color:#FF6B63}
.retry{display:inline-flex;align-items:center;gap:5px;align-self:flex-end;margin-top:4px;padding:3px 8px;border-radius:10px;font-size:12px;color:#FF6B63;background:color-mix(in srgb,#FF6B63 12%,transparent)}
.retry svg{width:13px;height:13px}

/* =========================================================
   AMOLED monochrome layer — loaded last, wins over earlier rules.
   Black ground everywhere, hairlines for structure, no glow shadows.
   ========================================================= */
body,.app,.stage,.tab,.convo,.msgs,.dock,.composer,.splash,.gate{background:var(--bg)}
@media (min-width:640px){ body{background:var(--page)} .app{box-shadow:none;border-color:var(--line)} }

/* headers: solid black, hairline appears once content scrolls under */
.tab-head,.convo-head{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none}
.convo-head{border-bottom:1px solid var(--line)}
.tab-title,.wordmark{letter-spacing:-.03em}

/* navigation: docked to the edge, black, seamless */
.nav{left:0;right:0;bottom:0;height:64px;padding:0 6px;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.tab{padding-bottom:88px}
.nav-ind{top:-1px;bottom:auto;height:2px;background:transparent;border-radius:0}
.nav-ind::after{content:"";display:block;width:24px;height:2px;margin:0 auto;border-radius:0 0 2px 2px;background:var(--fg)}
.nav-btn{color:var(--faint);transition:color .2s,transform .15s var(--ease)}
.nav-btn:active{transform:scale(.94)}
.nav-btn svg{width:22px;height:22px}
.nav-btn.on,.nav-btn.on svg{color:var(--fg)}
.nav-btn > span:not(.badge){font-size:10.5px;letter-spacing:.02em}

/* controls */
.icon-btn{background:var(--bg);border:1px solid var(--line);color:var(--fg)}
.icon-btn:active{background:var(--press)}
.icon-btn.ghost,.convo-head .icon-btn,.composer .field .icon-btn,.ctx .icon-btn{background:transparent;border-color:transparent}
.icon-btn.ghost:hover,.convo-head .icon-btn:hover{background:var(--press)}
.composer .field .icon-btn{color:var(--muted)}
.icon-btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{background:var(--bg);border:1px solid var(--line)}
.search:focus-within{box-shadow:none;border-color:var(--muted)}
.chip{border-color:var(--line);color:var(--muted)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.secondary{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.secondary:active{background:var(--press)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 45%,transparent)}
.row:hover,.row:active,.set:active,.act:active,.pick:active{background:var(--press)}
.row-action{background:transparent;border:1px solid var(--line);color:var(--fg)}
.row-x{background:transparent;border:1px solid var(--line)}
.tag{background:transparent;border:1px solid var(--line);color:var(--muted)}
.badge{background:var(--fg);color:var(--bg)}
.badge.muted{background:var(--surface-3);color:var(--muted)}
.fld input,.fld textarea{background:var(--bg);border-color:var(--line)}
.fld input:focus,.fld textarea:focus{border-color:var(--muted)}
.fld .ok{color:var(--muted)}
.switch{background:var(--surface-3)}
.switch::after{background:var(--muted);box-shadow:none}
.switch.on{background:var(--fg)}
.switch.on::after{background:var(--bg)}
:root[data-mode="light"] .switch.on::after{background:var(--bg)}
.seg{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on{background:var(--fg);color:var(--bg);box-shadow:none}
.sw.on i{box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--fg)}
.sw i{box-shadow:inset 0 0 0 1px var(--line)}
.linkish{color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

/* surfaces: hairline outlines, not filled grey blocks */
.card{background:var(--surface);border:1px solid var(--line)}
.hero{background:transparent;padding-block:8px 4px}
.set-ic,.tl-ic,.add-ic,.attach-opt .set-ic{background:transparent;border:1px solid var(--line);color:var(--fg)}
.tl-ic.done{border-color:var(--fg)}
.act-list,.tl,.kv-list,.capab div,.react-bar,.msg-peek,.attach-opt,.quick button,.info-prev,.pf-card,.gate-card{background:var(--bg);border:1px solid var(--line)}
.quick button svg,.react-bar button svg{color:var(--fg)}
.react-bar button.on{background:var(--press)}
.act.radio.on .radio-dot{border-color:var(--fg);background:var(--fg);box-shadow:inset 0 0 0 4px var(--bg)}
.capab h4 i{background:var(--fg)}
.capab div.sim h4 i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--fg)}
.empty-mark{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:0 0 0 12px var(--bg),0 0 0 13px color-mix(in srgb,var(--line) 55%,transparent)}
.convo-empty .av{box-shadow:inset 0 0 0 1px var(--line),0 0 0 10px var(--bg),0 0 0 11px var(--line)}
.starters .chip{background:var(--bg);color:var(--fg)}
.pic-btn .cam,.hero .pic-btn .cam{background:var(--fg);color:var(--bg);box-shadow:0 0 0 3px var(--bg)}
.sheet .pic-btn .cam{box-shadow:0 0 0 3px var(--surface)}
.pic-opt.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--fg)}
.mchip .x{background:var(--fg);color:var(--bg)}

/* overlays */
.ov-backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:var(--surface);box-shadow:inset 0 1px 0 var(--line)}
.dialog{background:var(--surface);border:1px solid var(--line)}
.grabber{background:var(--surface-3)}
.toast{background:var(--fg);color:var(--bg);box-shadow:none}
.viewer{background:#000}
.vw-head .icon-btn{background:transparent;border-color:rgba(255,255,255,.2);color:#fff}

/* avatars: monochrome tones derived from each person's hue */
.av{background:hsl(0 0% calc(var(--av-l) + (sin(var(--h) * 7deg) + 1) * 5% * var(--av-dir)));color:hsl(0 0% var(--av-fg));box-shadow:inset 0 0 0 1px var(--line)}
.hue{background:hsl(0 0% calc(var(--av-l) + (sin(var(--h) * 7deg) + 1) * 5% * var(--av-dir)));box-shadow:inset 0 0 0 1px var(--line)}
.hue.on{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--fg)}
.av .dot{background:var(--online);box-shadow:0 0 0 2.5px var(--bg)}

/* chat */
.them .bubble{background:var(--bubble-in);color:var(--fg)}
.me .bubble{background:var(--accent);color:var(--accent-ink)}
.bmeta{opacity:.55}
.bmeta .read{opacity:1}
.sender,.them .quote b{color:var(--muted)}
.quote{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.me .quote{background:color-mix(in srgb,var(--accent-ink) 9%,transparent)}
.day{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.sim-note{background:transparent;border:1px dashed var(--line)}
.sim-note svg,.sim-tag svg{color:var(--muted)}
.dock{border-top:1px solid var(--line)}
.composer .field{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
.composer .field:focus-within{box-shadow:inset 0 0 0 1px var(--muted)}
.send.ready{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#emoji-btn.on{color:var(--fg)}
.ctx > svg,.ctx .t b{color:var(--fg)}
.emoji-panel{background:var(--bg)}
.emoji-panel.open{border-top:1px solid var(--line)}
.emo-tabs button.on,.emo:hover{background:var(--press)}
.to-bottom{background:var(--bg);border-color:var(--line);box-shadow:none}
.react{background:var(--bg);border-color:var(--line);box-shadow:0 0 0 2px var(--bg)}
.react.mine{background:var(--press);border-color:var(--muted)}
.rec-sim{color:var(--fg);border-color:var(--line)}
.row-preview .draft{color:var(--fg)}
.row-preview .typing,.convo-who .meta > span.live,.row-time.hot{color:var(--fg)}
.typing-b{background:var(--bubble-in)}
.back-n{background:var(--fg);color:var(--bg)}
.media .vd,.media .play{background:rgba(0,0,0,.6)}

/* =========================================================
   Colour layer — the ground stays #000; colour returns where it
   carries meaning: people, media, stickers, status and selection.
   ========================================================= */
.av{background:hsl(var(--h) var(--av-sat) var(--av-l));color:hsl(var(--h) 72% var(--av-fg));box-shadow:none}
.hue{background:hsl(var(--h) var(--av-sat) var(--av-l));box-shadow:none}
.hue.on,.pic-opt.on,.sw.on i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--tint)}
.sender,.them .quote b{color:hsl(var(--h) 72% var(--sender-l))}
.nav-ind::after{background:var(--tint)}
.badge{background:var(--tint);color:var(--tint-ink)}
.badge.muted{background:var(--surface-3);color:var(--muted)}
.back-n{background:var(--tint);color:var(--tint-ink)}
.switch.on{background:var(--tint)}
.switch.on::after,:root[data-mode="light"] .switch.on::after{background:#FFFFFF}
.act.radio.on .radio-dot{border-color:var(--tint);background:var(--tint)}
.search:focus-within,.fld input:focus,.fld textarea:focus{border-color:color-mix(in srgb,var(--tint) 70%,transparent)}
.composer .field:focus-within{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--tint) 70%,transparent)}
:focus-visible{outline-color:var(--tint)}
.row-time.hot,.row-preview .typing,.convo-who .meta > span.live,.linkish,.ctx > svg,.ctx .t b,#emoji-btn.on,#sticker-btn.on{color:var(--tint)}
.linkish{text-decoration-color:color-mix(in srgb,var(--tint) 40%,transparent)}
.set-ic{border:0;color:var(--ic,var(--fg));background:color-mix(in srgb,var(--ic,var(--fg)) 15%,transparent)}
:root[data-mode="light"] .set-ic{color:color-mix(in srgb,var(--ic,var(--fg)) 72%,#000)}
.tl-ic.done{border-color:var(--tint);color:var(--tint)}
.capab h4 i{background:var(--online)}
.capab div.sim h4 i{background:var(--tint);box-shadow:none}
.empty-mark{color:var(--tint)}
.react.mine{background:color-mix(in srgb,var(--tint) 16%,var(--bg));border-color:color-mix(in srgb,var(--tint) 55%,transparent)}
.react-bar button.on{background:color-mix(in srgb,var(--tint) 22%,transparent)}
.fld .ok{color:var(--online)}

/* =========================================================
   Stickers — messages, expression panel, library, creator
   ========================================================= */
/* =========================================================
   Messaging extras
   ========================================================= */
/* chat appearance hooks (scoped to chat screens) */
.me .bubble{background:var(--bubble-out,var(--accent));color:var(--bubble-out-ink,var(--accent-ink))}
.bubble{border-radius:var(--bubble-r,20px)}
.me .quote{background:color-mix(in srgb,var(--bubble-out-ink,var(--accent-ink)) 10%,transparent)}
.me .vplay{background:var(--bubble-out-ink,var(--accent-ink));color:var(--bubble-out,var(--accent))}
.wall-dots{background:radial-gradient(color-mix(in srgb,var(--fg) 10%,transparent) 1.2px,transparent 1.7px) 0 0/18px 18px,var(--bg)!important}
.wall-grid{background:linear-gradient(color-mix(in srgb,var(--fg) 5.5%,transparent) 1px,transparent 1px) 0 0/26px 26px,linear-gradient(90deg,color-mix(in srgb,var(--fg) 5.5%,transparent) 1px,transparent 1px) 0 0/26px 26px,var(--bg)!important}
.wall-aurora{background:radial-gradient(120% 55% at 0% 0%,color-mix(in srgb,#8B7CFF 26%,transparent),transparent 62%),radial-gradient(110% 50% at 100% 100%,color-mix(in srgb,#4ADE9F 18%,transparent),transparent 60%),var(--bg)!important}
.wall-dusk{background:linear-gradient(180deg,color-mix(in srgb,#6D33A8 24%,var(--bg)) 0%,var(--bg) 55%,color-mix(in srgb,#FF7A59 18%,var(--bg)) 100%)!important}
.wall-ocean{background:radial-gradient(90% 60% at 50% 110%,color-mix(in srgb,#1F7AE0 30%,transparent),transparent 70%),var(--bg)!important}
.ap-prev{display:flex;flex-direction:column;gap:2px;padding:18px 14px 16px;margin:14px 16px 0;border-radius:24px;border:1px solid var(--line);min-height:220px}
.ap-prev .mrow{animation:none}
.ap-prev .mrow.tail{margin-bottom:6px}
.ap-sw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);width:46px}
.ap-sw i{width:36px;height:36px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px var(--line)}
.ap-sw.on{color:var(--fg)}
.ap-sw.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tint)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wall-tile{height:64px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:8px 10px;font-size:12px;font-weight:500;color:var(--fg);background:var(--bg)}
.wall-tile.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--tint)}

/* pinned bar */
.pin-bar{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);background:var(--bg);animation:ctxIn .25s var(--ease)}
.pin-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:4px 0}
.pin-ticks{display:flex;flex-direction:column;gap:2px;align-self:stretch;justify-content:center}
.pin-ticks i{width:3px;flex:1;max-height:18px;min-height:6px;border-radius:2px;background:var(--surface-3)}
.pin-ticks i.on{background:var(--tint)}
.pin-txt{min-width:0;display:flex;flex-direction:column;gap:1px}
.pin-txt b{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--tint)}
.pin-txt b svg{width:12px;height:12px}
.pin-txt span{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-bar .icon-btn{width:36px;height:36px}
.pin-bar .icon-btn svg{width:17px;height:17px}

/* bubble labels */
.fwd{width:100%;display:flex;align-items:center;gap:5px;font-size:12px;font-style:italic;opacity:.7;margin-bottom:2px}
.fwd svg{width:13px;height:13px}
.has-media .fwd,.has-file .fwd,.has-loc .fwd{padding:2px 6px 0}
.bmeta .mi{display:inline-flex}
.bmeta .mi svg{width:12px;height:12px}
.ttl-chip{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font:500 10.5px var(--f-mono);color:var(--tint);vertical-align:1px}
.ttl-chip svg{width:12px;height:12px}

/* files */
.bubble.has-file{padding:6px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;width:268px;max-width:100%}
.file-card{display:flex;align-items:center;gap:12px;padding:8px;border-radius:calc(var(--bubble-r,20px) - 6px);background:color-mix(in srgb,currentColor 7%,transparent)}
.sheet .file-card{background:var(--bg);border:1px solid var(--line);border-radius:16px;color:var(--fg)}
.file-ic{position:relative;width:42px;height:50px;flex:none;color:var(--fc);display:grid;place-items:center}
.file-ic svg{width:42px;height:50px;stroke-width:1.4}
.file-ic b{position:absolute;bottom:9px;font:700 8.5px var(--f-mono);letter-spacing:.04em;color:var(--fc)}
.file-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.file-name{font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.file-meta{font-size:11.5px;opacity:.65}
.file-save{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:color-mix(in srgb,currentColor 12%,transparent)}
.file-save svg{width:17px;height:17px}
.file-prev{margin:6px 0 0;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,currentColor 6%,transparent);font:12px/1.45 var(--f-mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:110px;overflow:hidden;opacity:.85}
.has-file .cap{padding:6px 4px 2px}
.has-file > .bmeta,.has-loc > .bmeta{align-self:flex-end;padding:4px 4px 0}

/* location */
.bubble.has-loc{padding:6px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;width:268px;max-width:100%}
.map-ph{position:relative;height:120px;border-radius:calc(var(--bubble-r,20px) - 6px);overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(115deg,transparent 46%,color-mix(in srgb,#FFC15E 40%,transparent) 46.5% 48.5%,transparent 49%),linear-gradient(20deg,transparent 60%,color-mix(in srgb,#fff 22%,transparent) 60.4% 61.6%,transparent 62%),
  linear-gradient(color-mix(in srgb,#5CB0FF 9%,transparent) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,color-mix(in srgb,#5CB0FF 9%,transparent) 1px,transparent 1px) 0 0/22px 22px,#0E1621}
.map-ph.big{height:170px;border-radius:20px;border:1px solid var(--line)}
.map-pin{color:#FF5A5F;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.map-pin svg{width:34px;height:34px;fill:#FF5A5F;stroke:#fff;stroke-width:1.4}
.map-pin.muted svg{fill:#555;stroke:#999}
.map-label{position:absolute;left:10px;right:10px;bottom:8px;font-size:11px;color:#cfd8e3;text-align:center}
.loc-txt{display:flex;flex-direction:column;gap:2px;padding:8px 4px 2px;min-width:0}
.loc-txt b{font-size:14.5px;font-weight:600}
.loc-txt span{font:12px var(--f-mono);opacity:.75}
.loc-txt small{font-size:11px;opacity:.55}
.loc-link{font-size:13px;font-weight:600;color:inherit;text-decoration:underline;text-underline-offset:3px;margin-top:2px}

/* lists: saved items, search results */
.saved-item{display:flex;align-items:center;gap:4px;padding-right:6px}
.saved-item > .row{flex:1;min-width:0}
.sv-thumb{width:48px;height:48px;border-radius:12px;flex:none;display:grid;place-items:center;background-size:cover}
.sv-thumb .stk{width:44px;height:44px}
.res-ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;color:var(--ic);background:color-mix(in srgb,var(--ic) 16%,transparent)}
.res-ic svg{width:21px;height:21px}
mark{background:color-mix(in srgb,var(--tint) 34%,transparent);color:var(--fg);border-radius:3px;padding:0 1px}
.act .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.act .t small{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.4}
.act.danger .t small{color:var(--muted)}
.admin-note{display:flex;gap:8px;align-items:flex-start;align-self:stretch;text-align:left;font-size:12.5px;line-height:1.45;color:var(--muted);padding:10px 12px;border:1px dashed var(--line);border-radius:14px;margin-top:12px}
.admin-note svg{width:15px;height:15px;flex:none;color:#FFC15E;margin-top:1px}
.tag.admin{color:#FFC15E;border-color:color-mix(in srgb,#FFC15E 40%,transparent)}
.attach-sec{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 2px 8px}
.attach-sec:first-of-type{margin-top:0}
.attach-grid.three{grid-template-columns:repeat(3,1fr);gap:8px}
.attach-grid.three .attach-opt{padding:14px 10px 12px;align-items:center;text-align:center}
.attach-grid.three .attach-opt .set-ic{margin-bottom:6px}
.attach-grid.three .attach-opt b{font-size:13px}
.attach-grid.three .attach-opt span:last-child{font-size:11px}

/* =========================================================
   Chat designs — scoped to .dz containers (the chat, previews, cards).
   The app background is never touched here.
   ========================================================= */
.dz .msgs,.ap-prev.dz,.dz-card-prev.dz{gap:var(--gap-cont,2px)}
.dz .mrow.tail,.ap-prev.dz .mrow.tail{margin-bottom:var(--gap-tail,8px)}
.dz .mcol{position:relative}
.dz .them .bubble{background:var(--bubble-in);color:var(--bubble-in-ink,var(--fg))}
.dz .me .bubble{background:var(--bubble-out);color:var(--bubble-out-ink)}
.dz .bubble.dt{padding:var(--b-pad)}
.dz .bubble{transition:background-color .3s var(--ease),border-radius .3s var(--ease),padding .3s var(--ease),box-shadow .3s var(--ease)}

/* Default — stitched pastel label (reference: stitched pastel tags) */
.dz-default .bubble.deco{background-image:linear-gradient(color-mix(in srgb,currentColor 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,currentColor 5%,transparent) 1px,transparent 1px);background-size:9px 9px}
.dz-default .mrow.tail .bubble.deco{border-bottom-left-radius:var(--bubble-r);border-bottom-right-radius:var(--bubble-r)}
.dz-default .bubble.deco.dt::before{content:"";position:absolute;inset:4px;border:1.5px dashed var(--stitch);border-radius:calc(var(--bubble-r) - 4px);pointer-events:none}
.dz-default .me .bubble{--stitch:rgba(255,255,255,.85);--ring:var(--bubble-out)}
.dz-default .them .bubble{--stitch:rgba(207,192,242,.38);--ring:rgba(207,192,242,.55)}
:root[data-mode="light"] .dz-default .them .bubble{--stitch:rgba(124,100,201,.35);--ring:rgba(124,100,201,.45)}
.dz-default .mrow.dc.tail .bubble.deco::after{content:"";position:absolute;inset:-5px;border:1.5px dashed var(--ring);border-radius:calc(var(--bubble-r) + 5px);pointer-events:none;opacity:.75}

/* Glossy — lavender pill with highlight dots */
.dz-glossy .bubble.deco{--dot:rgba(255,255,255,.92);background-image:radial-gradient(circle at 15px 11px,var(--dot) 0 4px,transparent 4.6px),radial-gradient(circle at 27px 9.5px,var(--dot) 0 2.6px,transparent 3.2px),linear-gradient(180deg,rgba(255,255,255,.26),transparent 55%);
  box-shadow:inset 0 0 0 2px var(--g-line),inset 0 -8px 14px rgba(0,0,0,.12),inset 0 5px 12px rgba(255,255,255,.2)}
.dz-glossy .me .bubble{--g-line:color-mix(in srgb,var(--bubble-out) 60%,#2A1670)}
.dz-glossy .them .bubble{--g-line:color-mix(in srgb,var(--bubble-in) 50%,#8E7BD6)}
.dz-glossy .them .bubble.deco{--dot:rgba(255,255,255,.42)}
:root[data-mode="light"] .dz-glossy .them .bubble.deco{--dot:rgba(255,255,255,.95)}
.dz-glossy .mrow.tail .bubble.deco{border-bottom-left-radius:var(--bubble-r);border-bottom-right-radius:var(--bubble-r)}
.dz-glossy .bubble.dt .bmeta{width:100%;justify-content:flex-end;margin-top:3px}

/* Pixel — stepped speech bubble with a hard shadow and tail */
.dz-pixel .bubble.deco{border:12px solid transparent;border-radius:0!important;background:none!important;border-image-slice:4 fill;border-image-width:12px;border-image-repeat:stretch;image-rendering:pixelated}
.dz-pixel .me .bubble.deco{border-image-source:var(--pix-out);filter:drop-shadow(1.5px 0 0 #FF3B4E) drop-shadow(-1.5px 0 0 #FF3B4E) drop-shadow(0 1.5px 0 #FF3B4E) drop-shadow(0 -1.5px 0 #FF3B4E) drop-shadow(4px 4px 0 rgba(255,59,78,.32))}
.dz-pixel .them .bubble.deco{border-image-source:var(--pix-in);filter:drop-shadow(4px 4px 0 var(--pix-shadow-in))}
.dz-pixel .bubble.dt{font-family:'Pixelify Sans',var(--f-mono);font-size:15px;line-height:1.35}
.dz-pixel .bubble.dt .bmeta{width:100%;justify-content:flex-start;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 0;transform:none}
.dz-pixel .mrow.dc.tail .bubble.deco::after{content:"";position:absolute;bottom:-18px;width:12px;height:9px;background-size:100% 100%;image-rendering:pixelated;pointer-events:none}
.dz-pixel .mrow.them.dc.tail .bubble.deco::after{left:6px;background-image:var(--pix-tail-in)}
.dz-pixel .mrow.me.dc.tail .bubble.deco::after{right:6px;background-image:var(--pix-tail-out)}
.dz-pixel .bubble.deco .quote{border-radius:4px}
.dz-pixel .bubble.deco .media{border-radius:2px}

/* Cosmic — starry purple pill with a white rim */
.dz-cosmic .bubble.deco{box-shadow:0 0 0 2px #FFFFFF,0 0 0 4px color-mix(in srgb,var(--cz) 75%,#000);
  background-image:radial-gradient(circle at 12% 30%,rgba(255,255,255,.9) 0 1px,transparent 1.5px),radial-gradient(circle at 38% 80%,rgba(255,255,255,.7) 0 1px,transparent 1.5px),radial-gradient(circle at 66% 20%,rgba(255,255,255,.85) 0 1.2px,transparent 1.7px),radial-gradient(circle at 90% 62%,rgba(255,255,255,.6) 0 1px,transparent 1.5px),radial-gradient(120% 90% at 100% 100%,rgba(173,140,255,.42),transparent 60%),radial-gradient(80% 70% at 0% 0%,rgba(30,14,100,.45),transparent 70%)}
.dz-cosmic .me .bubble{--cz:var(--bubble-out)}
.dz-cosmic .them .bubble{--cz:#5B3FD0}
.dz-cosmic .them .bubble.deco{box-shadow:0 0 0 1.5px rgba(255,255,255,.6),0 0 0 3.5px #2A1F66}
:root[data-mode="light"] .dz-cosmic .them .bubble.deco{box-shadow:0 0 0 2px #FFFFFF,0 0 0 3.5px #8F7BEA;background-image:none}
.dz-cosmic .mrow.tail .bubble.deco{border-bottom-left-radius:var(--bubble-r);border-bottom-right-radius:var(--bubble-r)}
.dz-cosmic .bubble.dt .bmeta{order:-1;width:100%;justify-content:flex-end;margin:0 0 1px;transform:none}
.dz-cosmic .bubble.dt .sender,.dz-cosmic .bubble.dt .quote,.dz-cosmic .bubble.dt .fwd{order:-2}

/* Ocean — navy label with shells and starfish */
.dz-ocean .bubble.deco{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);background-image:radial-gradient(140% 100% at 0% 0%,rgba(255,255,255,.09),transparent 55%)}
.dz-ocean .bubble .bmeta{opacity:.9;background:rgba(0,0,0,.24);padding:1px 7px;border-radius:999px}
:root[data-mode="light"] .dz-ocean .them .bubble .bmeta{background:rgba(0,0,0,.06)}

/* Gallery */
.dz-head{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 16px 0;text-align:center}
.dz-head b{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.02em}
.dz-head > span:last-child{font-size:12.5px;color:var(--muted)}
.dz-badge{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tint);border:1px solid color-mix(in srgb,var(--tint) 45%,transparent);padding:3px 8px;border-radius:999px}
.dz-badge svg{width:12px;height:12px}
.dz-apply{padding:12px 16px 0}
.dz-apply .note{margin:0}
.ap-prev{pointer-events:none;user-select:none;-webkit-user-select:none}
.ap-prev .mrow{animation:none}
.dz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dz-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:20px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:border-color .2s,box-shadow .2s,transform .15s var(--ease);min-width:0}
.dz-card:active{transform:scale(.97)}
.dz-card.browsing{border-color:color-mix(in srgb,var(--tint) 65%,transparent)}
.dz-card.current{box-shadow:0 0 0 2px var(--tint)}
.dz-card-prev{display:flex;flex-direction:column;padding:16px 12px 8px;border-radius:14px;background:var(--bg);overflow:hidden;min-height:118px;pointer-events:none;font-size:12.5px}
.dz-card-prev .mcol{max-width:90%}
.dz-card-prev .bubble{font-size:12.5px;line-height:1.35;max-width:100%}
.dz-card-prev .mrow.tail{margin-bottom:12px}
.dz-card-prev .bmeta svg{width:13px;height:13px}
.dz-card-txt{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px;min-width:0}
.dz-card-txt b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.dz-card-txt > span{font-size:12px;color:var(--muted)}
.dz-check{position:absolute;top:13px;right:13px;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--tint-ink);display:grid;place-items:center;z-index:3}
.dz-check svg{width:14px;height:14px}
input[type=range]:disabled{opacity:.4}

/* Chats tab: just search and filters */
.chats-head{gap:10px;padding:12px 16px 10px}
.chats-head .search{height:40px;border-radius:12px}
.chats-head .search input{font-size:14.5px}
.chats-head .chips{gap:6px}
.chats-head .chip{height:30px;padding:0 13px}
#chats-list{padding-top:2px}
.voice.noaudio .vplay{opacity:.4}
.voice.noaudio .vwave{opacity:.5;cursor:default}
.voice.noaudio .vdur{font-family:var(--f-body);font-size:11.5px;font-style:italic}
.voice .vdur{min-width:auto;white-space:nowrap}
.rec-sim{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.stk-hit{display:block;border-radius:20px}
.stk{display:block;object-fit:contain;-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.bubble.stk-b{background:transparent!important;padding:0;flex-direction:column;align-items:flex-end;flex-wrap:nowrap}
.them .bubble.stk-b{align-items:flex-start}
.stk-b .stk{width:148px;height:148px;transition:transform .2s var(--ease)}
.stk-b:active .stk{transform:scale(.95)}
.stk-b .bmeta{color:var(--muted);opacity:1;transform:none;margin:2px 2px 0;padding:2px 7px;border-radius:999px;background:var(--bg)}
.stk-b .quote{max-width:230px;background:var(--bubble-in);color:var(--fg)}
.stk-b .sender{padding:0 4px}
.stk-missing{width:124px;height:124px;border-radius:26px;border:1px dashed var(--line);display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-size:12px;text-align:center;padding:10px}
.stk-missing svg{width:22px;height:22px}
.checker{background-color:var(--surface);background-image:conic-gradient(var(--surface-2) 25%,transparent 0 50%,var(--surface-2) 0 75%,transparent 0);background-size:22px 22px}

.emoji-panel.open{height:320px}
.xp-tabs{display:flex;gap:2px;padding:4px 8px 0;border-bottom:1px solid var(--line)}
.xp-tabs button{flex:1;height:42px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:7px;transition:color .2s,border-color .2s}
.xp-tabs button.on{color:var(--fg);border-bottom-color:var(--tint)}
.xp-tabs button svg{width:17px;height:17px}
.xp-body{height:calc(100% - 47px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}
.xp-body.emoji{overflow:hidden;padding:0}
.stk-bar{display:flex;gap:8px;padding:10px 12px 2px;align-items:center}
.stk-bar .search{flex:1;height:38px}
.stk-bar .icon-btn{width:38px;height:38px;border-radius:12px}
.stk-sec h5{margin:12px 14px 6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px}
.stk-sec h5 svg{width:12px;height:12px}
.stk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 8px}
.stk-cell{position:relative;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;transition:background .15s,transform .15s var(--ease)}
.stk-cell:hover{background:var(--press)}
.stk-cell:active{transform:scale(.9)}
.stk-cell .stk{width:80%;height:80%}
.stk-cell .anim{position:absolute;right:6px;bottom:6px;width:7px;height:7px;border-radius:50%;background:var(--tint);box-shadow:0 0 0 2px var(--bg)}
.stk-new{border:1.5px dashed var(--line);color:var(--muted);margin:5px;flex-direction:column;gap:2px;font-size:10.5px;align-content:center}
.stk-new svg{width:22px;height:22px}
.xp-note{margin:10px 12px 2px;padding:10px 12px;border-radius:14px;border:1px dashed var(--line);font-size:12.5px;color:var(--muted);line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.xp-note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--tint)}
.xp-empty{padding:14px 16px 4px;font-size:13px;color:var(--muted);text-align:center;line-height:1.45}

.screen{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .42s var(--ease),visibility .42s}
.screen.open{transform:none;visibility:visible}
#creator{z-index:40}
.scr-head{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
.scr-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.02em}
.scr-head .icon-btn.ghost{border:0}
.scr-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.lib-top{padding:12px 16px 0;display:flex;flex-direction:column;gap:12px}
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 28px}
.lib-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:22px;border:1px solid var(--line);background:var(--surface);text-align:center;transition:transform .15s var(--ease),border-color .2s;min-width:0}
.lib-tile:hover{border-color:var(--surface-3)}
.lib-tile:active{transform:scale(.96)}
.lib-tile .stk{width:84px;height:84px}
.lib-tile .nm{font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib-tile .fav{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.lib-tile .fav svg{width:16px;height:16px}
.lib-tile .fav.on{color:#FFC24B}
.lib-tile .kind{position:absolute;top:9px;left:9px;font:600 9.5px var(--f-mono);letter-spacing:.06em;color:var(--tint);border:1px solid color-mix(in srgb,var(--tint) 45%,transparent);padding:1px 5px;border-radius:6px}
.lib-new{border-style:dashed;justify-content:center;color:var(--muted);min-height:136px;font-size:13px;font-weight:500}
.lib-new .add-ic{width:48px;height:48px;border:0;background:color-mix(in srgb,var(--tint) 16%,transparent);color:var(--tint)}
.lib-new .add-ic svg{width:22px;height:22px}
.lib-empty{grid-column:1/-1}

.steps{display:flex;gap:8px;justify-content:center;align-items:center;padding:14px 0 16px}
.steps span{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.steps span i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:500 10.5px var(--f-mono);font-style:normal}
.steps span.on{color:var(--fg)}
.steps span.on i{background:var(--tint);border-color:var(--tint);color:var(--tint-ink)}
.steps span.done i{border-color:var(--tint);color:var(--tint)}
.steps b{width:16px;height:1px;background:var(--line)}
.cr-pad{padding:0 16px 24px}
.src-opts{display:grid;gap:12px}
.src-opt{display:flex;gap:14px;align-items:center;padding:18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:transform .15s var(--ease),border-color .2s}
