    try { await Walls.remove(wp.chatId); const id = wp.chatId; closeWallpaper(); if (ui.openChatId === id) applyWallpaper(id); toast('Wallpaper removed', 'wallpaper'); }
    catch (e) { wp.err = cloudError(e); renderWallEditor(false); }
  },
  'open-frames': () => openFrames(),
  'fr-close': () => closeFrames(),
  'fr-tab': el => { if (ui.fr) { ui.fr.tab = el.dataset.v; renderFrames(); } },
  'fr-pick': el => { if (ui.fr) { ui.fr.draft = el.dataset.v || null; renderFrames(); } },
  'fr-apply': () => ui.fr && saveFrame(ui.fr.draft),
  'fr-remove': () => saveFrame(null),
  'customize': () => customizationSheet(),
  'cz-walls': () => wallChatPicker('photo'),
  'cz-video': () => wallChatPicker('video'),
  'cz-reset': () => resetCustomization(),
});
forms.pp = () => sendPhotoPreview();

/* Wallpaper hooks into opening/closing chats and syncing. */
{
  const _open = openChat, _close = closeChat, _sync = Cloud._sync;
  openChat = function (id) { _open(id); applyWallpaper(id); };
  closeChat = function () { stopWallVideo(); _close(); const l = $('#cw-layer'); if (l) { l.innerHTML = ''; l.hidden = true; } $('#msgs')?.classList.remove('has-cw'); };
  Cloud._sync = async function () { await _sync.call(this); await Walls.load().catch(e => console.warn('ZYVEN: wallpapers', e)); };
}


/* ---------- Event wiring (delegated) ---------- */
let lpTimer = null, lpFired = false, lpStart = null;
const openPressMenu = el => el.dataset.stkpress ? stickerSheet(el.dataset.stkpress)
  : el.dataset.msgpress ? msgActionsSheet(el.dataset.msgpress) : chatActionsSheet(el.dataset.longpress);
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('[data-stkpress],[data-longpress],[data-msgpress]');
  if (!row || e.button > 0) return;
  lpFired = false; lpStart = { x: e.clientX, y: e.clientY };
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpFired = true;
    try { navigator.vibrate && navigator.vibrate(12); } catch (_) {}
    openPressMenu(row);
  }, 480);
});
document.addEventListener('pointermove', e => {
  if (lpStart && Math.hypot(e.clientX - lpStart.x, e.clientY - lpStart.y) > 8) clearTimeout(lpTimer);
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { clearTimeout(lpTimer); lpStart = null; }));
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('[data-stkpress],[data-longpress],[data-msgpress]');
  if (row) { e.preventDefault(); clearTimeout(lpTimer); openPressMenu(row); }
});

document.addEventListener('click', e => {
  if (lpFired) { lpFired = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-action]');
  /* double-tap a bubble (outside its buttons) to ❤️ */
  const bub = e.target.closest('[data-msgpress]');
  if (bub && !el) {
    const id = bub.dataset.msgpress, t = performance.now();
    if (ui.lastTap && ui.lastTap.id === id && t - ui.lastTap.t < 330) { ui.lastTap = null; toggleReaction(id, '❤️'); }
    else ui.lastTap = { id, t };
    return;
  }
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
}, true);

document.addEventListener('change', e => {
  if (['img-in', 'cam-in', 'pp-add'].includes(e.target.id)) {
    const all = [...(e.target.files || [])];
    closeOverlay();
    e.target.value = '';
    const pics = all.filter(f => /^image\//.test(f.type || '') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name || ''));
    if (all.length && !pics.length) { toast('That isn’t a picture. Choose a photo, or use Other files.', 'image'); return; }
    if (pics.length < all.length) toast('Some files weren’t pictures and were skipped.', 'image');
    openPhotoPreview(pics);
    return;
  }
  if (e.target.id === 'wp-img' || e.target.id === 'wp-vid') {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) pickWallFile(f, e.target.id === 'wp-vid' ? 'video' : 'image');
    return;
  }
  if (e.target.id === 'wp-custom') { if (ui.wp) { ui.wp.color = e.target.value; renderWallEditor(true); } return; }
  if (['vid-in', 'doc-in', 'any-in'].includes(e.target.id)) {
    const f = e.target.files && e.target.files[0];
    const id = e.target.id;
    closeOverlay();
    e.target.value = '';
    if (!f) return;
    if (id === 'vid-in' && !f.type.startsWith('video/')) { toast('That isn’t a video. Choose a video, or use Other files.', 'film'); return; }
    if (id === 'vid-in') handleFile(f); else handleAnyFile(f);
    return;
  }
  if (e.target.id === 'backup-in') {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) importBackup(f);
    return;
  }
  if (e.target.id === 'audio-in' || e.target.id === 'audio-cap') {
    const f = e.target.files && e.target.files[0];
    closeOverlay();
    if (f) handleAudioFile(f);
    e.target.value = '';
    return;
  }
  if (e.target.id === 'cr-img' || e.target.id === 'cr-anim') {
    const f = e.target.files && e.target.files[0];
    if (f) (e.target.id === 'cr-img' ? loadStaticImage : loadAnimSource)(f);
    return;
  }
  if (e.target.id === 'pfp-in') {
    const f = e.target.files && e.target.files[0];
    if (f) {
      if (!/^image\//.test(f.type || '')) toast('That isn’t a picture. Choose a JPG, PNG, or WebP photo.', 'image');
      else openCropper(f, { title: 'Profile picture', frame: validFrame(state.profile.frame) }, src => { ui.pdraft.photo = src; renderPfControls(); renderPfPreview(); toast('Photo ready. Save to apply.', 'camera'); });
    }
    e.target.value = '';
    return;
  }
  if (e.target.id === 'gpic-in') {
    const f = e.target.files && e.target.files[0];
    const target = e.target.dataset.target;
    if (f) squarePhoto(f, src => applyGroupPic(target, { kind: 'photo', src }));
    e.target.value = '';
    return;
  }
  if (e.target.id === 'file-in') {
    const f = e.target.files && e.target.files[0];
    closeOverlay();
    handleFile(f);
    e.target.value = '';
  }
});

document.addEventListener('input', e => {
  const key = e.target.dataset.input;
  if (key === 'chat-search') { ui.chatQuery = e.target.value; renderChatsList(); }
  else if (key === 'contact-search') { ui.contactQuery = e.target.value; renderContactsList(); }
  else if (key === 'group-search') { ui.groupQuery = e.target.value; renderGroupsList(); }
  else if (key === 'newchat-search') { ui.newChatQuery = e.target.value; searchPeople(e.target.value, renderNewChatList); }
  else if (key === 'find-search') { ui.findQuery = e.target.value; searchPeople(e.target.value, renderFindList); }
  else if (key === 'au-user') {
    const u = e.target.value.trim().replace(/^@/, '').toLowerCase(), ok = $('#au-user-ok');
    clearTimeout(ui.unameTimer); if (ok) ok.textContent = '';
    if (/^[a-z0-9._]{3,24}$/.test(u)) ui.unameTimer = setTimeout(async () => {
      const { data } = await sb.rpc('username_available', { name: u });
      const o = $('#au-user-ok'); if (o && $('#au-user')?.value.trim().replace(/^@/, '').toLowerCase() === u) { o.textContent = data ? `@${u} is available` : `@${u} is taken`; o.classList.toggle('taken', !data); }
    }, 350);
  }
  else if (key === 'gd-search') filterPicks('#gd-list', e.target.value, e.target.value);
  else if (key === 'gadd-search') filterPicks('#gadd-list', e.target.value, e.target.value);
  else if (key === 'gd-name') { const p = $('#gd-preview'); if (p) p.innerHTML = draftAvatar(72); }
  else if (key === 'bio-count') { $('#bio-count').textContent = `${e.target.value.length}/140`; }
  else if (e.target.id === 'composer') {
    autoGrow(e.target); updateComposerBtn();
    const c = getChat(ui.openChatId);
    if (c && ui.compose.mode !== 'edit') { c.draft = e.target.value; save(); }
    if (e.target.value.trim()) Cloud.sendTyping();
  }
  if (key === 'pf-user') {
    const u = e.target.value.trim().replace(/^@/, '').toLowerCase();
    clearTimeout(ui.unameTimer);
    if (/^[a-z0-9._]{3,24}$/.test(u) && u !== state.profile.username) ui.unameTimer = setTimeout(async () => {
      const { data } = await sb.rpc('username_available', { name: u });
      ui.unameCheck = { u, free: !!data }; renderPfPreview();
    }, 350);
  }
  if (key === 'pf-name' || key === 'pf-user' || e.target.id === 'p-bio') {
    if (key === 'pf-name') { $('#name-count').textContent = `${e.target.value.length}/32`; $('#n-err').textContent = ''; }
    renderPfPreview();
    if (key === 'pf-user') return;
  }
  if (key === 'block-search') { filterPicks('#block-list', e.target.value, e.target.value); return; }
  if (key === 'saved-search') { ui.savedQ = e.target.value; renderSavedList(); return; }
  if (key === 'fwd-search') {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#fwd-list .pick').forEach(p => { p.hidden = q && !p.dataset.name.includes(q); });
    return;
  }
  if (key === 'ap-radius') {
    const first = CS().radius == null;
    CS().radius = +e.target.value; $('#ap-r-v').textContent = `${e.target.value}px`; applyChatStyle(); save();
    if (first) { clearTimeout(ui.radTimer); ui.radTimer = setTimeout(renderAppearance, 400); }
    return;
  }
  if (key === 'stk-search') { ui.stkQuery = e.target.value; const r = $('#stk-results'); if (r) r.innerHTML = stickerResultsHtml(); return; }
  if (key === 'lib-search') { ui.lib.q = e.target.value; renderLibGrid(); return; }
  if (key === 'cr-zoom') { setZoom(+e.target.value / 100); return; }
  if (e.target.id === 'crop-zoom') { ui.crop?.zoom(e.target.value); return; }
  if (key && key.startsWith('wp-') && ui.wp) {
    const v = +e.target.value, s = ui.wp.s, out = $(`#${key}-v`);
    const map = { 'wp-zoom': ['zoom', x => `${x.toFixed(1)}×`], 'wp-dim': ['dim', x => `${Math.round(x * 100)}%`], 'wp-bright': ['bright', x => `${Math.round(x * 100)}%`], 'wp-start': ['start', x => fmtDur(x)], 'wp-len': ['len', x => `${x}s`] };
    const m = map[key]; if (!m) return;
    s[m[0]] = v; if (out) out.textContent = m[1](v);
    if (key === 'wp-start' || key === 'wp-len') { const vid = $('#wp-video'); if (vid) { try { vid.currentTime = s.start; } catch (x) {} } renderWallPreview(true); }
    else renderWallPreview(false);
    return;
  }
  if (key === 'cr-frame') { ui.cr.frame = +e.target.value / 100; $('#cr-frame-v').textContent = `${e.target.value}%`; drawStage(); return; }
  if (key === 'cr-tol') {
    ui.cr.bg.tol = +e.target.value; $('#cr-tol-v').textContent = e.target.value;
    clearTimeout(ui.tolTimer);
    ui.tolTimer = setTimeout(() => { applyBgRemoval(); drawStage(); const s = $('#cr-bg-status'); if (s) { s.textContent = ui.cr.bg.status; s.classList.toggle('warn', !!ui.cr.bg.warn); } }, 180);
    return;
  }
  if (key === 'cr-text') {
    ui.cr.text = e.target.value;
    if (ui.cr.step === 'edit') drawStage();
    else { const t = $('#cr-stage-text'); if (t) t.textContent = e.target.value; }
    return;
  }
  const errEl = e.target.closest('.form')?.querySelector('.err');
  if (errEl) errEl.textContent = '';
});

document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'composer-form') { sendMessage(); return; }
  if (e.target.id === 'pp-form') { sendPhotoPreview(); return; }
  const name = e.target.dataset.form;
  if (authForms[name]) { if (!Auth.busy) authForms[name](e.target).catch(err => { Auth.setBusy(false); Auth.err(authError(err)); }); return; }
  const f = forms[name];
  if (f) Promise.resolve(f(e.target)).catch(err => toast(cloudError(err), 'info'));
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'composer' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  if (e.key === 'Enter' && (e.target.id === 'gd-search' || e.target.id === 'gadd-search')) {
    e.preventDefault();
    const first = e.target.closest('.sheet')?.querySelector('.pick:not([hidden])');
    first && first.click();
  }
  if (e.key === 'Enter' && e.target.id === 'newchat-search') {
    e.preventDefault();
    $('#newchat-list [data-action="open-dm"]')?.click();
  }
  if (e.key === 'Escape') {
    if (!$('#viewer').hidden) closeViewer();
    else if (!$('#overlay').hidden) closeOverlay();
    else if ($('#creator').classList.contains('open')) actions['cr-close']();
    else if ($('#appearance').classList.contains('open')) closeAppearance();
    else if (ui.crop) ui.crop.close();
    else if (ui.pp) closePhotoPreview();
    else if ($('#wallpaper').classList.contains('open')) closeWallpaper();
    else if ($('#frames').classList.contains('open')) closeFrames();
    else if ($('#fstudio').classList.contains('open')) actions['fs-close']();
    else if ($('#saved').classList.contains('open')) closeSaved();
    else if ($('#stickers').classList.contains('open')) closeLibrary();
    else if (ui.rec) stopRecording(false);
    else if ($('#emoji-panel').classList.contains('open')) toggleEmoji(false);
    else if (ui.compose.mode) cancelCompose();
    else if (ui.openChatId) closeChat();
  }
});

document.addEventListener('focusin', e => {
  if (e.target.id === 'composer' && $('#emoji-panel').classList.contains('open') && matchMedia('(pointer:coarse)').matches) toggleEmoji(false);
});

/* Keep relative times ("5 min ago") fresh */
setInterval(() => { if (document.visibilityState === 'visible') { renderChatsList(); renderGroupsList(); if (ui.openChatId) renderConvoHeader(); } }, 60000);

/* =========================================================
   9. BOOT
   ========================================================= */
injectDesignCss();
applyAppearance();
renderShell();
sweepExpired();
applyChatStyle();
renderNav();
renderChatsList();
renderContactsList();
renderGroupsList();
renderProfile();
bootCloud();
try {
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
    if (S().appearance.mode === 'system') { applyAppearance(); renderProfile(); }
  });
} catch (e) { /* older browsers: System follows the theme at load time */ }
setTimeout(() => $('#splash').classList.add('gone'), 750);
</script>
