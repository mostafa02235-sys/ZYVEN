  if (!s || typeof s !== 'object' || s.v !== 7) return b;
  for (const k of Object.keys(b)) if (s[k] === undefined) s[k] = b[k];
  s.settings = { ...b.settings, ...s.settings };
  for (const k of ['privacy', 'notify', 'appearance']) s.settings[k] = { ...b.settings[k], ...(s.settings[k] || {}) };
  return s;
}

/* On-device copy, one per account. The first app version kept a single
   demo data set under CONFIG.storageKey; only its personal preferences
   (theme, bubble design, stickers) are carried over, never its sample
   people or chats. */
const Store = {
  ok: (() => { try { const k = '__m'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  key: id => `zyven.account.${id}`,
  load(id) { try { const raw = localStorage.getItem(this.key(id)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
  save(s) {
    if (!s?.profile?.id) return true;
    try { localStorage.setItem(this.key(s.profile.id), JSON.stringify(cacheCopy(s))); return true; } catch (e) { return false; }
  },
  forget(id) { try { localStorage.removeItem(this.key(id)); } catch (e) {} },
  legacyPrefs() {
    try {
      const old = JSON.parse(localStorage.getItem(CONFIG.storageKey) || 'null');
      if (!old || typeof old !== 'object') return null;
      return { stickers: old.stickers, chatStyle: old.chatStyle, recentEmoji: old.recentEmoji,
        appearance: old.settings?.appearance, notify: old.settings?.notify };
    } catch (e) { return null; }
  },
  device: {
    get() { try { return JSON.parse(localStorage.getItem('zyven.device') || '{}'); } catch (e) { return {}; } },
    set(v) { try { localStorage.setItem('zyven.device', JSON.stringify({ ...this.get(), ...v })); } catch (e) {} },
  },
};
/* What goes on disk: recent messages only, and no temporary blob:/data:
   media (the server copy is fetched again on start). */
function cacheCopy(s) {
  const strip = m => {
    const o = {};
    for (const [k, v] of Object.entries(m)) {
      if (typeof v === 'string' && (v.startsWith('blob:') || (v.startsWith('data:') && v.length > 4096))) continue;
      o[k] = v;
    }
    return o;
  };
  return { ...s, chats: s.chats.map(c => ({ ...c, messages: c.messages.filter(m => !m.pending && !m.localOnly).slice(-80).map(strip) })) };
}

/* Group pictures: a colour with initials, an icon, a sample scene, or an uploaded photo. */
function groupAvatar(g, size = 52) {
  const p = g.pic;
  let style = `--s:${size}px;--h:${p?.hue ?? g.hue ?? 0}`;
  let content = esc(initials(g.name || 'Group'));
  if (p?.kind === 'scene' && SCENES[p.scene]) { style += `;background:${SCENES[p.scene].bg}`; content = ''; }
  else if (p?.kind === 'photo' && p.src) { style += `;background:url('${p.src}') center/cover no-repeat`; content = ''; }
  else if (p?.kind === 'emoji') content = `<span class="av-emo">${p.e}</span>`;
  return `<span class="av sq" style="${style}" aria-hidden="true">${content}</span>`;
}

function chatRow(c) {

  } else {
    const mine = last.from === 'me';
    const who = mine ? 'You: ' : (c.type === 'group' ? firstName(last.from) + ': ' : '');
    const hide = !S().notify.previews && !mine;
    const text = hide ? 'New message' : msgPreview(last);

    preview = `${mine && !last.deleted ? tickIcon(last.status) : ''}${who ? `<span class="who" style="flex:none">${esc(who)}</span>` : ''}${ic ? I(ic) : ''}<span class="txt">${esc(text)}</span>`;
  }
  return `

  const box = $('#chats-list');
  if (!state.chats.length) {
    box.innerHTML = emptyState({ icon: 'inbox', title: 'No conversations yet', body: 'Find people by their username, add them to your contacts, and start talking.', action: 'new-chat', label: 'Start a conversation' });
    return;
  }
  if (q) {
    const scope = all.filter(c => !(ui.chatFilter === 'unread' && !c.unread) && !(ui.chatFilter === 'dm' && c.type !== 'dm') && !(ui.chatFilter === 'group' && c.type !== 'group'));
    renderSearchResults(q, ui.chatQuery.trim(), scope);
    return;
  }
  let list = all.filter(c => {
    if (ui.chatFilter === 'unread' && !c.unread) return false;
    if (ui.chatFilter === 'dm' && c.type !== 'dm') return false;
    if (ui.chatFilter === 'group' && c.type !== 'group') return false;
    if (!q) return true;
    return chatTitle(c).toLowerCase().includes(q) || c.messages.some(m => !m.deleted && msgPreview(m).toLowerCase().includes(q));
  });
  if (!list.length) {
    box.innerHTML = q
      ? emptyState({ icon: 'search', title: 'No matches', body: `Nothing in your conversations matches “${esc(ui.chatQuery)}”.` })
      : emptyState({ icon: 'check', title: 'All caught up', body: 'No conversations in this filter right now.' });
    return;
  }
  const pinned = list.filter(c => c.pinned), rest = list.filter(c => !c.pinned);
  box.innerHTML =
    (pinned.length ? `<div class="section-label">${I('pin')}Pinned</div>${pinned.map(chatRow).join('')}` : '') +
    (rest.length ? `${pinned.length ? '<div class="section-label">Recent</div>' : ''}${rest.map(chatRow).join('')}` : '') +
    `<p class="hint">Press and hold a conversation for more options</p>`;
}

function renderContactsList() {
  const q = ui.contactQuery.trim().toLowerCase();
  const people = state.users.filter(u => u.contact);
  const online = people.filter(u => u.online).length;
  $('#contact-count').textContent = people.length;
  $('#contact-chips').innerHTML =
    chip('Everyone', ui.contactFilter === 'all', 'contact-filter', 'all') +
    chip('Online now', ui.contactFilter === 'online', 'contact-filter', 'online', online);
  const box = $('#contacts-list');
  if (!ui.visited.has('contacts')) { box.innerHTML = skeletonRows(); return; }
  if (!people.length) {
    box.innerHTML = emptyState({ icon: 'contacts', title: 'Your contact list is empty', body: 'Search for people on ZYVEN by their username or name, then add them here.', action: 'add-contact', label: 'Find people' });
    return;
  }
  const list = people
    .filter(u => ui.contactFilter !== 'online' || u.online)
    .filter(u => !q || u.name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q.replace(/^@/, '')))
    .sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length) {
    box.innerHTML = emptyState({ icon: 'search', title: 'No one found', body: q ? `No contact matches “${esc(ui.contactQuery)}”.` : 'Nobody is online right now.', action: q ? 'add-contact' : '', label: 'Add a contact' });

  let html = '', letter = '';
  list.forEach(u => {
    const L = u.name[0].toUpperCase();
    if (L !== letter) { letter = L; html += `<div class="section-label">${L}</div>`; }
    html += contactRow(u);
  });

}

/* ---------- Conversation ---------- */
function renderConvoHeader() {

  const typingId = typingOf(c.id);
  let sub, live = false;
  if (c.type === 'dm') {
    const u = getUser(c.userId);
    if (typingId) { sub = 'typing…'; live = true; } else sub = u ? userStatus(u) : '';
    if (u?.online && !typingId) live = true;
  } else {
    if (c.left) sub = 'You left this group';
    else if (typingId) { sub = `${firstName(typingId)} is typing…`; live = true; }
    else sub = c.members.length ? [...c.members.map(firstName), 'You'].join(', ') : 'Only you · add members from group info';
  }
  const left = c.type === 'group' && !!c.left;
  const blocked = c.type === 'dm' && isBlocked(c.userId);
  $('#composer-form').hidden = left || blocked;
  $('#left-bar').hidden = !left;
  $('#block-bar').hidden = !blocked;

  $('#convo-who').innerHTML = `${chatAvatar(c, 40)}<span class="meta"><b>${esc(chatTitle(c))}${c.ttl && TTL[c.ttl] ? `<span class="ttl-chip" title="Disappearing messages: ${TTL[c.ttl][1]}">${I('timer')}${c.ttl}</span>` : ''}</b><span class="${live ? 'live' : ''}">${esc(sub)}</span></span>`;
  renderPinBar(c);
  $('#convo-who').setAttribute('aria-label', `View details for ${chatTitle(c)}`);

  const bn = $('#back-n');
  bn.hidden = !elsewhere || !S().notify.badges; bn.textContent = elsewhere > 99 ? '99+' : elsewhere;

/* ---------- Message building blocks ---------- */
const findMsg = id => getChat(ui.openChatId)?.messages.find(m => m.id === id);
const senderName = m => m.from === 'me' ? 'You' : (getUser(m.from)?.name || 'Former member');

function quoteHtml(c, id) {
  const r = c.messages.find(x => x.id === id);
  const hue = r && r.from !== 'me' ? (getUser(r.from)?.hue ?? 0) : (state.profile.hue ?? 0);
  return `<button type="button" class="quote" data-action="jump" data-msg="${id}" style="--h:${hue}" aria-label="Go to the original message">
    <b>${I('reply')}${r ? esc(senderName(r)) : 'Message'}</b>
    <span>${r ? esc(msgPreview(r)) : 'Original message is no longer available'}</span></button>`;
}

function mediaBlock(m, metaHtml) {
  const sc = SCENES[m.scene];
  const r = m.ratio || sc?.ratio || 4 / 3;
  const w = r >= 1 ? 252 : Math.max(168, Math.round(300 * r));
  const pic = m.thumb || m.src;
  const bg = pic ? `url('${pic}') center/cover no-repeat`
    : m.poster ? `url('${m.poster}') center/cover no-repeat`
    : sc ? sc.bg : 'var(--surface-3)';
  const up = m.from === 'me' && m.pending
    ? `<span class="up-dim"></span><span class="up-ring" style="--p:${m.progress || 0}"></span><span class="up-pct" role="progressbar" aria-label="Uploading">${Math.round((m.progress || 0) * 100)}%</span>`
    : m.from === 'me' && m.status === 'failed' ? `<span class="up-fail">${I('refresh')}Tap to retry</span>` : '';
  return `<button type="button" class="media" data-action="view-media" data-msg="${m.id}" style="width:${w}px;aspect-ratio:${r};background:${bg}" aria-label="${m.status === 'failed' ? 'Not sent. Tap to retry' : `Open ${m.type === 'video' ? 'video' : 'photo'}`}">
    ${m.type === 'video' && !up ? `<span class="vd">${I('film')}${fmtDur(m.duration)}</span><span class="play">${I('play')}</span>` : ''}${up}
    ${metaHtml ? `<span class="ometa">${metaHtml}</span>` : ''}</button>`;
}

function voiceBlock(m) {
  const bars = (m.wave || makeWave(1)).map(v => `<i style="height:${Math.round(18 + v * 82)}%"></i>`).join('');
  const has = !!voiceSrc(m);
  return `<div class="voice ${has ? '' : 'noaudio'}" data-voice="${m.id}">
    <button type="button" class="vplay" data-action="voice-play" data-msg="${m.id}" aria-label="${has ? 'Play voice message' : 'Sample voice note without audio'}">${I('play')}</button>
    <div class="vwave" data-action="voice-seek" data-msg="${m.id}" role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="${m.duration}"><div class="vbars">${bars}</div><div class="vbars fill">${bars}</div></div>
    <span class="vdur">${has ? fmtDur(m.durationExact || m.duration) : fmtDur(m.duration)}</span></div>`;
}

function msgBubble(c, m, { cont = false, first = true, isNew = false, peek = false } = {}) {
  const mine = m.from === 'me';
  const isGroup = c.type === 'group' && !peek;
  const sender = getUser(m.from);
  const nameHtml = isGroup && !mine && first ? `<span class="sender" style="--h:${sender?.hue ?? 0}">${esc(senderName(m))}</span>` : '';
  const pinnedHere = !peek && (c.pins || []).includes(m.id) && !m.deleted;
  const meta = `<span class="bmeta">${pinnedHere ? `<span class="mi" title="Pinned">${I('pin')}</span>` : ''}${m.expiresAt && !m.deleted ? `<span class="mi" title="Disappears ${esc(fmtFuture(m.expiresAt))}">${I('timer')}</span>` : ''}${m.edited && !m.deleted ? '<span class="ed">edited</span>' : ''}${fmtTime(m.t)}${mine && !m.deleted ? tickIcon(m.status) : ''}</span>`;
  const fwd = m.forwarded && !m.deleted ? `<span class="fwd">${I('forward')}Forwarded</span>` : '';
  const type = m.type || 'text';
  let cls = '', inner;
  if (m.deleted) {
    cls = 'del';
    inner = `<span class="btext">${I('block')}${m.deletedBy === 'admin' ? 'Removed by an admin' : mine ? 'You deleted this message' : 'This message was deleted'}</span>${meta}`;
  } else {
    const quote = fwd + (m.replyTo ? quoteHtml(c, m.replyTo) : '');
    if (type === 'file') {
      cls = 'has-file';
      inner = `${nameHtml}${quote}${fileBlock(m)}${m.caption ? `<span class="cap"><span class="btext">${esc(m.caption)}</span></span>` : ''}${meta}`;
    } else if (type === 'location') {
      cls = 'has-loc';
      inner = `${nameHtml}${quote}${locBlock(m)}${meta}`;
    } else if (type === 'image' || type === 'video') {
      cls = 'has-media';
      inner = `${nameHtml}${quote}${mediaBlock(m, m.caption ? '' : meta)}${m.caption ? `<span class="cap"><span class="btext">${esc(m.caption)}</span>${meta}</span>` : ''}`;
    } else if (type === 'sticker') {
      cls = 'stk-b';
      const st = getSticker(m.stickerId);
      inner = `${nameHtml}${quote}<button type="button" class="stk-hit" data-action="sticker-open" data-sid="${m.stickerId}" aria-label="Sticker: ${esc(st?.name || 'unavailable')}">${stickerImg(st)}</button>${meta}`;
    } else if (type === 'voice') {
      cls = 'has-voice';
      inner = `${nameHtml}${quote}${voiceBlock(m)}${meta}`;
    } else {
      if (!quote && !nameHtml && isJumbo(m.text)) cls = 'jumbo';
      inner = `${nameHtml}${quote}<span class="btext">${esc(m.text)}</span>${meta}`;
    }
  }
  const rx = !m.deleted && m.reactions ? Object.entries(m.reactions).filter(([, us]) => us.length) : [];
  const reacts = rx.length ? `<div class="reacts">${rx.map(([e, us]) =>
    `<button type="button" class="react ${us.includes('me') ? 'mine' : ''}" data-action="react" data-msg="${m.id}" data-e="${esc(e)}" aria-label="${esc(e)} reaction, ${us.length}">${esc(e)}${us.length > 1 ? `<b>${us.length}</b>` : ''}</button>`).join('')}</div>` : '';
  const deco = !['stk-b', 'jumbo', 'del'].includes(cls);
  const dt = deco && !['has-media', 'has-file', 'has-loc', 'has-voice'].includes(cls);
  return `<div class="mrow ${mine ? 'me' : 'them'} ${cont ? 'cont' : 'tail'} ${isNew ? 'new' : ''} ${deco ? 'dc' : ''}" data-mid="${m.id}">
    ${isGroup && !mine ? `<span class="mav">${!cont ? userAvatar(m.from, 28, false) : ''}</span>` : ''}
    <div class="mcol"><div class="bubble ${cls} ${deco ? 'deco' : ''} ${dt ? 'dt' : ''} ${m.pending ? 'sending' : ''}" ${m.deleted || peek ? '' : `data-msgpress="${m.id}"`}>${inner}</div>${reacts}${m.status === 'failed' && !peek ? `<button type="button" class="retry" data-action="msg-retry" data-msg="${m.id}">${I('alert')}Not sent · Tap to retry</button>` : ''}</div></div>`;
}

function convoEmpty(c) {
  const dm = c.type === 'dm';
  const u = dm && getUser(c.userId);
  const name = dm ? (u ? u.name.split(' ')[0] : 'them') : c.name;
  const starters = ['👋', 'Hey! How are you?', 'Free for a quick call later?'];
  return `<div class="convo-empty">
    ${chatAvatar(c, 84)}
    <h3>Say hello to ${esc(name)}</h3>
    <p>${dm ? `@${esc(u?.username || '')} · ${esc(u ? userStatus(u) : '')}` : `${c.members.length + 1} members`}</p>
    <div class="starters">${starters.map(s => `<button class="chip" data-action="starter" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <p class="hint">Double-tap any message to react with ❤️</p>
  </div>`;
}

function renderMessages() {
  const c = getChat(ui.openChatId); if (!c) return;
  const box = $('#msgs');
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  const prevCount = +(box.dataset.count || 0);
  const dayOf = m => startOfDay(m.t);
  const joins = (a, b) => a && b && !a.system && !b.system && a.from === b.from && dayOf(a) === dayOf(b) && Math.abs(b.t - a.t) < 5 * MIN && !b.replyTo;

  let html = c.hasMore
    ? `<div class="older"><button type="button" class="chip" data-action="load-older" id="load-older">${I('refresh')}Load earlier messages</button></div>`
    : `<div class="sim-note">${I('lock')}<span>Only people in this chat can read these messages. They’re kept on the ZYVEN server so they reach every device.</span></div>`;
  let lastDay = null;
  c.messages.forEach((m, i) => {
    const d = dayOf(m);
    if (d !== lastDay) { html += `<div class="day">${fmtDay(m.t)}</div>`; lastDay = d; }
    if (m.system) { html += `<div class="sys">${esc(m.text)}</div>`; return; }
    const prev = c.messages[i - 1], next = c.messages[i + 1];
    html += msgBubble(c, m, { cont: joins(m, next), first: !joins(prev, m), isNew: !ui.seen.has(m.id) });
  });
  const typingId = typingOf(c.id);
  if (!c.messages.some(m => !m.system) && !typingId) html += convoEmpty(c);
  if (typingId) {
    html += `<div class="mrow them tail new dc">${c.type === 'group' ? `<span class="mav">${userAvatar(typingId, 28, false)}</span>` : ''}<div class="mcol"><div class="bubble typing-b deco" aria-label="${esc(firstName(typingId))} is typing"><i></i><i></i><i></i></div></div></div>`;
  }
  box.innerHTML = html;

function toggleVoice(id) {

const hideRecUI = () => $('#composer-form').classList.remove('recording');

  if (m.type === 'image') mountPhotoViewer(m);
}
function runVid() {
  const step = t => {
    const s = ui.vid; if (!s || !s.playing) return;
    s.pos += (t - s.last) / 1000; s.last = t;
    if (s.pos >= s.dur) { s.pos = s.dur; s.playing = false; }
    const bar = $('#vw-bar'), tm = $('#vw-time');
    if (bar) bar.style.width = (s.pos / s.dur * 100) + '%';
    if (tm) tm.textContent = `${fmtDur(s.pos)} / ${fmtDur(s.dur)}`;
    if (!s.playing) { setVidButton(); return; }
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function setVidButton() {
  const b = $('.vw-play'); if (!b || !ui.vid) return;
  b.innerHTML = I(ui.vid.playing ? 'pause' : 'play');
  b.setAttribute('aria-label', ui.vid.playing ? 'Pause' : 'Play');
  $('#vw-media')?.classList.toggle('playing', ui.vid.playing);
}
function closeViewer() {
  const v = $('#viewer');
  if (v.hidden) return;
  ui.vid = null;
  v.querySelector('video')?.pause();
  v.classList.remove('open');
  setTimeout(() => { if (!v.classList.contains('open')) { v.hidden = true; v.innerHTML = ''; } }, 300);
}

function updateComposerBtn() {

  btn.classList.toggle('ready', editing || has);
  if (btn.dataset.kind !== kind) { btn.dataset.kind = kind; btn.innerHTML = I(kind); }
  btn.setAttribute('aria-label', editing ? 'Save edit' : has ? 'Send message' : 'Record voice message');
}

   7. OVERLAYS — sheets, dialogs, toasts
   ========================================================= */
function openSheet(html, { kind = 'sheet', onMount } = {}) {
  const root = $('#overlay');
  clearTimeout(ui.ovTimer);
  if (ui.dlgResolve) { const r = ui.dlgResolve; ui.dlgResolve = null; r(false); }
  root.innerHTML = `<div class="ov-backdrop" data-action="close-overlay"></div>
    <div class="${kind}" role="dialog" aria-modal="true">${kind === 'sheet' ? '<div class="grabber"></div>' : ''}${html}</div>`;
  root.hidden = false;
  root.classList.remove('open');
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  onMount && onMount(root);
}
function closeOverlay() {
  const root = $('#overlay');
  if (ui.dlgResolve) { const r = ui.dlgResolve; ui.dlgResolve = null; r(false); }
  root.classList.remove('open');
  clearTimeout(ui.ovTimer);
  ui.ovTimer = setTimeout(() => { root.hidden = true; root.innerHTML = ''; }, 380);
}
function confirmDialog({ title, body, confirmLabel = 'Confirm', danger = false }) {
  return new Promise(res => {
    openSheet(`<h3>${title}</h3><p>${body}</p>
      <div class="acts"><button class="btn secondary" data-action="dlg-no">Cancel</button>
      <button class="btn ${danger ? 'danger' : ''}" data-action="dlg-yes">${confirmLabel}</button></div>`, { kind: 'dialog' });
    ui.dlgResolve = res;
  });
}
function toast(text, icon = 'check') {
  const root = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${I(icon)}<span>${esc(text)}</span>`;
  root.appendChild(el);
  while (root.children.length > 3) root.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 320); }, 2600);
}

function renderNewChatList() {
  const q = ui.newChatQuery.trim().toLowerCase();
  const qq = q.replace(/^@/, '');
  const contacts = state.users.filter(u => u.contact);
  const list = contacts.sort((a, b) => a.name.localeCompare(b.name)).filter(u => !qq || u.name.toLowerCase().includes(qq) || u.username.includes(qq));
  const box = $('#newchat-list'); if (!box) return;
  const hasChat = id => state.chats.some(c => c.type === 'dm' && c.userId === id && c.messages.length);
  const row = u => `<button class="row" data-action="open-dm" data-user="${u.id}">${userAvatar(u.id, 44)}
        <span class="row-main"><span class="row-name">${esc(u.name)}</span><span class="row-sub">@${esc(u.username)} · ${userStatus(u)}</span></span>
        ${hasChat(u.id) ? '<span class="tag">Open chat</span>' : ''}</button>`;
  let html = '';
  if (list.length) html += `<div class="section-label">${q ? 'Your contacts' : 'Contacts'} · ${list.length}</div>${list.map(row).join('')}`;
  else if (!q) html += emptyState({ icon: 'contacts', title: 'No contacts yet', body: 'Type a username or name above to find people on ZYVEN.' });
  if (qq) {
    const found = (ui.peopleResults?.q === qq ? ui.peopleResults.list : null);
    const others = (found || []).filter(u => !list.some(x => x.id === u.id));
    html += `<div class="section-label">People on ${esc(CONFIG.appName)}</div>`;
    if (!found) html += `<p class="hint">${ui.peopleError ? esc(ui.peopleError) : 'Searching…'}</p>`;
    else if (!others.length) html += `<p class="hint">${list.length ? 'No one else matches' : 'No one on ZYVEN matches'} “${esc(ui.newChatQuery.trim())}”.</p>`;
    else html += others.map(u => { Cloud.remember(u); return row(u); }).join('');
  }
  box.innerHTML = html;
}
/* Server search, shared by "New conversation" and "Find people". */
function searchPeople(raw, render) {
  const qq = raw.trim().toLowerCase().replace(/^@/, '');
  clearTimeout(ui.peopleTimer);
  ui.peopleError = '';
  if (!qq) { ui.peopleResults = null; render(); return; }
  if (ui.peopleResults?.q !== qq) ui.peopleResults = null;
  render();
  ui.peopleTimer = setTimeout(async () => {
    try {
      const list = await Cloud.search(qq);
      if ((ui.lastPeopleQ || '') !== qq) return;
      ui.peopleResults = { q: qq, list };
    } catch (e) { ui.peopleError = cloudError(e, 'Search isn’t available right now.'); }
    render();
  }, 280);
  ui.lastPeopleQ = qq;
}

function squarePhoto(file, cb) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const side = Math.min(img.width, img.height), out = 256;
      const cv = document.createElement('canvas'); cv.width = cv.height = out;
      cv.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, out, out);
      try { cb(cv.toDataURL('image/jpeg', 0.8)); } catch (e) { toast('That photo couldn’t be used', 'image'); }
    };
    img.onerror = () => toast('That image couldn’t be opened. Try a JPG or PNG.', 'image');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function filterPicks(listSel, q, raw) {
  const list = $(listSel); if (!list) return;
  const s = q.trim().toLowerCase().replace(/^@/, '');
  let shown = 0;
  list.querySelectorAll('.pick').forEach(p => {
    const u = getUser(p.dataset.user);
    const ok = !s || u.name.toLowerCase().includes(s) || u.username.includes(s);
    p.hidden = !ok; if (ok) shown++;
  });
  let h = list.querySelector('.no-match');
  if (!shown) {
    if (!h) { h = document.createElement('p'); h.className = 'hint no-match'; list.appendChild(h); }
    h.textContent = `No contacts match “${raw.trim()}”`; h.hidden = false;
  } else if (h) h.hidden = true;
}

function forwardMessage() {
  const f = ui.fwd; if (!f || !f.set.size) return;
  const src = getChat(f.from)?.messages.find(m => m.id === f.msgId); if (!src || src.pending) return;
  const names = [];
  const copy = src.meta?.path ? { path: src.meta.path, poster_path: src.meta.poster_path } : null;
  f.set.forEach(cid => {
    const c = getChat(cid); if (!c) return;
    const msg = { id: uid(), from: 'me', t: now(), forwarded: true };
    FWD_KEYS.forEach(k => { if (src[k] !== undefined) msg[k] = src[k]; });

    Cloud.send(c, msg, files);

function sweepExpired() {

    const gone = c.messages.filter(m => m.expiresAt && m.expiresAt <= t);

    c.messages = c.messages.filter(m => !(m.expiresAt && m.expiresAt <= t));

/* ---------- Saving files to the device ----------

   In the Android app (Capacitor): write to the app cache, then open Android's

const NATIVE = (() => {
  const ce = window.capacitorExports, cap = ce?.Capacitor || window.Capacitor;
  const isNative = !!(cap?.isNativePlatform?.());
  const cache = {};
  const plugin = name => {
    if (!isNative) return null;
    if (cache[name] !== undefined) return cache[name];
    try { cache[name] = ce?.registerPlugin ? ce.registerPlugin(name) : (window.Capacitor?.Plugins?.[name] || null); }
    catch (e) { cache[name] = window.Capacitor?.Plugins?.[name] || null; }

    try {
      const safe = filename.replace(/[\\/:*?"<>|]+/g, '_').slice(0, 120) || 'file';
      const { uri } = await fs.writeFile({ path: `shared/${safe}`, data: await blobToBase64(blob), directory: 'CACHE', recursive: true });

      }
      return { ok: true, msg: 'Choose where to save it' };
    } catch (e) {
      return { ok: false, msg: /cancel/i.test(e?.message || '') ? 'Save cancelled' : `The file couldn’t be saved: ${e?.message || 'unknown error'}` };
    }

  try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl) return { ok: false, msg: 'Saving files isn’t available in this view.' };
  try { await dl.save({ filename, data: blob }); return { ok: true, msg: 'Handed to your device to save' }; }
  catch (e) {
    const code = e?.code, ext = (filename.split('.').pop() || 'this').toLowerCase();
    return { ok: false, msg: code === 'rejected_extension' ? `.${ext} files can’t be saved from the Artifact viewer. PDF, DOCX, XLSX, PPTX, CSV, TXT, ZIP and images can.`

/* ---------- Backup and restore ----------
   Chats, contacts, and the profile live on the server. A backup file holds
   what only this phone keeps: theme, bubble design, notification choices,
   your stickers, and saved messages. Older backups (from the prototype)
   restore the same parts; their sample people and chats are ignored. */
async function exportBackup() {
  const prefs = { appearance: S().appearance, notify: S().notify, typing: S().privacy.typing, chatStyle: state.chatStyle, stickers: state.stickers, recentEmoji: state.recentEmoji, saved: state.saved };
  const data = JSON.stringify({ app: CONFIG.appName, kind: 'settings', exportedAt: new Date().toISOString(), prefs });
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const r = await saveBlobToDevice(`zyven-settings-${stamp}.json`, new Blob([data], { type: 'application/json' }));

  const old = obj?.state || (obj?.v ? obj : null);

  if (prefs.notify) S().notify = { ...S().notify, ...prefs.notify };
  if (typeof prefs.typing === 'boolean') S().privacy.typing = prefs.typing;
  if (prefs.chatStyle) state.chatStyle = { ...CHAT_STYLE_DEFAULT, ...prefs.chatStyle };

/* Effective style for one design, optionally with the user's overrides. */
function designStyle(id, cs, mode, withOverrides = true) {
  const d = DESIGNS[id] || DESIGNS.default;
  const o = withOverrides ? cs : CHAT_STYLE_DEFAULT;
  const v = {};
  let out, outInk;
  if (o.out && o.out !== 'design') {
    out = o.out === 'accent' ? 'var(--accent)' : BUBBLE_OUT[o.out]?.[mode];
    outInk = o.out === 'accent' ? 'var(--accent-ink)' : (mode === 'light' ? '#FFFFFF' : '#000000');
  }
  if (!out) { out = d.out ? d.out[mode] : 'var(--accent)'; outInk = d.out ? d.outInk[mode] : 'var(--accent-ink)'; }
  let inn = o.in && o.in !== 'design' ? BUBBLE_IN[o.in]?.[mode] : null;
  const inInk = inn ? 'var(--fg)' : d.inInk[mode];
  inn = inn || d.in[mode];
  const sp = SPACING[o.spacing]?.[1];
  v['--bubble-out'] = out; v['--bubble-out-ink'] = outInk;
  v['--bubble-in'] = inn; v['--bubble-in-ink'] = inInk;
  v['--bubble-r'] = `${o.radius != null && id !== 'pixel' ? o.radius : d.radius}px`;
  v['--b-pad'] = d.pad;
  v['--gap-cont'] = `${sp ? sp[0] : d.gapCont}px`; v['--gap-tail'] = `${sp ? sp[1] : d.gapTail}px`;
  if (id === 'pixel') {
    const outFill = out.startsWith('var(') ? '#FFFFFF' : out;
    const inStroke = mode === 'light' ? '#111111' : '#FFFFFF';
    v['--pix-out'] = `url("${pixFrame(outFill, '#111111')}")`; v['--pix-tail-out'] = `url("${pixTail(outFill, '#111111', true)}")`;
    v['--pix-in'] = `url("${pixFrame(inn, inStroke)}")`; v['--pix-tail-in'] = `url("${pixTail(inn, inStroke, false)}")`;
    v['--pix-shadow-in'] = mode === 'light' ? 'rgba(0,0,0,.16)' : 'rgba(255,255,255,.16)';
  }
  return { cls: `dz dz-${id}`, vars: v };
}
function paintDesign(el, id, cs, withOverrides) {
  if (!el) return;
  const { cls, vars } = designStyle(id, cs, resolvedMode(), withOverrides);
  DESIGN_ORDER.forEach(k => el.classList.remove(`dz-${k}`));
  el.classList.add(...cls.split(' '));
  ['--bubble-out', '--bubble-out-ink', '--bubble-in', '--bubble-in-ink', '--bubble-r', '--b-pad', '--gap-cont', '--gap-tail', '--pix-out', '--pix-tail-out', '--pix-in', '--pix-tail-in', '--pix-shadow-in']
    .forEach(k => vars[k] != null ? el.style.setProperty(k, vars[k]) : el.style.removeProperty(k));
}
function applyChatStyle() {
  const cs = CS();
  const browse = ui.dzBrowse || cs.design;
  paintDesign($('#convo'), cs.design, cs, true);
  paintDesign($('#ap-prev'), browse, cs, true);

/* ---------- Search across chats ---------- */
function renderSearchResults(q, raw, chats) {
  const box = $('#chats-list');
  const qq = q.replace(/^@/, '');
  const chatHits = chats.filter(c => chatTitle(c).toLowerCase().includes(q));
  const contactHits = state.users.filter(u => (u.name.toLowerCase().includes(q) || u.username.includes(qq)) && !chatHits.some(c => c.type === 'dm' && c.userId === u.id));
  const msgHits = [], fileHits = [];
  chats.forEach(c => c.messages.forEach(m => {
    if (m.system || m.deleted) return;
    const t = m.type || 'text';
    const txt = t === 'text' ? (m.text || '') : (m.caption || '');
    if (txt && txt.toLowerCase().includes(q)) msgHits.push({ c, m, txt });
    const fname = t === 'file' ? m.name : t === 'sticker' ? getSticker(m.stickerId)?.name : t === 'location' ? m.label : '';
    if (fname && fname.toLowerCase().includes(q)) fileHits.push({ c, m, txt: fname });
  }));
  msgHits.sort((a, b) => b.m.t - a.m.t); fileHits.sort((a, b) => b.m.t - a.m.t);
  const who = (c, m) => m.from === 'me' ? 'You: ' : c.type === 'group' ? `${firstName(m.from)}: ` : '';
  const resRow = ({ c, m, txt }, isFile) => `
    <button class="row" data-action="open-result" data-id="${c.id}" data-msg="${m.id}">
      ${isFile ? `<span class="res-ic" style="--ic:${m.type === 'file' ? fileKind(m).color : m.type === 'location' ? '#FF8E7F' : '#FF7AB6'}">${I(typeIcon(m) || 'file')}</span>` : chatAvatar(c, 44)}
      <span class="row-main"><span class="row-top"><span class="row-name">${isFile ? hl(txt, q) : esc(chatTitle(c))}</span><time class="row-time">${fmtListTime(m.t)}</time></span>
      <span class="row-sub">${isFile ? `${esc(chatTitle(c))} · ${m.type === 'file' ? fmtBytes(m.size || 0) : m.type === 'sticker' ? 'Sticker' : 'Location'}` : `${esc(who(c, m))}${hl(snippet(txt, q), q)}`}</span></span>
    </button>`;
  let html = '';
  if (chatHits.length) html += `<div class="section-label">Chats · ${chatHits.length}</div>${chatHits.map(chatRow).join('')}`;
  if (contactHits.length) html += `<div class="section-label">Contacts · ${contactHits.length}</div>${contactHits.map(u => `
    <button class="row" data-action="open-dm" data-user="${u.id}">${userAvatar(u.id, 44)}<span class="row-main"><span class="row-name">${hl(u.name, q)}</span><span class="row-sub">@${esc(u.username)} · Start a conversation</span></span></button>`).join('')}`;
  if (msgHits.length) html += `<div class="section-label">Messages · ${msgHits.length}</div>${msgHits.slice(0, 40).map(h => resRow(h, false)).join('')}`;
  if (fileHits.length) html += `<div class="section-label">Files, stickers & places · ${fileHits.length}</div>${fileHits.slice(0, 30).map(h => resRow(h, true)).join('')}`;
  box.innerHTML = html || emptyState({ icon: 'search', title: 'No matches', body: `No chats, people, messages, or files match “${esc(raw)}”.` });
}

const STK = () => (state.stickers = state.stickers || { mine: [], favorites: [], recent: [] });

const stickerBytes = st => st.format === 'frames' ? st.frames.reduce((n, f) => n + f.src.length, 0) : (st.src || '').length;

function stickerImg(st) {
  if (!st) return `<span class="stk-missing">${I('sticker')}Sticker unavailable</span>`;
  const anim = st.format === 'frames';
  const src = anim ? st.frames[0].src : st.src;
  return `<img class="stk" src="${src}" alt="${esc(st.name || 'Sticker')}" draggable="false"${anim ? ` data-anim="${st.id}"` : ''}>`;

/* Frame-sequence player: one timer drives every visible animated sticker.
   SVG and GIF stickers animate natively inside <img>. */
const animCache = new Map();
function animInfo(id) {
  if (id !== '__draft' && animCache.has(id)) return animCache.get(id);
  const st = getSticker(id);
  if (!st || !st.frames?.length) return null;
  let t = 0; const cum = st.frames.map(f => (t += f.ms || 100));
  const info = { st, cum, total: t };
  if (id !== '__draft') animCache.set(id, info);
  return info;
}
setInterval(() => {
  const imgs = document.querySelectorAll('img[data-anim]');
  if (!imgs.length) return;
  const now = performance.now();
  imgs.forEach(img => {
    if (!img.offsetParent) return;
    const a = animInfo(img.dataset.anim); if (!a) return;
    const t = now % a.total;
    let i = 0; while (i < a.cum.length - 1 && a.cum[i] <= t) i++;
    if (img.dataset.fi !== String(i)) { img.dataset.fi = i; img.src = a.st.frames[i].src; }
  });
}, 40);

      const saved = Object.fromEntries(keepLocal.map(k => [k, existing[k]]));
      for (const k of Object.keys(existing)) if (!keepLocal.includes(k)) delete existing[k];
      Object.assign(existing, m, saved);
      if (m.deleted) c.pins = (c.pins || []).filter(x => x !== m.id);
    } else return;
    computeReceipts(c);
    refresh();
  },
  incoming(c, m) {
    const visible = document.visibilityState === 'visible';
    sb.rpc('mark_delivered', { convs: [c.id] }).then(() => {}, () => {});
    if (ui.openChatId === c.id && visible) { this.markRead(c); if (S().notify.sounds && !c.muted && !inQuietHours()) playTick(660); return; }
    c.unread = (c.unread || 0) + 1;
    const n = S().notify;
    const allowed = c.type === 'group' ? n.groups : n.messages;
    if (allowed && !c.muted && !inQuietHours() && visible) {
      const who = c.type === 'group' ? `${firstName(m.from)} · ${c.name}` : firstName(m.from);
      toast(n.previews ? `${who}: ${msgPreview(m)}` : `New message from ${who}`, m.type === 'sticker' ? 'sticker' : 'chat');
      if (n.vibrate) { try { navigator.vibrate && navigator.vibrate([15, 40, 15]); } catch (e) {} }
      if (n.sounds) playTick(660);
    }
  },
  onMember(evt) {
    const row = evt.new;
    if (!row?.conversation_id || !this.me) return;
    const c = getChat(row.conversation_id);
    if (!c || evt.eventType === 'INSERT') { this.resync(); return; }
    const i = (c.memberRows || []).findIndex(r => r.user_id === row.user_id);
    const prev = i >= 0 ? c.memberRows[i] : null;
    if (i >= 0) c.memberRows[i] = row; else (c.memberRows = c.memberRows || []).push(row);
    if (!prev || prev.role !== row.role || prev.left_at !== row.left_at) { this.resync(); return; }
    computeReceipts(c);
    if (ui.openChatId === c.id) renderMessages();
    renderChatsList(); renderGroupsList();
  },
  async onConversation(evt) {
    const row = evt.new, c = row && getChat(row.id);
    if (!c) return;
    if (row.pic?.kind === 'photo') await Media.sign([row.pic.path]);
    c.pins = Array.isArray(row.pins) ? row.pins.filter(x => UUID_RE.test(x)) : [];
    c.ttl = TTL[row.ttl] ? row.ttl : null;
    if (c.type === 'group') {
      c.name = str(row.title, 40) || c.name; c.desc = str(row.description, 120);
      c.pic = cleanPic(row.pic); c.hue = c.pic?.hue ?? c.hue; c.editInfo = row.edit_info === 'admins' ? 'admins' : 'all';
    }
    refresh();
  },

  /* ---------- Typing (private broadcast channel per conversation) ---------- */
  joinTyping(c) {
    this.leaveTyping();
    if (!sb || !c || c.left || !this.me) return;
    const id = c.id;
    const ch = sb.channel(`typing:${id}`, { config: { private: true, broadcast: { self: false } } });
    ch.on('broadcast', { event: 'typing' }, ({ payload }) => {
      const u = payload?.u;
      if (!u || u === this.me || !UUID_RE.test(u) || S().privacy.typing === false) return;
      ui.typing[id] = u;
      clearTimeout(this.typingTimers[id]);
      this.typingTimers[id] = setTimeout(() => { if (ui.typing[id] === u) delete ui.typing[id]; if (ui.openChatId === id) { renderConvoHeader(); renderMessages(); } renderChatsList(); }, 4500);
      if (ui.openChatId === id) { renderConvoHeader(); renderMessages(); }
      renderChatsList();
    }).subscribe();
    this.typing = { ch, id, last: 0 };
  },
  sendTyping() {
    const t = this.typing;
    if (!t || S().privacy.typing === false) return;
    const n = Date.now(); if (n - t.last < 2500) return;
    t.last = n;
    t.ch.send({ type: 'broadcast', event: 'typing', payload: { u: this.me } }).catch(() => {});
  },
  leaveTyping() { if (this.typing) { try { sb.removeChannel(this.typing.ch); } catch (e) {} this.typing = null; } },

  /* ---------- Presence and periodic refresh ---------- */
  startTimers() {
    this.timers.forEach(clearInterval);
    const beat = () => {
      if (!this.me || document.visibilityState !== 'visible') return;
      const p = S().privacy;
      sb.rpc('touch_presence', { visible: !(p.onlineStatus === 'nobody' && p.lastSeen === 'nobody') }).then(() => {}, () => {});
    };
    beat();
    this.timers = [setInterval(beat, 60000), setInterval(() => this.refreshPeople().catch(() => {}), 90000)];
  },
  markRead(c) {
    if (!c || c.left || !this.me) return;
    c.unread = 0;
    clearTimeout(this.readTimers[c.id]);
    this.readTimers[c.id] = setTimeout(() => sb.rpc('mark_read', { conv: c.id }).then(() => {}, () => {}), 300);
  },

  /* ---------- Sending ---------- */
  async send(c, msg, files = {}) {
    if (files && Object.keys(files).length) (ui.outbox = ui.outbox || new Map()).set(msg.id, files);
    msg.pending = true; msg.status = 'sending'; delete msg.error;
    refresh();
    try {
      const meta = {}, uploads = [], copies = [];
      let body = null;
      if (msg.replyTo) meta.reply_to = msg.replyTo;
      if (msg.forwarded) meta.forwarded = true;
      const f = files || {};
      switch (msg.type) {
        case 'text': body = msg.text; break;
        case 'image':
          body = msg.caption || null; meta.ratio = msg.ratio;
          if (f.copy?.path) copies.push(['path', f.copy.path]);
          else {
            const main = f.main || (msg.src?.startsWith('data:') ? await dataUrlToBlob(msg.src) : null);
            uploads.push(['path', main, `photo.${main?.type === 'image/png' ? 'png' : main?.type === 'image/webp' ? 'webp' : main?.type === 'image/gif' ? 'gif' : 'jpg'}`]);
            if (f.thumb) uploads.push(['thumb_path', f.thumb, 'thumb.jpg']);
          }
          break;
        case 'video':
          body = msg.caption || null; Object.assign(meta, { ratio: msg.ratio, duration: msg.duration });
          if (f.copy?.path) { copies.push(['path', f.copy.path]); if (f.copy.poster_path) copies.push(['poster_path', f.copy.poster_path]); }
          else {
            uploads.push(['path', f.main, safeFileName(f.main?.name || 'video.mp4')]);
            if (msg.poster?.startsWith('data:')) uploads.push(['poster_path', await dataUrlToBlob(msg.poster), 'poster.jpg']);
          }
          break;
        case 'voice':
          Object.assign(meta, { duration: msg.duration, durationExact: msg.durationExact, wave: msg.wave, mime: msg.audioMime });
          if (f.copy?.path) copies.push(['path', f.copy.path]); else uploads.push(['path', f.main, `voice.${audioExt(msg.audioMime)}`]);
          break;
        case 'file':
          body = msg.caption || null;
          Object.assign(meta, { name: msg.name, size: msg.size, mime: msg.mime, ext: msg.ext, ...(msg.preview ? { preview: msg.preview } : {}) });
          if (f.copy?.path) copies.push(['path', f.copy.path]); else uploads.push(['path', f.main, safeFileName(msg.name)]);
          break;
        case 'sticker': {
          meta.stickerId = msg.stickerId;
          if (f.copy?.path) copies.push(['path', f.copy.path]);
          else if (!PACK_MAP.has(msg.stickerId)) {
            const st = getSticker(msg.stickerId);
            if (!st) throw new Error('This sticker is no longer available.');
            uploads.push(['path', new Blob([JSON.stringify(stickerPayload(st))], { type: 'application/json' }), 'sticker.json']);
          }
          break;
        }
        case 'location': ['lat', 'lng', 'acc', 'label'].forEach(k => { if (msg[k] !== undefined) meta[k] = msg[k]; }); break;
        default: throw new Error('Unsupported message');
      }
      const total = uploads.reduce((n, [, b]) => n + (b?.size || 0), 0) || 1;
      let doneBytes = 0;
      msg.progress = 0;
      for (const [key, blob, name] of uploads) {
        if (!blob) throw new Error('The file for this message is no longer on this phone. Delete it and send it again.');
        if (blob.size > 25 * 1024 * 1024) throw new Error('too large');
        meta[key] = await Media.uploadProgress(`${c.id}/${msg.id}/${name}`, blob, 'chat-media', p => { msg.progress = (doneBytes + p * blob.size) / total; paintProgress(msg); });
        doneBytes += blob.size;
      }
      for (const [key, from] of copies) meta[key] = await Media.copy(from, `${c.id}/${msg.id}/${from.split('/').pop()}`);
      const { data, error } = await sb.from('messages').insert({ id: msg.id, conversation_id: c.id, kind: msg.type, body, meta }).select(MSG_COLS).single();
      if (error) throw error;
      await Media.sign(metaPaths(data.meta));
      Object.assign(msg, { pending: false, status: 'sent', t: Date.parse(data.created_at), at: data.created_at, meta: data.meta });
      if (data.expires_at) msg.expiresAt = Date.parse(data.expires_at);
      setMediaUrls(msg);
      ui.outbox?.delete(msg.id);
      sortMsgs(c.messages);
      computeReceipts(c);
    } catch (e) {
      console.warn('ZYVEN: send failed', e);
      msg.pending = false; msg.status = 'failed';
      msg.error = /no longer/.test(e?.message || '') ? e.message : cloudError(e, 'Not sent. Tap the message to try again.');
      toast(msg.error, 'info');
    }
    refresh();
  },
};

/* ---------- Actions that change things on the server ---------- */
Object.assign(Cloud, {
  async rpc(name, args) { const { data, error } = await sb.rpc(name, args); if (error) throw error; return data; },
  async openDirect(userId) {
    const existing = state.chats.find(c => c.type === 'dm' && c.userId === userId);
    if (existing) { closeOverlay(); openChat(existing.id); return; }
    if (!this.me || !UUID_RE.test(userId || '')) return;
    try {
      const id = await this.rpc('get_or_create_direct', { other: userId });
      await this.sync();
      closeOverlay();
      if (getChat(id)) openChat(id); else toast('Couldn’t open that chat. Try again.', 'info');
    } catch (e) { toast(cloudError(e), 'info'); }
  },
  async search(q) {
    const data = await this.rpc('search_profiles', { q }) || [];
    await Media.sign(data.map(p => p.avatar_path), 'avatars');
    return data.map(p => profileToUser(p, getUser(p.id)));
  },
  remember(u) {
    const i = state.users.findIndex(x => x.id === u.id);
    if (i >= 0) state.users[i] = { ...state.users[i], ...u, contact: !!(state.users[i].contact || u.contact) };
    else state.users.push(u);
  },
  async addContact(u) {
    const { error } = await sb.from('contacts').insert({ contact_id: u.id });
    if (error && error.code !== '23505') throw error;
    this.remember({ ...u, contact: true });
    ui.visited.add('contacts'); refresh();
  },
  async removeContact(id) {

  },
  async block(id) {

  },
  async unblock(id) {

    if (error) throw error;
    state.blocked = (state.blocked || []).filter(x => x !== id);
  },
  async report(userId, reason, details) {
    const { error } = await sb.from('reports').insert({ reported_id: userId, reason, details });
    if (error) throw error;
  },
  async uploadGroupPhoto(convId, dataUrl) {
    const path = `${convId}/group/${uid()}.jpg`;
    await Media.upload(path, await dataUrlToBlob(dataUrl), 'image/jpeg');
    await Media.sign([path]);
    return path;
  },
  async createGroup(name, desc, pic, ids) {
    const first = pic?.kind === 'photo' ? { kind: 'hue', hue: pick(PIC_HUES) } : pic;
    const id = await this.rpc('create_group', { group_title: name, group_description: desc, group_pic: first, member_ids: ids });
    if (pic?.kind === 'photo' && pic.src) {
      try {
        const path = await this.uploadGroupPhoto(id, pic.src);
        await this.rpc('update_group', { conv: id, group_title: name, group_description: desc, group_pic: { kind: 'photo', path } });
      } catch (e) { toast('The group was created, but its photo couldn’t be uploaded.', 'image'); }
    }
    await this.sync();
    return id;
  },
  async updateGroup(g, { name = g.name, desc = g.desc || '', pic = null } = {}) {
    let p = null;
    if (pic?.kind === 'photo' && pic.src?.startsWith('data:')) p = { kind: 'photo', path: await this.uploadGroupPhoto(g.id, pic.src) };
    else if (pic) { p = { ...pic }; delete p.src; }
    await this.rpc('update_group', { conv: g.id, group_title: name, group_description: desc, group_pic: p });
    await this.sync();
  },
  async loadOlder(c) {
    if (!c || c.loadingOlder) return 0;
    c.loadingOlder = true;
    try {
      const first = c.messages.find(m => m.at);
      let q = sb.from('messages').select(MSG_COLS).eq('conversation_id', c.id).order('created_at', { ascending: false }).limit(PAGE);
      if (first) q = q.lt('created_at', first.at);
      if (c.clearedAt) q = q.gt('created_at', new Date(c.clearedAt).toISOString());
      const { data, error } = await q;
      if (error) throw error;
      await this.ensureUsers(data.flatMap(r => [r.sender_id, ...(r.meta?.targets || [])]));
      await Media.sign(data.flatMap(r => metaPaths(r.meta)));
      const have = new Set(c.messages.map(m => m.id)), hidden = new Set(state.hiddenMsgs?.[c.id] || []);
      const add = data.map(rowToMsg).filter(m => !have.has(m.id) && !hidden.has(m.id));
      c.messages = sortMsgs([...add, ...c.messages]);
      c.hasMore = data.length >= PAGE;
      computeReceipts(c);
      loadRemoteStickers(add).then(any => { if (any) refresh(); });
      return add.length;
    } finally { c.loadingOlder = false; }
  },
  async deleteForEveryone(m) {
    const meta = await this.rpc('delete_message', { msg: m.id });
    if (m.from === 'me') {
      const paths = metaPaths(meta || {});
      if (paths.length) sb.storage.from('chat-media').remove(paths).then(() => {}, () => {});
    }
  },
  async saveProfile({ name, username, bio, hue, photo }) {
    const p = state.profile;
    const upd = { display_name: name, username, bio, hue };
    let oldPath = null;
    if (photo !== p.photo) {
      if (photo && photo.startsWith('data:')) {
        const path = `${this.me}/${uid()}.jpg`;
        await Media.upload(path, await dataUrlToBlob(photo), 'image/jpeg', 'avatars');
        upd.avatar_path = path; oldPath = p.photoPath;
      } else if (!photo) { upd.avatar_path = null; oldPath = p.photoPath; }
    }
    const { error } = await sb.from('profiles').update(upd).eq('id', this.me);
    if (error) {
      if (upd.avatar_path) sb.storage.from('avatars').remove([upd.avatar_path]).then(() => {}, () => {});
      throw error;
    }
    if (oldPath) sb.storage.from('avatars').remove([oldPath]).then(() => {}, () => {});
    await this.loadProfile();
  },
  async savePrivacy() {
    const pr = S().privacy;
    const { error } = await sb.from('profiles').update({
      privacy_online: pr.onlineStatus, privacy_last_seen: pr.lastSeen, privacy_photo: pr.photo, read_receipts: !!pr.readReceipts,
    }).eq('id', this.me);
    if (error) throw error;
  },
});

const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const authForms = {
  async signin() {
    const email = $('#au-email').value.trim(), password = $('#au-pass').value;
    Auth.email = email;
    if (!EMAIL_RE.test(email)) return Auth.err('Enter your email address.');
    if (!password) return Auth.err('Enter your password.');
    Auth.err(''); Auth.setBusy(true, 'Signing in…');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    Auth.setBusy(false);
    if (error) return Auth.err(authError(error));
    await Cloud.start(data.user);
  },
  async signup() {

    const email = $('#au-email').value.trim(), password = $('#au-pass').value;
    Auth.email = email;

    if (!/^[a-z0-9._]{3,24}$/.test(username)) return Auth.err('Usernames use 3–24 lowercase letters, numbers, dots, or underscores.');
    if (!EMAIL_RE.test(email)) return Auth.err('Enter a valid email address.');

      if (error) throw error;
      Auth.setBusy(false);

  async reset() {
    const email = $('#au-email').value.trim(), token = $('#au-code').value.replace(/\s+/g, ''), password = $('#au-pass').value;
    Auth.email = email;
    if (!EMAIL_RE.test(email)) return Auth.err('Enter your account’s email address.');
    if (!/^\d{6,10}$/.test(token)) return Auth.err('Enter the code from the email.');
    if (password.length < 8) return Auth.err('Use a password with at least 8 characters.');
    Auth.err(''); Auth.setBusy(true, 'Saving…');
    const { data, error } = await sb.auth.verifyOtp({ email, token, type: 'recovery' });
    if (error) { Auth.setBusy(false); return Auth.err(authError(error)); }
    const { error: e2 } = await sb.auth.updateUser({ password });
    Auth.setBusy(false);

    toast('Password changed. You’re signed in.', 'check');

async function signOut(erase) {
  const id = Cloud.me;
  closeOverlay();
  try { if (ui.pp) closePhotoPreview(); if (ui.crop) ui.crop.close(); if ($('#wallpaper').classList.contains('open')) closeWallpaper(); if ($('#frames').classList.contains('open')) closeFrames(); if ($('#fstudio').classList.contains('open')) closeFrameStudio(); stopWallVideo(); } catch (x) {}
  ui.wallUrls.forEach(u => { if (u.startsWith('blob:')) URL.revokeObjectURL(u); }); ui.wallUrls.clear();
  if (erase) { try { if ('caches' in window) caches.delete('zyven-wallpapers-v1'); } catch (x) {} }
  if (ui.openChatId) closeChat();
  Cloud.stop();
  try { await sb.auth.signOut({ scope: 'local' }); } catch (e) { /* signed out on this phone either way */ }
  if (erase && id) Store.forget(id);
  state = blankState();
  { const dev = Store.device.get(); if (dev.appearance) state.settings.appearance = { ...state.settings.appearance, ...dev.appearance }; }
  applyAppearance(); renderProfile(); refresh();
  Auth.show('signin');
}

async function bootCloud() {
  if (!sb) { Auth.show('setup'); return; }
  sb.auth.onAuthStateChange(event => {
    if (event === 'SIGNED_OUT' && Cloud.me) {
      setTimeout(() => { if (Cloud.me) { toast('You were signed out', 'logout'); signOut(false); } }, 0);
    }
  });
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) { session = null; }
  if (session?.user) Cloud.start(session.user).catch(e => toast(cloudError(e), 'info'));
  else Auth.show('signin');
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || !Cloud.me) return;
    if (Date.now() - Cloud.lastSync > 20000) Cloud.resync(50);
    if (ui.openChatId) Cloud.markRead(getChat(ui.openChatId));
  });
  window.addEventListener('online', () => { if (Cloud.me) Cloud.resync(50); });
}

function sendMessage() {

      m.text = text; m.edited = true; m.editedAt = now();

/* Every outgoing message goes through here. It shows at once with a clock,
   then the server confirms it (one tick) or it's marked "Not sent". */
function postMine(fields) {
  const c = getChat(ui.openChatId); if (!c) return;
  const files = fields._files || {};
  delete fields._files;
  const msg = { id: uid(), from: 'me', t: now(), ...fields };
  if (!UUID_RE.test(msg.id)) msg.id = uid();
  if (ui.compose.mode === 'reply') {
    const r = findMsg(ui.compose.id);
    if (r && !r.pending && r.status !== 'failed') msg.replyTo = ui.compose.id;
  }
  clearCompose();
  c.messages.push(msg);
  if (S().notify.sounds) playTick();
  $('#msgs').dataset.fresh = '1';
  Cloud.send(c, msg, files);
}

function takeCaption() {
  const ta = $('#composer');
  const t = ta.value.trim();
  if (t && ui.compose.mode !== 'edit') {
    ta.value = ''; autoGrow(ta); updateComposerBtn();
    const c = getChat(ui.openChatId); if (c) c.draft = '';
    return t;
  }
  return '';
}
function handleFile(file) {
  if (!file || !ui.openChatId) return;
  if (file.type.startsWith('image/')) { openPhotoPreview([file]); return; }
  if (false) {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * s)); cv.height = Math.max(1, Math.round(img.height * s));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let src; try { src = cv.toDataURL('image/jpeg', 0.82); } catch (e) { src = reader.result; }
        postMine({ type: 'image', src, ratio: +(cv.width / cv.height).toFixed(3), caption: takeCaption() });
      };
      img.onerror = () => toast('That image couldn’t be opened. Try a JPG or PNG.', 'image');
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  } else if (file.type.startsWith('video/')) {
    if (file.size > FILE_MAX) { toast(`Videos can be up to 25 MB. This one is ${fmtBytes(file.size)}.`, 'film'); return; }
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'auto'; v.muted = true; v.playsInline = true; v.src = url;
    let done = false;
    const finish = poster => {
      if (done) return; done = true;
      const ratio = v.videoWidth && v.videoHeight ? +(v.videoWidth / v.videoHeight).toFixed(3) : 16 / 9;
      const id = uid(); ui.blobs.add(id);
      postMine({ id, type: 'video', blob: url, poster, ratio, duration: Math.round(v.duration) || 0, caption: takeCaption(), _files: { main: file } });
    };
    v.onloadeddata = () => { try { v.currentTime = Math.min(0.5, (v.duration || 1) / 2); } catch (e) { finish(null); } };
    v.onseeked = () => {
      let poster = null;
      try {
        const s = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(v.videoWidth * s); cv.height = Math.round(v.videoHeight * s);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
        poster = cv.toDataURL('image/jpeg', 0.6);
      } catch (e) { /* poster is optional */ }
      finish(poster);
    };
    v.onerror = () => { if (!done) { done = true; URL.revokeObjectURL(url); toast('This video format can’t be previewed here', 'film'); } };
    setTimeout(() => finish(null), 4000);
  } else {
    handleAnyFile(file);
  }
}

function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    toast(ok ? 'Copied to clipboard' : 'Copying isn’t allowed in this view', ok ? 'copy' : 'info');
  };
  try {
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard', 'copy'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}

let audioCtx = null;
function playTick(freq = 880) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.06, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.18);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.2);
  } catch (e) { /* audio not available */ }
}

function applyAppearance() {
  if (!CONFIG.accents[S().appearance.accent]) S().appearance.accent = 'white';
  const { accent } = S().appearance;
  const mode = resolvedMode();
  const a = CONFIG.accents[accent];
  const root = document.documentElement;
  root.dataset.mode = mode;
  root.style.setProperty('--accent', a.bubble[mode]);
  root.style.setProperty('--accent-ink', mode === 'light' ? '#FFFFFF' : '#000000');
  root.style.setProperty('--tint', a.tint[mode]);
  root.style.setProperty('--tint-ink', mode === 'light' ? '#FFFFFF' : '#000000');
  if (typeof applyChatStyle === 'function' && $('#convo')?.innerHTML) applyChatStyle();
}

/* ---------- Form handlers ---------- */
const forms = {
  async group(form) {
    const name = $('#group-name').value.trim();
    const err = $('#group-err');
    if (!name) { err.textContent = 'Give the group a name.'; $('#group-name').focus(); return; }
    if (!ui.gdraft.members.size) { err.textContent = 'Pick at least one person to add.'; $('#group-name').scrollIntoView({ block: 'nearest' }); return; }
    const btn = $('#gd-submit'); if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Creating…'; }
    try {
      const id = await Cloud.createGroup(name, $('#gd-desc').value.trim(), ui.gdraft.pic, [...ui.gdraft.members]);
      ui.visited.add('groups'); ui.gdraft = null;
      closeOverlay(); toast(`${name} created`, 'groups');
      if (getChat(id)) openChat(id);
    } catch (e) {
      if (btn) { btn.disabled = false; renderDraftMembers(); }
      err.textContent = cloudError(e);
    }
  },
  async report(form) {
    const uid2 = form.dataset.user, u = getUser(uid2); if (!u) return;
    const reason = ui.reportReason || REPORT_REASONS[0], details = $('#rp-det').value.trim();
    const blockToo = $('#rp-block').checked && !isBlocked(uid2);
    try { await Cloud.report(uid2, reason, details); if (blockToo) await Cloud.block(uid2); }
    catch (e) { toast(cloudError(e), 'info'); return; }
    state.reports = state.reports || [];
    state.reports.push({ id: 'rp_' + uid(), userId: uid2, reason, details, at: now(), sent: true });
    closeOverlay(); refresh(); renderProfile();
    toast(`Report sent${blockToo ? ` · ${u.name.split(' ')[0]} blocked` : ''}`, 'flag');
  },
  async password() {
    const a = $('#pw-new').value, b = $('#pw-again').value, err = $('#pw-err');
    if (a.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
    if (a !== b) { err.textContent = 'The two passwords don’t match.'; return; }
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { err.textContent = authError(error); return; }
    closeOverlay(); toast('Password changed', 'lock');
  },
  'stk-rename'(form) {
    const st = getSticker(form.dataset.sid); if (!st) return;
    st.name = $('#stk-name').value.trim() || 'Untitled sticker';
    save(); rerenderStickerViews(); stickerSheet(st.id); toast('Sticker renamed', 'pen');
  },
  async 'group-rename'(form) {
    const g = getChat(form.dataset.id); if (!g) return;
    const name = $('#gr-name').value.trim(), desc = $('#gr-desc').value.trim();
    if (!name) { $('#gr-err').textContent = 'The group needs a name.'; $('#gr-name').focus(); return; }
    if (name === g.name && desc === (g.desc || '')) { groupInfoSheet(g.id); return; }
    try { await Cloud.updateGroup(g, { name, desc }); }
    catch (e) { $('#gr-err').textContent = cloudError(e); return; }
    if (getChat(g.id)) groupInfoSheet(g.id);
    toast('Group updated', 'pen');
  },
  async profile(form) {
    const name = $('#p-name').value.trim();
    const [username, issue] = usernameIssue($('#p-user').value);
    if (!name) { $('#n-err').textContent = 'Your display name can’t be empty.'; $('#p-name').focus(); return; }
    if (issue) { $('#p-err').textContent = issue; $('#p-ok').textContent = ''; $('#p-user').focus(); return; }
    const btn = form.querySelector('button[type=submit]'); if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Saving…'; }
    try { await Cloud.saveProfile({ name, username, bio: $('#p-bio').value.trim(), hue: ui.pdraft.hue, photo: ui.pdraft.photo }); }
    catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Save changes'; }
      const t = cloudError(e);
      if (/username/i.test(t)) { $('#p-err').textContent = t; $('#p-ok').textContent = ''; } else toast(t, 'info');
      return;
    }
    closeOverlay(); renderProfile(); refresh(); toast('Profile saved');
  },
};

/* =========================================================
   7x. PROFILE PICTURE FRAMES — original vector frames drawn on top of
   the photo (the photo itself is never changed). viewBox -60..60;
   the photo is the circle of radius 40, so decorations stay on the
   ring outside it and never cover the face.
   ========================================================= */
const FR = (() => {
  const P = (deg, r) => { const a = deg * Math.PI / 180; return [+(Math.cos(a) * r).toFixed(2), +(Math.sin(a) * r).toFixed(2)]; };
  const ring = (r, stroke, w, extra = '') => `<circle r="${r}" fill="none" stroke="${stroke}" stroke-width="${w}" ${extra}/>`;
  const star4 = (x, y, r, fill, stroke = 'none', sw = 0) =>
    `<path d="M${x} ${y - r}Q${x} ${y} ${x + r} ${y}Q${x} ${y} ${x} ${y + r}Q${x} ${y} ${x - r} ${y}Q${x} ${y} ${x} ${y - r}Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  const star5 = (x, y, r, fill, stroke = 'none', sw = 0) => {
    const pts = []; for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r; const [a, b] = P(-90 + i * 36, rr); pts.push(`${(x + a).toFixed(2)},${(y + b).toFixed(2)}`); }
    return `<polygon points="${pts.join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  };
  const flower = (x, y, r, petal, center, rot = 0) => {
    let s = '';
    for (let i = 0; i < 5; i++) s += `<ellipse cx="${x}" cy="${y - r * .55}" rx="${r * .42}" ry="${r * .6}" fill="${petal}" transform="rotate(${rot + i * 72} ${x} ${y})"/>`;
    return s + `<circle cx="${x}" cy="${y}" r="${r * .26}" fill="${center}"/>`;
  };
  const on = (deg, r, fn) => { const [x, y] = P(deg, r); return fn(x, y); };
  const along = (r, from, to, n, fn) => { let s = ''; for (let i = 0; i < n; i++) s += on(from + (to - from) * (n === 1 ? .5 : i / (n - 1)), r, fn); return s; };
  const grad = (id, stops, x2 = 1, y2 = 1) => `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
  const glow = (id, sd = 2.2) => `<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${sd}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  const cloud = (x, y, s, fill, stroke) => `<g fill="${fill}" stroke="${stroke}" stroke-width="${s * .12}">${[[0, 0, 1], [s * .9, -s * .35, .8], [s * 1.7, 0, .9], [s * .8, s * .25, .85]].map(([dx, dy, k]) => `<circle cx="${x + dx}" cy="${y + dy}" r="${s * .6 * k}"/>`).join('')}</g>`;
  const snow = (x, y, r, c) => { let s = ''; for (let i = 0; i < 3; i++) { const [a, b] = P(i * 60, r); s += `<line x1="${x - a}" y1="${y - b}" x2="${x + a}" y2="${y + b}"/>`; } return `<g stroke="${c}" stroke-width="${r * .22}" stroke-linecap="round">${s}</g><circle cx="${x}" cy="${y}" r="${r * .22}" fill="${c}"/>`; };
  const flame = (x, y, s, rot, c1, c2) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M0 6C-5 3-6-3-2-8C-2-4 1-3 1-6C4-2 6 3 0 6Z" fill="${c1}"/><path d="M0 5C-2 3-2 0 0-2C1 0 2 1 2 2C2 4 1 5 0 5Z" fill="${c2}"/></g>`;
  const fish = (x, y, s, rot, c) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" fill="${c}"><ellipse rx="4" ry="2.2"/><path d="M3 0L6.5-2.4V2.4Z"/><circle cx="-2.2" cy="-.5" r=".55" fill="#13304d"/></g>`;
  const lantern = (x, y, s, f) => `<g transform="translate(${x} ${y}) scale(${s})" filter="url(#${f})"><rect x="-4" y="-5.5" width="8" height="11" rx="3.2" fill="url(#${f}l)"/><rect x="-2.6" y="-6.6" width="5.2" height="1.6" rx=".6" fill="#B5652A"/><rect x="-2.2" y="5" width="4.4" height="1.4" rx=".6" fill="#B5652A"/><path d="M-1.6-5V5M1.6-5V5" stroke="#E38B37" stroke-width=".5" opacity=".7"/></g>`;
  const tri = (x, y, s, rot, c) => `<polygon points="0,${-s} ${s * .87},${s * .5} ${-s * .87},${s * .5}" fill="${c}" transform="translate(${x} ${y}) rotate(${rot})"/>`;
  const dotsField = (cx, cy, rad, step, maxR, color) => {
    let s = '';
    for (let x = cx - rad; x <= cx + rad; x += step) for (let y = cy - rad; y <= cy + rad; y += step) {
      const d = Math.hypot(x - cx, y - cy); if (d > rad) continue;
      if (Math.hypot(x, y) < 51 || Math.abs(x) > 59 || Math.abs(y) > 59) continue;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(maxR * (1 - d / rad) + .3).toFixed(2)}" fill="${color}"/>`;
    }
    return s;
  };
  return { P, ring, star4, star5, flower, on, along, grad, glow, cloud, snow, flame, fish, lantern, tri, dotsField };
})();

const FRAMES = {
  /* ---------- Classic ---------- */
  thin: { name: 'Thin line', cat: 'classic', svg: u => FR.ring(42.6, '#FFFFFF', 1.6, 'opacity=".92"') },
  mono: { name: 'Minimal mono', cat: 'classic', svg: u => FR.ring(43, '#FFFFFF', 2.4) + FR.ring(47.2, '#000000', 4.4) + FR.ring(47.2, '#FFFFFF', 1.2, 'stroke-dasharray="6 5"') + FR.ring(51.2, '#FFFFFF', 1) },

    i.onload = () => { res(i); setTimeout(() => URL.revokeObjectURL(u), 1000); };
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('This picture can’t be opened. Try a JPG or PNG.')); };

}

  const s = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w * s)); cv.height = Math.max(1, Math.round(h * s));

}

/* ---------- Uploads with progress (Supabase Storage over XHR) ---------- */
Media.uploadProgress = async function (path, blob, bucket = 'chat-media', onProgress) {
  const { data } = await sb.auth.getSession();
  const token = data?.session?.access_token;
  if (!token) throw new Error('Your session has expired. Sign in again.');
  const base = String(CLOUD_CFG.supabaseUrl || '').replace(/\/+$/, '');
  const url = `${base}/storage/v1/object/${bucket}/${path.split('/').map(encodeURIComponent).join('/')}`;
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.timeout = 10 * 60 * 1000;
    x.setRequestHeader('Authorization', `Bearer ${token}`);
    x.setRequestHeader('apikey', String(CLOUD_CFG.supabaseAnonKey || ''));
    x.setRequestHeader('x-upsert', 'false');
    x.setRequestHeader('cache-control', 'max-age=31536000');
    x.setRequestHeader('Content-Type', blob.type || 'application/octet-stream');
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) { onProgress?.(1); res(path); return; }
      let msg = ''; try { const j = JSON.parse(x.responseText || '{}'); msg = j.message || j.error || ''; } catch (e) {}
      // Already uploaded by an earlier attempt: that's fine.
      if (x.status === 409 || /already exists|Duplicate/i.test(msg)) { onProgress?.(1); res(path); return; }
      rej(Object.assign(new Error(msg || `Upload failed (${x.status})`), { status: x.status }));
    };
    x.onerror = () => rej(new Error('Failed to fetch'));
    x.ontimeout = () => rej(new Error('Failed to fetch'));
    x.onabort = () => rej(new Error('Upload cancelled'));
    x.send(blob);
  });
};
function paintProgress(msg) {
  const box = document.querySelector(`#msgs [data-mid="${msg.id}"] .media`);
  if (!box) return;
  const p = Math.max(0, Math.min(1, msg.progress || 0));
  box.querySelector('.up-ring')?.style.setProperty('--p', p);
  const t = box.querySelector('.up-pct'); if (t) t.textContent = `${Math.round(p * 100)}%`;
}

/* ---------- Full-screen photo with pinch, double-tap, and wheel zoom ---------- */

}

</div>
    <div class="crop-ctl"><span>${I('image')}</span><input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><span>${I('zoomIn')}</span></div>

  };

  img.onload = () => { st.w = img.naturalWidth; st.h = img.naturalHeight; st.S = stage.clientWidth; paint(); };
  img.onerror = () => { toast('That picture can’t be opened. Try a JPG or PNG.', 'image'); close(); };

    if (!pts.has(e.pointerId) || !g) return; pts.set(e.pointerId, [e.clientX, e.clientY]); const p = [...pts.values()];
    if (p.length >= 2 && g.d) { st.z = Math.min(4, Math.max(1, g.z * Math.hypot(p[0][0] - p[1][0], p[0][1] - p[1][1]) / g.d)); $('#crop-zoom').value = st.z; }

/* =========================================================
   Chat wallpapers: colour, photo, or video, per conversation.
   Saved on the server (chat_wallpapers + private "wallpapers" bucket),

   ========================================================= */
const wallDefaults = () => ({ zoom: 1, x: .5, y: .5, dim: .3, bright: 1, start: 0, len: 0 });

    kind: r.kind, color: /^#[0-9a-f]{6}$/i.test(r.color || '') ? r.color : null,
    path: typeof r.path === 'string' ? r.path : null, poster: typeof r.poster_path === 'string' ? r.poster_path : null,
    s: { zoom: num(s.zoom, 1, 3, 1), x: num(s.x, 0, 1, .5), y: num(s.y, 0, 1, .5), dim: num(s.dim, 0, .85, .3), bright: num(s.bright, .4, 1.3, 1), start: num(s.start, 0, 36000, 0), len: num(s.len, 0, 60, 0) },

ui.wallUrls = new Map();

  get: id => (state.walls || {})[id] || null,
  async load() {
    if (!sb || !Cloud.me) return;
    const { data, error } = await sb.from('chat_wallpapers').select('*');
    if (error) { if (/chat_wallpapers|schema cache|42P01|PGRST205/i.test(`${error.message} ${error.code}`)) Cloud.noCustom = true; throw error; }
    const map = {};
    (data || []).forEach(r => { const w = cleanWall(r); if (w) map[r.conversation_id] = w; });
    state.walls = map; save();
    if (ui.openChatId) applyWallpaper(ui.openChatId);
  },
  /* A local URL for a wallpaper file: from the phone's cache, else downloaded once and cached. */
  async fileUrl(path) {
    if (!path) return null;
    if (ui.wallUrls.has(path)) return ui.wallUrls.get(path);
    const key = `https://zyven.local/wallpapers/${path}`;
    try {
      if ('caches' in window) {
        const cache = await caches.open('zyven-wallpapers-v1');
        let res = await cache.match(key);

  },
  async cacheLocal(path, blob) {

  },

  async save(chatId, w) {
