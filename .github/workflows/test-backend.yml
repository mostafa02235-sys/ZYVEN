name: Test ZYVEN backend

# Starts a private, temporary Supabase server on GitHub's machine, loads the
# ZYVEN database from supabase/migrations, then tests accounts, privacy
# rules, realtime messaging, file storage, and the real app in two browsers.
# Nothing here touches your own Supabase project.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'src/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/test-backend.yml']
  workflow_dispatch:

permissions:
  contents: write  # publishes the test report to the "test-results" branch

jobs:
  test:
    name: Accounts, privacy, and messaging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies and the test browser
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase server with the ZYVEN database
        run: |
          [ -f supabase/config.toml ] || supabase init --force
          if ! grep -q '^\[auth.email.template.recovery\]' supabase/config.toml; then
            printf '\n[auth.email.template.recovery]\nsubject = "Reset your ZYVEN password"\ncontent_path = "./supabase/templates/recovery.html"\n' >> supabase/config.toml
          fi
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector || supabase start
          supabase status -o env > supabase.env
          sed 's/=.*/=…/' supabase.env

      - name: Database rules (93 privacy and permission checks)
        run: |
          set -a; . ./supabase.env; set +a
          set +e
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f tests/db/rls_tests.sql > db-results.txt 2>&1
          code=$?
          set -e
          cat db-results.txt
          summary=$(grep -E '^ +[0-9]+ +\| +[0-9]+$' db-results.txt | tail -1)
          if [ $code -ne 0 ] || [ -z "$summary" ] || [ "$(echo "$summary" | awk '{print $3}')" != "0" ]; then
            msg=$( (grep -E 'FAIL|ERROR|error' db-results.txt; tail -15 db-results.txt) | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Database rules failed::${msg}"
            exit 1
          fi
          echo "::notice title=Database rules::$summary (passed | failed)"

      - name: Build the app against the test server
        run: |
          set -a; . ./supabase.env; set +a
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" npm run build

      - name: End-to-end tests (two accounts, two browsers)
        run: |
          set -a; . ./supabase.env; set +a
          npx --yes http-server www -p 8080 -a 127.0.0.1 -s &
          sleep 3
          set +e
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" \
          MAIL_URL="${MAILPIT_URL:-${INBUCKET_URL:-http://127.0.0.1:54324}}" APP_URL="http://127.0.0.1:8080/index.html" \
          node tests/e2e.mjs > e2e-output.txt 2>&1
          code=$?
          set -e
          cat e2e-output.txt
          echo "::notice title=End-to-end::$(tail -1 e2e-output.txt)"
          if [ $code -ne 0 ]; then
            msg=$( (grep -E '^FAIL|Error|error' e2e-output.txt; tail -5 e2e-output.txt) | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=End-to-end tests failed::${msg}"
            exit 1
          fi

      - name: Photos, wallpapers, and frames (two accounts, two browsers)
        run: |
          set -a; . ./supabase.env; set +a
          curl -s -o /dev/null http://127.0.0.1:8080/index.html || { npx --yes http-server www -p 8080 -a 127.0.0.1 -s & sleep 3; }
          set +e
          SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="${ANON_KEY:-$PUBLISHABLE_KEY}" SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" \
          APP_URL="http://127.0.0.1:8080/index.html" node tests/custom-e2e.mjs > custom-output.txt 2>&1
          code=$?
          set -e
          cat custom-output.txt
          echo "::notice title=Photos, wallpapers, frames::$(tail -1 custom-output.txt)"
          if [ $code -ne 0 ]; then
            msg=$( (grep -E '^FAIL|Error|error' custom-output.txt; tail -5 custom-output.txt) | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Customization tests failed::${msg}"
            exit 1
          fi

      - name: Publish the test report
        if: always()
        run: |
          mkdir -p tests/results
          cp db-results.txt e2e-output.txt custom-output.txt tests/results/ 2>/dev/null || true
          { echo "## Database rules"; echo '```'; tail -90 db-results.txt 2>/dev/null; echo '```'; cat tests/results/e2e.md 2>/dev/null; cat tests/results/custom-e2e.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY" || true
          cd tests/results
          echo "Run ${{ github.run_id }} for ${{ github.sha }}" > RUN.txt
          git init -q
          git checkout -q -b test-results
          git config user.name "zyven-tests"; git config user.email "tests@zyven.invalid"
          git add -A
          git commit -qm "Test results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:test-results 2>&1 | sed 's/x-access-token:[^@]*@/***@/' || echo "::warning::Could not publish the report branch"
